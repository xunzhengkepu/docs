<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 1030" role="img" aria-labelledby="diagram-title"><title id="diagram-title">科普麦子代码与部署架构</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="#53758c"/></marker></defs><style>text{font-family:Microsoft YaHei,Arial,sans-serif;fill:#17364a}.title{font-size:19px;font-weight:700}.small{font-size:15px}.lane{font-size:23px;font-weight:700}</style><rect width="1240" height="1030" fill="#f7fafc"/><rect x="20" y="20" width="730" height="825" rx="20" fill="#eaf3fa"/><text x="44" y="59" class="lane">Windows 本机 · 微信接入与业务处理</text><rect x="775" y="20" width="445" height="825" rx="20" fill="#edf7f1"/><text x="799" y="59" class="lane">阿里云 · 网页与查询服务</text><rect x="45" y="90" width="305" height="100" rx="14" fill="#ffffff" stroke="#b8c9d6"/><text x="63" y="119" class="title">微信客户端</text><text x="63" y="145" class="small">本地消息数据库 / 媒体缓存</text><text x="63" y="166" class="small">真实收发与原生下载执行者</text><rect x="410" y="90" width="310" height="100" rx="14" fill="#ffffff" stroke="#b8c9d6"/><text x="428" y="119" class="title">采集与归档</text><text x="428" y="145" class="small">refresh / wx-reader / import</text><text x="428" y="166" class="small">archive.sqlite + 唤醒文件</text><path d="M350 140 L410 140" stroke="#53758c" stroke-width="2" fill="none" marker-end="url(#a)"/><rect x="410" y="265" width="310" height="100" rx="14" fill="#ffffff" stroke="#b8c9d6"/><text x="428" y="294" class="title">cloud-sync</text><text x="428" y="320" class="small">按游标增量同步消息</text><text x="428" y="341" class="small">媒体任务独立异步执行</text><path d="M565 190 L565 265" stroke="#53758c" stroke-width="2" fill="none" marker-end="url(#a)"/><rect x="800" y="90" width="395" height="100" rx="14" fill="#ffffff" stroke="#b8c9d6"/><text x="818" y="119" class="title">员工浏览器</text><text x="818" y="145" class="small">public/ 原生 HTML / CSS / JS</text><text x="818" y="166" class="small">搜索、消息流、媒体、发送、跟进</text><rect x="800" y="265" width="395" height="100" rx="14" fill="#ffffff" stroke="#b8c9d6"/><text x="818" y="294" class="title">Node HTTP 服务</text><text x="818" y="320" class="small">server / cloud-store / archive-events</text><text x="818" y="341" class="small">登录鉴权 · HTTP API · SSE 更新</text><path d="M998 190 L998 265" stroke="#53758c" stroke-width="2" fill="none" marker-end="url(#a)"/><text x="998.0" y="215.5" text-anchor="middle" class="small">查询 / 操作</text><path d="M720 315 L800 315" stroke="#53758c" stroke-width="2" fill="none" marker-end="url(#a)"/><text x="760.0" y="303.0" text-anchor="middle" class="small">HTTPS</text><rect x="800" y="440" width="395" height="100" rx="14" fill="#ffffff" stroke="#b8c9d6"/><text x="818" y="469" class="title">云端数据与任务队列</text><text x="818" y="495" class="small">消息查询副本 / outbox / 员工状态</text><text x="818" y="516" class="small">媒体缓存 / 语音转写任务与结果</text><path d="M998 365 L998 440" stroke="#53758c" stroke-width="2" fill="none" marker-end="url(#a)"/><rect x="410" y="440" width="310" height="100" rx="14" fill="#ffffff" stroke="#b8c9d6"/><text x="428" y="469" class="title">send-worker</text><text x="428" y="495" class="small">领取发送任务 → 原生发送适配</text><text x="428" y="516" class="small">上报结果；不确定结果停止重发</text><path d="M800 490 L720 490" stroke="#53758c" stroke-width="2" fill="none" marker-end="url(#a)"/><text x="760.0" y="478.0" text-anchor="middle" class="small">领取 / 回执</text><rect x="45" y="265" width="305" height="100" rx="14" fill="#ffffff" stroke="#b8c9d6"/><text x="63" y="294" class="title">媒体处理</text><text x="63" y="320" class="small">图片原件 → 清晰预览图</text><text x="63" y="341" class="small">视频预览压缩 / SILK → WAV</text><path d="M197 190 L197 265" stroke="#53758c" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M350 315 L410 315" stroke="#53758c" stroke-width="2" fill="none" marker-end="url(#a)"/><rect x="45" y="440" width="305" height="100" rx="14" fill="#ffffff" stroke="#b8c9d6"/><text x="63" y="469" class="title">原生操作协调层</text><text x="63" y="495" class="small">native-send / 下载协调器</text><text x="63" y="516" class="small">互斥 · 账号/版本校验 · 生命周期</text><path d="M410 490 L350 490" stroke="#53758c" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M197 440 L197 365" stroke="#53758c" stroke-width="2" fill="none" marker-end="url(#a)"/><text x="197.0" y="390.5" text-anchor="middle" class="small">下载落盘</text><rect x="45" y="615" width="305" height="100" rx="14" fill="#ffffff" stroke="#b8c9d6"/><text x="63" y="644" class="title">作品状态 worker</text><text x="63" y="670" class="small">task-state-worker → live_state</text><text x="63" y="691" class="small">身份 / 作品关联 / 角色规则</text><rect x="410" y="615" width="310" height="100" rx="14" fill="#ffffff" stroke="#b8c9d6"/><text x="428" y="644" class="title">PostgreSQL 业务主库</text><text x="428" y="670" class="small">business + workflow</text><text x="428" y="691" class="small">状态 / 历史 / 游标 / 同步 outbox</text><path d="M350 665 L410 665" stroke="#53758c" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M410 140 H382 V575 H197 V615" fill="none" stroke="#53758c" stroke-width="2" stroke-dasharray="5 5" marker-end="url(#a)"/><text x="58" y="594" class="small">状态输入来自采集后的归档，非直接驱动微信</text><rect x="800" y="615" width="395" height="100" rx="14" fill="#ffffff" stroke="#b8c9d6"/><text x="818" y="644" class="title">媒体展示与转写展示</text><text x="818" y="670" class="small">预览优先；原件按需请求</text><text x="818" y="691" class="small">播放与转写状态分别管理</text><path d="M998 540 L998 615" stroke="#53758c" stroke-width="2" fill="none" marker-end="url(#a)"/><text x="48" y="774" class="small">原生适配只在本机调用微信；云端不直接操控微信。</text><text x="48" y="802" class="small">图中为逻辑数据流；发送与下载共用协调锁，媒体处理不阻塞消息增量同步。</text><rect x="45" y="900" width="480" height="100" rx="14" fill="#fff4df" stroke="#b8c9d6"/><text x="63" y="929" class="title">Qwen ASR · 外部服务</text><text x="63" y="955" class="small">本机发送音频 → 返回转写文本</text><text x="63" y="976" class="small">语音消息 + 指定范围内的视频开头</text><rect x="715" y="900" width="480" height="100" rx="14" fill="#fff4df" stroke="#b8c9d6"/><text x="733" y="929" class="title">飞书 · 外部协作视图</text><text x="733" y="955" class="small">本地提交成功后异步同步作品进度</text><text x="733" y="976" class="small">核对远端、回读；人工冲突时暂停</text><path d="M45 315 H26 V870 H197 V900" stroke="#b58b3e" stroke-width="2" fill="none" stroke-dasharray="5 5" marker-end="url(#a)"/><path d="M565 715 V870 H955 V900" stroke="#53758c" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M350 520 H368 V165 H350" stroke="#53758c" stroke-width="2" fill="none" marker-end="url(#a)"/></svg>