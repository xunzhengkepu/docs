<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1040" role="img" aria-labelledby="title desc">
<title id="title">科普麦子：本机、云端与外部服务</title><desc id="desc">Windows 执行微信接入与业务逻辑；阿里云服务员工网页。本机 PostgreSQL 是业务主库，云端 PostgreSQL 为单向同步副本。</desc>
