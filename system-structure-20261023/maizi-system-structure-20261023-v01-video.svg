<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 1050" role="img" aria-labelledby="title"><title id="title">微信视频从消息到任务状态以及失败后员工私信的实际流程</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="#567182"/></marker></defs><style>text{font-family:"Microsoft YaHei",Arial,sans-serif;fill:#183647}.lane{font-size:25px;font-weight:700}.heading{font-size:21px;font-weight:700}.body{font-size:17px}.edge{font-size:15px;fill:#415d6d}</style><rect width="100%" height="100%" fill="#f5f8fa"/><text x="35" y="45" class="lane">视频处理：每一层成功都单独确认</text><rect x="35" y="85" width="400" height="140" rx="16" fill="#fff" stroke="#bdcdd7"/><text x="53" y="117" class="heading">1. 群视频消息</text><text x="53" y="147" class="body">archive 保存 UID、群、时间与发送人</text><text x="53" y="172" class="body">气泡出现仅代表收到消息</text><rect x="520" y="85" width="400" height="140" rx="16" fill="#fff" stroke="#bdcdd7"/><text x="538" y="117" class="heading">2. 读取精确消息与本地探测</text><text x="538" y="147" class="body">已存在文件先验证；尚无文件才下载</text><text x="538" y="172" class="body">临时缺引用可重试；撤回单独记录</text><rect x="1005" y="85" width="400" height="140" rx="16" fill="#fff" stroke="#bdcdd7"/><text x="1023" y="117" class="heading">3. 微信原生下载</text><text x="1023" y="147" class="body">下载调用返回 ≠ 文件下载成功</text><text x="1023" y="172" class="body">短时加载、互斥、卸载与生命周期日志</text><rect x="1005" y="330" width="400" height="140" rx="16" fill="#fff" stroke="#bdcdd7"/><text x="1023" y="362" class="heading">4. 文件落盘与内容校验</text><text x="1023" y="392" class="body">MD5 / 精确原生引用、稳定性、时长</text><text x="1023" y="417" class="body">文件名和 XML 字节数只辅助查找</text><rect x="520" y="330" width="400" height="140" rx="16" fill="#fff" stroke="#bdcdd7"/><text x="538" y="362" class="heading">5. PostgreSQL 视频目录</text><text x="538" y="392" class="body">videos + workflow.video_observations</text><text x="538" y="417" class="body">保存路径、实际大小、时长与 SHA-256</text><rect x="35" y="330" width="400" height="140" rx="16" fill="#fff" stroke="#bdcdd7"/><text x="53" y="362" class="heading">6. 转写 + 文稿匹配</text><text x="53" y="392" class="body">大于 2分30秒；从前20秒开始</text><text x="53" y="417" class="body">不足40有效字逐次加20秒，上限120秒</text><rect x="35" y="575" width="400" height="140" rx="16" fill="#fff" stroke="#bdcdd7"/><text x="53" y="607" class="heading">7. 按 task 合并候选</text><text x="53" y="637" class="body">文本匹配分数 ≥80%；同 task 多稿合并</text><text x="53" y="662" class="body">跨 task 仍不唯一时等待核对</text><rect x="520" y="575" width="400" height="140" rx="16" fill="#fff" stroke="#bdcdd7"/><text x="538" y="607" class="heading">8. 状态规则 + 事务提交</text><text x="538" y="637" class="body">任务当前状态、角色与事实一起判断</text><text x="538" y="662" class="body">tasks.status / version + status_history</text><rect x="1005" y="575" width="400" height="140" rx="16" fill="#fff" stroke="#bdcdd7"/><text x="1023" y="607" class="heading">9. 对外状态同步</text><text x="1023" y="637" class="body">提交成功后处理 workflow.outbox</text><text x="1023" y="662" class="body">飞书同步失败不撤销已提交的业务事实</text><path d="M435 155 H520" fill="none" stroke="#567182" stroke-width="2" marker-end="url(#arrow)"/><path d="M920 155 H1005" fill="none" stroke="#567182" stroke-width="2" marker-end="url(#arrow)"/><path d="M1205 225 V330" fill="none" stroke="#567182" stroke-width="2" marker-end="url(#arrow)"/><path d="M1005 400 H920" fill="none" stroke="#567182" stroke-width="2" marker-end="url(#arrow)"/><path d="M520 400 H435" fill="none" stroke="#567182" stroke-width="2" marker-end="url(#arrow)"/><path d="M235 470 V575" fill="none" stroke="#567182" stroke-width="2" marker-end="url(#arrow)"/><path d="M435 645 H520" fill="none" stroke="#567182" stroke-width="2" marker-end="url(#arrow)"/><path d="M920 645 H1005" fill="none" stroke="#567182" stroke-width="2" marker-end="url(#arrow)"/><rect x="35" y="795" width="1370" height="220" rx="16" fill="#fff0dc" stroke="#d6be91"/><text x="55" y="835" class="heading">失败支路：先重试与复查，再考虑私信员工</text><text x="55" y="877" class="body">可重试失败：首次 + 最多3次重试；退避1 / 5 / 15分钟；单次等待落盘15分钟。</text><text x="55" y="911" class="body">终止失败 → 再探测本地文件 → 验证在职员工、当前群成员和已有私聊 → send-worker。</text><text x="55" y="945" class="body">每条消息最多一条提醒；员工间隔5分钟；发送前再次核对；结果不确定时停止自动重发。</text><text x="55" y="979" class="body">没有可靠员工身份就暂存；不向医生或群聊兜底发送。撤回、已恢复、尚在重试的视频不进入提醒。</text><path d="M1405 155 H1420 V770 H1205 V795" fill="none" stroke="#567182" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/></svg>