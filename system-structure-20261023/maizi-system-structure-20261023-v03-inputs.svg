<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 580" role="img" aria-labelledby="title"><title id="title">保留微信直接传输和阿里云盘分享两类视频入口</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="#567182"/></marker></defs><style>text{font-family:"Microsoft YaHei",Arial,sans-serif;fill:#183647}.lane{font-size:25px;font-weight:700}.heading{font-size:21px;font-weight:700}.body{font-size:17px}.edge{font-size:15px;fill:#415d6d}</style><rect width="100%" height="100%" fill="#f5f8fa"/><text x="35" y="45" class="lane">两种收片入口都保留；共同遵守 task 关联和状态证据规则</text><rect x="35" y="90" width="340" height="125" rx="16" fill="#fff" stroke="#bdcdd7"/><text x="53" y="122" class="heading">微信直接传视频</text><text x="53" y="152" class="body">群视频消息 / 微信媒体缓存</text><text x="53" y="177" class="body">现有自动下载与校验通道</text><rect x="485" y="90" width="390" height="125" rx="16" fill="#fff" stroke="#bdcdd7"/><text x="503" y="122" class="heading">微信视频证据</text><text x="503" y="152" class="body">已验证文件 → 转写 → 文稿匹配</text><text x="503" y="177" class="body">身份与 task 归属确认</text><rect x="35" y="300" width="340" height="125" rx="16" fill="#fff" stroke="#bdcdd7"/><text x="53" y="332" class="heading">阿里云盘分享链接</text><text x="53" y="362" class="body">少量医生使用，继续支持</text><text x="53" y="387" class="body">链接 + 提取码 + 群聊来源</text><rect x="485" y="300" width="390" height="125" rx="16" fill="#fff" stroke="#bdcdd7"/><text x="503" y="332" class="heading">现有云盘专用适配器</text><text x="503" y="362" class="body">下载视频/文稿，保留文件 ID/哈希</text><text x="503" y="387" class="body">候选报告；仍有专用核对环节</text><rect x="1000" y="170" width="400" height="175" rx="16" fill="#fff" stroke="#bdcdd7"/><text x="1018" y="202" class="heading">同一套业务规则</text><text x="1018" y="232" class="body">验证实际文件和文稿/task 对应</text><text x="1018" y="257" class="body">按角色、当前状态与完成事实判断</text><text x="1018" y="282" class="body">tasks + status_history 事务提交</text><path d="M375 152 H485" fill="none" stroke="#567182" stroke-width="2" marker-end="url(#arrow)"/><path d="M875 152 H930 V210 H1000" fill="none" stroke="#567182" stroke-width="2" marker-end="url(#arrow)"/><path d="M375 362 H485" fill="none" stroke="#567182" stroke-width="2" marker-end="url(#arrow)"/><path d="M875 362 H930 V300 H1000" fill="none" stroke="#567182" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/><text x="902" y="397" class="edge">统一自动接入仍需补齐</text><text x="35" y="488" class="body">实线：现有通道；虚线：保留云盘入口后，仍需统一的 task 自动接入环节。</text><text x="35" y="532" class="body">来源不同不增加业务状态；“已上传”只触发检查，实际文件与任务归属才构成进度证据。</text></svg>