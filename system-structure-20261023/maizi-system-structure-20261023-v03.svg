<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1540 1510" role="img" aria-labelledby="title"><title id="title">科普麦子实际部署结构：本地主写、阿里云 PostgreSQL 业务快照、聊天查询与外部服务</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="#567182"/></marker></defs><style>text{font-family:"Microsoft YaHei",Arial,sans-serif;fill:#183647}.lane{font-size:25px;font-weight:700}.heading{font-size:21px;font-weight:700}.body{font-size:17px}.edge{font-size:15px;fill:#415d6d}</style><rect width="100%" height="100%" fill="#f5f8fa"/><rect x="20" y="20" width="960" height="1030" rx="16" fill="#eaf2f8" stroke="none"/><rect x="1000" y="20" width="520" height="1030" rx="16" fill="#edf6ee" stroke="none"/><text x="45" y="62" class="lane">Windows 本机 · 采集、业务判断、微信操作</text><text x="1025" y="62" class="lane">阿里云 ECS · 网页、查询与业务副本</text><rect x="50" y="110" width="300" height="115" rx="16" fill="#fff" stroke="#bdcdd7"/><text x="68" y="142" class="heading">微信客户端</text><text x="68" y="172" class="body">消息数据库 / 媒体缓存</text><text x="68" y="197" class="body">真实收发、原生视频下载</text><rect x="420" y="110" width="520" height="115" rx="16" fill="#fff" stroke="#bdcdd7"/><text x="438" y="142" class="heading">消息采集与标准归档</text><text x="438" y="172" class="body">refresh → wx-reader → import</text><text x="438" y="197" class="body">独立采集进程；归档提交后发出唤醒</text><rect x="420" y="295" width="520" height="115" rx="16" fill="#fff" stroke="#bdcdd7"/><text x="438" y="327" class="heading">本地 archive.sqlite</text><text x="438" y="357" class="body">消息 UID / M编号 / 群 / 发送人 / 引用</text><text x="438" y="382" class="body">供云同步与状态 worker 读取</text><rect x="50" y="295" width="300" height="115" rx="16" fill="#fff" stroke="#bdcdd7"/><text x="68" y="327" class="heading">视频与文件处理</text><text x="68" y="357" class="body">video-opening-worker</text><text x="68" y="382" class="body">下载、校验、音频与预览</text><rect x="50" y="480" width="300" height="115" rx="16" fill="#fff" stroke="#bdcdd7"/><text x="68" y="512" class="heading">原生微信适配</text><text x="68" y="542" class="body">精确消息、版本与账号校验</text><text x="68" y="567" class="body">发送与下载共用互斥锁</text><rect x="420" y="480" width="520" height="115" rx="16" fill="#fff" stroke="#bdcdd7"/><text x="438" y="512" class="heading">task-state-worker → live_state.py</text><text x="438" y="542" class="body">身份与文稿识别 → 视频匹配 → 状态规则</text><text x="438" y="567" class="body">本地 Whisper；科普流程按 task 判断</text><rect x="420" y="665" width="520" height="115" rx="16" fill="#fff5dc" stroke="#bdcdd7"/><text x="438" y="697" class="heading">本地 PostgreSQL 18.6 · maizi_business</text><text x="438" y="727" class="body">business 13表：task、状态历史、视频等</text><text x="438" y="752" class="body">workflow 11表：决策、证据、游标、同步日志</text><rect x="50" y="850" width="300" height="115" rx="16" fill="#fff" stroke="#bdcdd7"/><text x="68" y="882" class="heading">send-worker</text><text x="68" y="912" class="body">云端发送任务 + 本地失败提醒</text><text x="68" y="937" class="body">只在本机调用原生发送</text><rect x="420" y="850" width="520" height="115" rx="16" fill="#fff" stroke="#bdcdd7"/><text x="438" y="882" class="heading">cloud-sync + source-ready-sync</text><text x="438" y="912" class="body">消息增量上传；媒体任务独立处理</text><text x="438" y="937" class="body">本机主动 HTTPS 连接云端，不需入站端口</text><rect x="1030" y="110" width="460" height="115" rx="16" fill="#fff" stroke="#bdcdd7"/><text x="1048" y="142" class="heading">员工浏览器</text><text x="1048" y="172" class="body">maizi.xinanzhineng.com</text><text x="1048" y="197" class="body">查群聊、看媒体、发消息与附件</text><rect x="1030" y="295" width="460" height="115" rx="16" fill="#fff" stroke="#bdcdd7"/><text x="1048" y="327" class="heading">nginx HTTPS → Node HTTP 服务</text><text x="1048" y="357" class="body">server.mjs / cloud-store / HTTP API / SSE</text><text x="1048" y="382" class="body">systemd 管理；数据目录不作静态公开</text><rect x="1030" y="480" width="460" height="115" rx="16" fill="#fff" stroke="#bdcdd7"/><text x="1048" y="512" class="heading">云端 archive.sqlite + outbox.sqlite</text><text x="1048" y="542" class="body">聊天查询副本、身份映射 / 发送任务</text><text x="1048" y="567" class="body">云端不直接读取 Windows PostgreSQL</text><rect x="1030" y="665" width="460" height="115" rx="16" fill="#fff" stroke="#bdcdd7"/><text x="1048" y="697" class="heading">云端媒体索引、任务与缓存</text><text x="1048" y="727" class="body">图片、文档、语音、视频预览等</text><text x="1048" y="752" class="body">浏览器上传附件另有云端暂存</text><rect x="1030" y="825" width="460" height="140" rx="16" fill="#fff5dc" stroke="#bdcdd7"/><text x="1048" y="857" class="heading">云端 PostgreSQL 18.6 · 业务副本</text><text x="1048" y="887" class="body">maizi_business · business + workflow</text><text x="1048" y="912" class="body">本次快照同步已校验；暂未切换主写</text><text x="1048" y="937" class="body">后续目标：云端接替本地业务库</text><text x="1035" y="1003" class="body">网页聊天仍查 SQLite；业务副本尚非实时复制。</text><path d="M940 745 H980 V895 H1030" fill="none" stroke="#567182" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/><text x="838" y="816" class="edge">本次全量快照</text><path d="M350 166 H420" fill="none" stroke="#567182" stroke-width="2" marker-end="url(#arrow)"/><path d="M680 225 V295" fill="none" stroke="#567182" stroke-width="2" marker-end="url(#arrow)"/><path d="M200 225 V295" fill="none" stroke="#567182" stroke-width="2" marker-end="url(#arrow)"/><path d="M200 410 V480" fill="none" stroke="#567182" stroke-width="2" marker-end="url(#arrow)"/><text x="212" y="451" class="edge">下载请求</text><path d="M680 410 V480" fill="none" stroke="#567182" stroke-width="2" marker-end="url(#arrow)"/><path d="M350 352 H385 V537 H420" fill="none" stroke="#567182" stroke-width="2" marker-end="url(#arrow)"/><text x="355" y="460" class="edge">媒体证据</text><path d="M680 595 V665" fill="none" stroke="#567182" stroke-width="2" marker-end="url(#arrow)"/><text x="695" y="635" class="edge">同一事务写状态 + 历史</text><path d="M200 850 V595" fill="none" stroke="#567182" stroke-width="2" marker-end="url(#arrow)"/><text x="212" y="744" class="edge">调用微信</text><path d="M50 536 H35 V167 H50" fill="none" stroke="#567182" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/><path d="M940 350 H965 V907 H940" fill="none" stroke="#567182" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/><path d="M940 907 H1008 V350 H1030" fill="none" stroke="#567182" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/><text x="813" y="1008" class="edge">HTTPS 增量 / 任务</text><path d="M1260 225 V295" fill="none" stroke="#567182" stroke-width="2" marker-end="url(#arrow)"/><path d="M1260 410 V480" fill="none" stroke="#567182" stroke-width="2" marker-end="url(#arrow)"/><path d="M1260 595 V665" fill="none" stroke="#567182" stroke-width="2" marker-end="url(#arrow)"/><path d="M1030 550 H993 V1027 H200 V965" fill="none" stroke="#567182" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/><text x="386" y="1014" class="edge">领取云端发送任务；结果回报</text><rect x="20" y="1070" width="1500" height="140" rx="16" fill="#fff4e3" stroke="none"/><text x="45" y="1104" class="heading">外部服务（与 ECS 数据库、阿里云盘是不同用途）</text><text x="50" y="1144" class="body">Qwen ASR：聊天语音 / 原有指定范围的视频开头转写；本机调用 API。</text><text x="50" y="1178" class="body">飞书：当前仍启用状态投影与已有映射同步；业务事实先提交本地 PostgreSQL。</text><rect x="20" y="1240" width="1500" height="250" rx="16" fill="#eef4fc" stroke="none"/><text x="45" y="1278" class="lane">保留的第二入口 · 少量医生通过阿里云盘分享视频</text><rect x="50" y="1300" width="400" height="125" rx="16" fill="#fff" stroke="#bdcdd7"/><text x="68" y="1332" class="heading">阿里云盘分享链接</text><text x="68" y="1362" class="body">群消息关联到已配置分享目录</text><text x="68" y="1387" class="body">有效链接与提取码；与 ECS 数据库独立</text><rect x="535" y="1300" width="440" height="125" rx="16" fill="#fff" stroke="#bdcdd7"/><text x="553" y="1332" class="heading">本地云盘适配器</text><text x="553" y="1362" class="body">yili-video-monitor.mjs（现有入口）</text><text x="553" y="1387" class="body">下载视频/文稿，计算哈希，生成候选</text><rect x="1060" y="1300" width="430" height="125" rx="16" fill="#fff" stroke="#bdcdd7"/><text x="1078" y="1332" class="heading">云盘证据与任务关联</text><text x="1078" y="1362" class="body">保留 file_id、来源消息与本地证据</text><text x="1078" y="1387" class="body">现有专用核对；统一自动接入仍需补齐</text><path d="M450 1360 H535" fill="none" stroke="#567182" stroke-width="2" marker-end="url(#arrow)"/><path d="M975 1360 H1060" fill="none" stroke="#567182" stroke-width="2" marker-end="url(#arrow)"/><text x="50" y="1463" class="body">业务规则相同：验证实际文件和 task 归属后推进状态；一句“已上传”不能替代文件证据。</text></svg>