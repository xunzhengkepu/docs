1-10T12:00:00+08:00", "transcript": "依家糖尿病嘅患病率系越嚟越高，糖尿病发病呈一个年轻化嘅趋势。年輕人究竟應該點樣避免得二型糖尿病？其實我覺得有五件事一定要做好。首先我問下你，糖尿病究竟系點樣嚟嘅？好多人會覺得系咪我食糖食多咗，系咪飲奶茶飲多咗，其實。 長期嘅高糖飲食呢，確實系會增加得二型糖尿病嘅風險。但系如果話食糖就一定會得糖尿病，咁醫院呢一早就逼爆曬人啦，企都企唔落人。其實好多人糖尿病系身體對胰島素嘅反應越嚟越差，我哋可以理解為胰島素抵抗。而線一開始。 可以多分泌一啲胰島素嚟頂住佢，但後嚟發覺代償唔過嚟啦，咁我哋血糖咧就會逐漸咁升高。呢入邊既有生活方式嘅影響，亦有遺傳嘅原因。好多年輕人發現咗糖尿病，往往系血糖一早就已經唔正常啦，只系自己一直都唔知道。國際糖尿病。 idf流行病學嘅調查顯示，二零二四年我哋中國成人糖尿病嘅患病率已經達到咗百分之十一点九，亦即系話一百個人之中有接近十二個糖尿病患者。其實呢啲人入邊，自己知道有糖尿病嘅咧，做唔到有四成，所以呢下邊呢。 五點，希望大家可以認認真真咁樣睇完佢，從今日開始就要做好佢，唔好等到高血糖傷害到我哋嘅血管啦、眼啦、腎臟咧，而再嚟後悔。第一條咧就係體檢要查血糖，一定唔好漏咗三個指標，空腹血糖、飯後兩個鐘頭血糖、糖化血紅蛋白。 呢三個重要嘅指標，好多人覺得我唔頸渴，亦唔尿多，食飯都系正常嘅，有乜可能得糖尿病呢？但問題就係二型糖尿病早期症狀系唔典型，唔明顯嘅，千祈唔好等到出現咗三多一少嘅典型症狀先系去檢查。如果你超重，肚腩大，個頸。", "seconds": 120, "stop": "max_duration", "basis": "最新匹配缓存候选", "documents": [{"messageId": 204116, "title": "KP10 曾炼坤 Z 年轻人避免得糖尿病，这五件事千万要做好", "recordedScore": 0.3652, "body": "封面：年轻人避免得糖尿病，这五件事千万要做好\n标题：年轻人如何远离糖尿病：五件事比少吃糖重要\n#抖出健康知识宝藏 #健康科普进行时#稳压护心#夜间高血压#糖尿病\n\n年轻人怎么避免得2型糖尿病？有五件事，一定得做好。先问你一句，糖尿病到底是怎么来的？很多人说，不就是糖吃多了、奶茶喝多了吗？\n长期的高糖饮食，确实会增加风险，但如果说吃糖就会有糖尿病，那医院早就挤爆了，站不下人了。\n很多2型糖尿病，是身体对胰岛素的反应越来越差，胰腺一开始还能多分泌一些顶着，后来补偿不过来了，血糖才逐渐升高。这里面既有生活方式的影响，也有遗传的原因。\n年轻人走到糖尿病，往往是血糖早就不正常了，只是自己一直不知道。\n一项研究发现，2018年中国成年人糖尿病患病率，每八个人里就有一个。但在这些人里面，知道自己有糖尿病的，还不到四成。\n所以下面这五点，希望大家认认真真看完。从今天开始好好做，别等到高血糖伤害血管、眼睛、肾脏了再后悔。\n第一条，体检查血糖，一定不要漏掉三个指标：空腹血糖、饭后两小时血糖、糖化血红蛋白怎么样？很多人觉得，我不口渴、不尿多，吃饭也正常，怎么可能有糖尿病？但问题是，2型糖尿病早期明显症状，不能等到“三多一少”都出现了才去检查。如果你超重、肚子大，脖子上有黑黑的东西洗不干净，父母、兄弟姐妹有糖尿病，或者自己有过妊娠期糖尿病、多囊卵巢综合征，就更应该主动问医生筛查，别拿年轻当保险。\n第二条，血糖亮黄灯了，千万别装看不见。检查提示糖尿病前期，意思是血糖已经超出正常范围，但还没有达到糖尿病的诊断标准。如果医生让你回去调整，别不当回事，把报告扔在一边。\n因为这时候是预防 2 型糖尿病的关键时期，超重的人减一减肚子，最好减掉体重的5%，就有机会降低血糖、不让自己发展成2型糖尿病。\n如果坚持3 到 6 个月，血糖还是往上走，该吃药也得吃药，跟着医生规范吃。\n第三条，遇到不舒服的情况，千万别硬扛。如果还伴有恶心、呕吐、腹痛、呼吸又深又快，或者人明显犯困、精神不对，就要立即打120，这可能是糖尿病酮症酸中毒，是要命的急症。\n第四条，血糖有问题，别自己乱吃药。很多人一听说血糖高，第一反应不是正规就诊，而是买降糖茶、偏方。里面不知道什么成分，也没有可靠的临床证据，不建议随便用。\n还有一些药物，本身可能升高血糖，比如糖皮质激素。不是说完全不能用，而是如果确实需要用，尤其需要较长时间使用，要告诉医生自己的血糖情况和家族史，按要求监测。\n第五条，把真正能够改变的危险因素管住。别一边担心糖尿病，一边猛吃碳水，天天久坐，高血压、高血脂都不控制。\n预防2型糖尿病，不能只盯着嘴里那一口甜不甜，更要看每天吃进去的食物，有多少会转化成糖。\n把含糖饮料尽量换成白水，饮食注意总量，主食控制在一个拳头大小，在里面加入一些荞麦、燕麦等等粗粮，优先保证每餐有一大盘绿叶蔬菜，再搭配优质蛋白，鸡蛋、鱼虾、瘦肉、豆制品轮着吃。少吃深加工的食物，比如火腿、香肠、培根、腊肉，每周争取至少150分钟中等强度运动，坐一个小时站起来走一走，哪怕没有整块的运动时间，上下班多走两步，也会有新的改变。\n最后再强调一下，年轻不等于血糖一定正常，家里没人得糖尿病，也不等于自己没有风险。下次体检，记住三件事：看清血糖结果，了解自己的风险，有异常就及时复查。检查是为了早点发现，真正降低2型糖尿病风险，还得靠每天把饮食、运动和体重管理落实好。\n\n", "source": "本地DOCX；已核对候选记录MD5", "error": "", "recomputedScore": 0.3652}, {"messageId": 207285, "title": "KP14 曾炼坤 Z 体检发现血糖高，不想发展成糖尿病，记住这个逆转方法", "recordedScore": 0.0964, "body": "封面：体检发现血糖高，不想发展成糖尿病，记住这个逆转方法\n标题：体检突然发现血糖高了，不想发展成糖尿病，应该怎么吃怎么做？\n#抖出健康知识宝藏 #健康科普进行时#稳压护心#夜间高血压#高血糖\n\n体检发现血糖高，但又没到糖尿病的标准，该怎么做才能避免它变成糖尿病？其实血糖偏高是身体给我们发出的预警，如果能及时干预，很多人能把血糖拉回来，不至于戴上糖尿病的帽子。\n首先血糖多高就是高了？空腹血糖正常是3.9到6.1，超过6.1就是高了。但不能只看空腹血糖一个指标，还有两个指标高了，也会有糖尿病的风险。\n一个是餐后两小时血糖，测的是从你吃第一口饭开始算的血糖，正常是低于7.8；超过7.8也是高；\n另一个是糖化血红蛋白，就好像成绩单一样，反映的是最近两三个月的血糖，如果超过5.7，也要及时干预。\n一旦空腹大于7.0，餐后两小时大于11.1，糖化大于6.5，就要高度警惕糖尿病了。\n那在这之前，我们要怎么干预？\n指南推荐的、最重要的一点就是减重。胖糖友减掉体重的5%到7%，血糖代谢就会有很明显的改善。但这不是让你饿肚子，马上瘦十斤，而是要科学调整饮食结构，记住吃饭的四条原则。\n第一，每餐先吃蔬菜，再吃肉，最后吃主食。蔬菜最好占到一餐的一半，它的饱腹感强，还能延缓主食吸收，让餐后血糖慢一点升高。不过像土豆、山药、莲藕、南瓜这些淀粉类蔬菜，吃了它们就要相应减少主食。\n第二，每餐要有一份优质蛋白。鸡蛋、鱼肉、瘦肉、豆制品都可以。蛋白质消化得慢，还可以帮你长肌肉。\n第三，主食减量，粗细搭配。米饭、面条、馒头升糖快，可以掺一半粗粮，比如燕麦、糙米、杂豆等等。分量控制在一个拳头大小，少吃糊状的、水多的主食。\n第四，找出隐形糖。很多人觉得自己不喝糖水，怎么血糖会高？但饼干、沙琪玛、酸奶，这里面糖一点都不少。\n饮食说完了，再来说运动，这里推荐中等强度有氧运动。快走、慢跑、骑车、游泳、跳操都可以，强度以微微出汗、能说话但不能唱歌为准。\n每周至少150分钟，分摊下来就是每周五天、每次三十分钟。最好放在餐后一小时左右。每周可以安排两到三次力量训练。肌肉是消耗糖分非常重要的器官，肌肉量上去了，基础血糖会更稳。\n那怎么在家测血糖呢？\n首先，血糖仪一定要选正规厂家、国家批准上市的产品。\n其次，试纸要配套，过期、受潮都会让结果不准。\n采血前先把手洗干净，消毒后再扎，消毒最好用酒精，别用碘酒；不是扎指腹，最好选手指两侧，痛感更低；扎完后等血液自己流出来，不要用力挤压手指，以免测出来偏低。\n但不要天天都去扎手指，可以这样安排：每周挑两到三天，测空腹血糖，再加上一餐的餐后两小时血糖。每次测完，把数值、吃饭情况和当天运动情况一起记下来，复诊的时候拿给医生看，方便调整方案。如果哪天吃得比较丰盛，或者感觉乏力、口渴，可以多加测一次餐后。\n血糖偏高虽然还不是糖尿病，但是绝对不能放任不管。尤其是家里直系亲属有糖尿病，本身又有高血压、高血脂、脂肪肝的人，都属于高危人群，进展风险会比普通人高很多。\n饮食、运动、体重管理、定期监测，这几件事一起抓。很多人坚持半年一年之后，血糖慢慢回到正常区间，一直维持住，就可以降低糖尿病的风险。如果坚持生活方式干预三个月，复查血糖还是高，甚至比之前还高，一定要及时到内分泌科挂号，看看有没有必要吃药。尤其是有高血压、高血脂、多囊、黑棘皮症等等问题的人，更要找医生评估，不能自己买药吃，也不能完全不管。\n", "source": "本地DOCX；已核对候选记录MD5", "error": "", "recomputedScore": 0.0964}, {"messageId": 221822, "title": "KP18 曾炼坤 Z 糖尿病不是戒糖戒主食，而是理解胰腺作用", "recordedScore": 0.078, "body": "封面：糖尿病不是戒糖戒主食，而是理解胰腺作用\n标题：糖尿病不是戒糖戒主食，关键看胰腺和胰岛素发生了什么\n#抖出健康知识宝藏 #健康科普进行时#稳压护心#夜间高血压#糖尿病\n\n想远离糖尿病，或者不想胰岛素抵抗，把血糖降下来，关键不是不吃糖、不吃主食，而是要保护好胰腺。\n身体里能够升血糖的激素有好几种，但把血糖降下来的只有胰岛素。你可以把它理解成一把钥匙，负责打开肌肉、脂肪等组织的大门，让葡萄糖进去。\n但如果原来一把钥匙能打开的门，现在要三把、五把，胰腺只能拼命多分泌胰岛素，结果就是越来越累，最后血糖全面崩盘。\n所以我们说“保护胰腺”，不是去找某种食物进补，而是尽量减轻胰岛素抵抗，减少胰腺负担。\n那胰腺喜欢什么？\n第一，它喜欢你吃原样的、加工少的食物。比如深颜色蔬菜、完整水果、豆类、坚果和鱼类，有的膳食纤维更多，有的营养密度更高，可以帮助你补充营养，又不会升高太多血糖。\n但如果是油炸食品、五花肉、蛋糕和罐头，热量容易超标，体重和内脏脂肪慢慢增加。身体对胰岛素越来越不敏感，胰腺自然就得分泌更多胰岛素。\n第二，它喜欢你的血糖平稳。\n如果一顿饭有很多甜饮料、甜点、白粥、面条，碳水化合物吸收得很快，血糖就容易迅速升高，胰岛素也得赶紧大量分泌。\n但解决办法不是不吃主食，而是把主食的质量和总量调整好。增加全谷物、杂豆和薯类，吃饭时搭配前面说的蔬菜、水果。可以延缓消化吸收，让餐后血糖上升得平缓一些。\n第三，它喜欢你生活自律。长期熬夜、睡眠不足、吃饭时间忽早忽晚，尤其是半夜反复加餐，会让食欲、体重和胰岛素敏感性受到影响。\n不是说偶尔一次会糖尿病，真正需要避免的是长期这样。\n第四件，它喜欢你肌肉多。\n肌肉是人体消耗葡萄糖的重要场所。运动的时候，肌肉会主动使用更多葡萄糖。长期进行有氧运动和力量训练，还能提高身体对胰岛素的敏感性。\n所以别只盯着少吃。每周尽量完成150分钟左右的中等强度运动，再安排两到三次力所能及的力量训练。哪怕暂时做不到，也可以从饭后走十几分钟、少坐一会儿开始。\n肌肉练起来，腰围降下来，胰岛素的工作就会轻松很多。\n那胰腺讨厌什么呢？\n第一，它讨厌你经常喝酒。酒精可能损伤胰腺，也是胰腺炎的原因之一。反复发生胰腺炎，可能影响胰岛功能，增加糖代谢异常的风险。所以不喝最好，尤其是有胰腺炎、高甘油三酯，或者血糖异常的人，更不能拿“小酌养生”安慰自己。\n第二，它讨厌你暴饮暴食。\n偶尔一次没什么事，但如果反复暴饮暴食，体重、脂肪肝、甘油三酯和胰岛素抵抗很可能一起往上走。\n尤其是喝酒或大吃一顿后，突然出现持续而剧烈的上腹部疼痛，还伴有恶心、呕吐，甚至疼痛向后背放射，别在家硬扛，可能是急性胰腺炎。\n第三，长期高热量、高饱和脂肪的饮食。\n它容易带来肥胖、内脏脂肪增加和胰岛素抵抗。胰腺不得不长期多分泌胰岛素，负担会越来越重。\n第四是长期压力和睡眠不足。\n人处在高压状态下，皮质醇这种升糖激素会持续升高，睡眠不足又会影响食欲和胰岛素敏感性。结果就是胰岛素抵抗加重，胰腺又得多分泌胰岛素来补这个缺口。\n规律睡眠、增加运动、减少久坐，在长期焦虑、抑郁的时候，主动找医生或心理专业人员。\n所以说防2型糖尿病，不是简单地跟糖和主食较劲。你真正要做的，是改善饮食质量、控制体重和腰围、保持运动、增加肌肉、睡好觉，同时少喝酒，别长期暴饮暴食。\n如果已经查出空腹血糖升高，或者有肥胖、脂肪肝、多囊卵巢综合征、糖尿病家族史，别靠感觉判断，最终还是要去医院检查。已经属于糖尿病前期的人，一般至少每年复查一次，具体频率听医生安排。\n保护胰腺，不是给胰腺吃什么补品，而是别让它长期加班。\n\n\n", "source": "本地DOCX；已核对候选记录MD5", "error": "", "recomputedScore": 0.078}, {"messageId": 207286, "title": "KP11 曾炼坤 Z 血糖控制到多少，不用担心并发症？", "recordedScore": 0.0778, "body": "封面：血糖控制到多少，不用担心并发症？\n标题：糖化达标了，餐后血糖和低血糖还要不要管？\n#抖出健康知识宝藏 #健康科普进行时#稳压护心#夜间高血压#糖尿病\n\n血糖控制到多少不用担心并发症？我在门诊经常遇到两类糖友，心态可以说是两个极端。一类是无所谓型，平时很少测血糖，偶尔测一次，数值高得吓人也不管，该吃吃该喝喝，总觉得身上没有不舒服，就不会伤身体。\n另一类是过于紧张型，化验单有个小箭头，就自己吓自己，满脑子都是失明、尿毒症、脑梗，一晚上都睡不着。\n说实话，我真希望这两类糖友的性格能综合一下。控糖既不能放任自流，也不能草木皆兵。今天咱们就结合医学指南和研究聊一聊，血糖控制到多少，我们可以放心。\n首先你要知道，我们控制血糖的核心目的，就是减少长期高糖对血管、神经和各个脏器的持续伤害。到底降到多少不容易出现伤害，不是凭感觉定的，而是大量长期随访研究一点点摸索出来的。\n对大部分普通的二型糖尿病，糖化血红蛋白控制在7.0%以内，这是一个公认红线。反映的是两三个月的血糖。长期稳定维持在这个水平内，糖尿病眼底病变、肾脏损伤、周围神经病变这些微血管并发症的风险会明显下降，大血管病变的风险也能得到比较好的控制。\n但不是低于7.0就绝对不会出现并发症，也不是高于7.0就一定会出问题。\n除了糖化，我们还要看空腹和餐后血糖，一般空腹目标设在4.4到7.0mmol/L，餐后两小时尽量控制在10.0mmol/L以内，三个指标搭配着看，才是完整的血糖。\n也有人会问，我身体这么好，血糖控制低一点，是不是会更健康？\n答案是可以，但不是人人都适合。适合严格控糖的，大多是确诊时间不长、年纪比较轻，没有严重心脑血管基础病，低血糖感知能力正常，平时不容易发生低血糖的糖友。这部分人，在医生评估之后，可以把糖化目标往6.5%，甚至更低去靠拢，长期稳定达标，对远期并发症的防护效果会更好。\n但也有一些糖友，不适合这么严格，强行降糖反而会伤身体。最主要的风险就是低血糖。\n严重低血糖带来的心梗、脑梗、意识障碍，伤害来得更快、更凶险。像年纪偏大、病程很长，已经有冠心病、脑梗病史，或者肾功能不好、反复出现低血糖，对低血糖没有明显感知的糖友，还有体弱、预期寿命有限的人，目标就要适当放宽。\n医生评估后，把一部分人的糖化放宽到7.5%、8.0%，甚至更高一点，都是合理的。\n但同样是糖化7.0，为什么有的人很快就心梗、脑梗了，但又有人十几年健健康康呢？还可能跟血糖的波动有关。波动很小、比较平稳，并发症风险会比血糖忽高忽低的人更小。所以不要只盯着平均值，还要把血糖稳下来。\n比如把吃饭的顺序和节奏改一改。同样一碗米饭，先吃菜和肉、最后吃主食，细嚼慢咽吃，餐后那条曲线就会平缓不少；但反过来，空腹先扒两口饭，很快就把饭吃完了，血糖就会冲得又快又猛。饭后别马上躺着玩手机，站起来走两圈，既能增加肌肉，又能帮着消耗吃进去的糖。\n总结一下，糖化7.0%是大部分人的通用参考目标，年轻、病程短、没有严重基础病、不容易低血糖的糖友，可以在医生指导下从严管理；年纪大、并发症多、容易低血糖、心脑血管条件差的糖友，目标适度放宽。\n把血糖控制好，坚持健康的生活方式，血压、血脂这些指标也正常，那医生都要羡慕你。\n对于无所谓型的朋友，一定要重视起来，因为血糖高了不会给你发信号，波动大了，你也未必有感觉。但你觉得“没事儿”的那些年，它正在悄悄对血管、神经、肾脏下手。把血糖控制好，定期做好眼底、尿微量白蛋白、血管超声这些筛查，那才是真正的安心。\n\n", "source": "本地DOCX；已核对候选记录MD5", "error": "", "recomputedScore": 0.0778}, {"messageId": 207287, "title": "KP12 曾炼坤 Z 糖尿病想要控制好，牢记八个底层逻辑", "recordedScore": 0.0739, "body": "封面：糖尿病想要控制好，牢记八个底层逻辑\n标题：为什么照着别人控糖，自己的血糖还是不稳：八个逻辑讲透\n#抖出健康知识宝藏#健康科普进行时#稳压护心#夜间高血压#糖尿病 \n\n要想控制甚至逆转糖尿病，我给大家总结了八个逻辑。门诊经常跟糖友打交道，这些都是一点点总结出来的，这些不是照搬宣科的规矩，而是帮助大家找到控糖的节奏。尤其是最后一条，决定你未来往哪使劲。\n第一，控糖不只是把血糖降下来，还要尽量恢复你自己的血糖调节能力。很多人简单认为血糖高就是吃得多、动得少。其实糖尿病的本质，是胰岛素要分泌胰岛素，肝脏要释放葡萄糖，细胞要对胰岛素敏感，这些环节哪一个出了问题，血糖都可能高。饮食和运动是底子，但单靠少吃多动，很难解决全部代谢问题，所以还是要改善胰岛素敏感性，让身体重新正常处理葡萄糖。\n第二，餐后血糖高，跟你的肠道有关。进食之后，肠道会分泌肠促胰素，你可以把它理解成肠道发出的一类信号激素：一方面延缓胃排空，减慢糖分吸收；另一方面，在血糖升高的时候促进胰岛素分泌，同时抑制升糖激素。2型糖尿病的人，普遍存在肠促胰素分泌不足或者反应迟钝，胰岛素分泌跟不上吃饭节奏，饭后血糖就容易高。现在很多降糖药，也是从这个原理来降糖。\n第三，肝脏不好，血糖也很难稳定。肝脏是体内糖代谢的器官，负责肝糖原的合成和分解。糖尿病合并脂肪肝，胰岛素抵抗会加重，肝脏会不受控地释放葡萄糖，空腹和餐后血糖都容易高。所以把肝脏上的脂肪减掉，对血糖控制也有很大帮助。\n第四，肌肉是天然的血糖仓库，也是消耗葡萄糖的主力。你可以把它想成一个超大号的蓄水池，你吃进去的糖，一多半先被它收进池子存着，等你一动、一使力气，闸门就打开，这些存着的糖被放出来当燃料烧掉。池子越大，能装的糖越多，能烧掉的也越多，留在血里的葡萄糖就少了。\n坚持做抗阻训练，比如说深蹲、俯卧撑，可以增加肌肉量，提升葡萄糖的处理能力。\n第五，脂肪本身没有错，长错了位置才危险。肚子大的人，内脏脂肪多，这些脂肪堆在肝脏、胰腺周围，会增加或者诱发胰岛素抵抗。所以减肥要优先减掉这种脂肪，而不是越轻越好。\n第六，保护胰岛功能，跟降血糖同样重要。从胰岛素抵抗，发展到2型糖尿病，再到糖尿病足、肾衰竭、眼睛看不见等等并发症，往往要十几二十年。这期间胰岛一直在超负荷分泌胰岛素，早期通过饮食、运动或者药物把血糖降下来，就能保住一部分胰岛功能。\n第七，你越是焦虑，血糖越不稳。长期紧张、焦虑，身体会分泌皮质醇、肾上腺素这类升糖激素，抵抗胰岛素的作用。血糖就不容易降下来，还可能忽高忽低。所以管理血糖要松弛有度，远离让你焦虑的人或事。\n第八，控糖不能盲目少吃，丢了营养。很多人为了控糖不敢吃主食，热量、蛋白质、维生素、膳食纤维都吃的少，结果血糖反而越来越难控制。控糖不是不吃，而是各种食物搭着吃，比如肥肉、炸鸡、奶茶吃的少了，那蔬菜、鸡胸肉、鱼肉，就可以适当多吃。这样你吃得饱，又能把血糖降下来。\n最后提醒一下，糖友和糖友之间差别真的很大。有的人主要是胰岛素抵抗，有的人是胰岛功能衰退得更明显。所以怎么管，不能看别人怎么吃、怎么用药，得结合自己的胰岛功能怎么样、体重和内脏脂肪什么情况、有没有并发症，让医生帮着定一个适合自己的方案。方案定了，坚持下去，血糖才更容易长期平稳，并发症风险也才能跟着降下来。\n\n", "source": "本地DOCX；已核对候选记录MD5", "error": "", "recomputedScore": 0.0739}], "unavailableCount": 0, "matchStatus": "needs_review", "unavailableReasons": []}}, {"key": "event-238494", "id": "238494", "doctor": "曾炼坤", "time": "2026-11-06 10:22:58", "kind": "作品关联／证据", "reason": "用户已确认：与238483为同一作品、均为粤语。已有120秒粤语转写；最新缓存因历史稿件原生消息信息未读取，候选为空。旧报告曾记录5个候选，不能冒充最新结果；任务关联仍未修复。", "next": "落实同一作品的任务关联，保留已有人工确认；不回退飞书。", "title": "同一粤语作品（238483／238494）；待落实任务关联", "windows": ["238494", "204116", "207285", "221822"], "aspects": [{"kind": "作品关联／证据", "reason": "用户已确认：与238483为同一作品、均为粤语。已有120秒粤语转写；最新缓存因历史稿件原生消息信息未读取，候选为空。旧报告曾记录5个候选，不能冒充最新结果；任务关联仍未修复。", "next": "落实同一作品的任务关联，保留已有人工确认；不回退飞书。"}], "comparison": {"capturedAt": "2026-11-10T12:00:00+08:00", "transcript": "依家糖尿病嘅患病率系越嚟越高，糖尿病发病另一个年轻化嘅趋势。年輕人究竟應該點樣避免得二型糖尿病？其實我覺得有五件事一定要做好。首先我問下你，糖尿病究竟系點樣嚟嘅？好多人會覺得系咪我食糖食多咗，系咪飲奶茶飲多咗？其實長期嘅高。 糖飲食咧，確實系會增加得二型糖尿病風險。但系如果話食糖就一定會得糖尿病，咁醫院咧一早就逼爆曬人啦，企都企唔落人。其實好多二型糖尿病系身體對胰島素嘅反應越嚟越差，我哋可以理解為胰島素抵抗。胰腺一開始仲可以多分泌一啲胰島素。 頂住佢，但後嚟發覺代償唔過嚟啦，咁我哋血糖咧就會逐漸咁升高。呢入邊既有生活方式嘅影響，亦有遺傳嘅原因。好多年輕人發現咗糖尿病，往往系血糖一早就已經唔正常啦，只系自己一直都唔知道。國際糖尿病聯盟i d f流行病學嘅調查顯示。 二零二四年，我哋中國成人糖尿病嘅患病率已經達到咗百分之十一点九，亦即系話一百個人之中有接近十二個糖尿病患者。其實呢啲人入邊，自己知道有糖尿病嘅咧，做唔到有四成。所以呢，下邊呢五點，希望大家可以認認真真咁樣睇完佢，從今日。 開始就要做好佢，唔好等到高血糖傷害到我哋嘅血管啦、眼啦、腎臟咧，而再嚟後悔。第一條咧就係睇見要查血糖，一定唔好漏咗三個指標：空腹血糖、飯後兩個鐘頭血糖、糖化血紅蛋白，呢三個重要嘅指標。好多人覺得我唔頸渴，亦唔尿多。 飯都系正常嘅，有乜可能得糖尿病呢？但問題就係，二型糖尿病早期症狀系唔典型、唔明顯嘅，千祈唔好等到出現咗三多一少嘅典型症狀先系去檢查。如果你超重、肚腩大、個頸有黑黑嘅嘢洗唔乾淨，父母兄弟姊妹有糖尿病，或者自己有個。", "seconds": 120, "stop": "max_duration", "basis": "最新候选为空；以下为旧报告候选，仅供人工对照", "documents": [{"messageId": 204116, "title": "KP10 曾炼坤 Z 年轻人避免得糖尿病，这五件事千万要做好", "recordedScore": 0.383, "body": "封面：年轻人避免得糖尿病，这五件事千万要做好\n标题：年轻人如何远离糖尿病：五件事比少吃糖重要\n#抖出健康知识宝藏 #健康科普进行时#稳压护心#夜间高血压#糖尿病\n\n年轻人怎么避免得2型糖尿病？有五件事，一定得做好。先问你一句，糖尿病到底是怎么来的？很多人说，不就是糖吃多了、奶茶喝多了吗？\n长期的高糖饮食，确实会增加风险，但如果说吃糖就会有糖尿病，那医院早就挤爆了，站不下人了。\n很多2型糖尿病，是身体对胰岛素的反应越来越差，胰腺一开始还能多分泌一些顶着，后来补偿不过来了，血糖才逐渐升高。这里面既有生活方式的影响，也有遗传的原因。\n年轻人走到糖尿病，往往是血糖早就不正常了，只是自己一直不知道。\n一项研究发现，2018年中国成年人糖尿病患病率，每八个人里就有一个。但在这些人里面，知道自己有糖尿病的，还不到四成。\n所以下面这五点，希望大家认认真真看完。从今天开始好好做，别等到高血糖伤害血管、眼睛、肾脏了再后悔。\n第一条，体检查血糖，一定不要漏掉三个指标：空腹血糖、饭后两小时血糖、糖化血红蛋白怎么样？很多人觉得，我不口渴、不尿多，吃饭也正常，怎么可能有糖尿病？但问题是，2型糖尿病早期明显症状，不能等到“三多一少”都出现了才去检查。如果你超重、肚子大，脖子上有黑黑的东西洗不干净，父母、兄弟姐妹有糖尿病，或者自己有过妊娠期糖尿病、多囊卵巢综合征，就更应该主动问医生筛查，别拿年轻当保险。\n第二条，血糖亮黄灯了，千万别装看不见。检查提示糖尿病前期，意思是血糖已经超出正常范围，但还没有达到糖尿病的诊断标准。如果医生让你回去调整，别不当回事，把报告扔在一边。\n因为这时候是预防 2 型糖尿病的关键时期，超重的人减一减肚子，最好减掉体重的5%，就有机会降低血糖、不让自己发展成2型糖尿病。\n如果坚持3 到 6 个月，血糖还是往上走，该吃药也得吃药，跟着医生规范吃。\n第三条，遇到不舒服的情况，千万别硬扛。如果还伴有恶心、呕吐、腹痛、呼吸又深又快，或者人明显犯困、精神不对，就要立即打120，这可能是糖尿病酮症酸中毒，是要命的急症。\n第四条，血糖有问题，别自己乱吃药。很多人一听说血糖高，第一反应不是正规就诊，而是买降糖茶、偏方。里面不知道什么成分，也没有可靠的临床证据，不建议随便用。\n还有一些药物，本身可能升高血糖，比如糖皮质激素。不是说完全不能用，而是如果确实需要用，尤其需要较长时间使用，要告诉医生自己的血糖情况和家族史，按要求监测。\n第五条，把真正能够改变的危险因素管住。别一边担心糖尿病，一边猛吃碳水，天天久坐，高血压、高血脂都不控制。\n预防2型糖尿病，不能只盯着嘴里那一口甜不甜，更要看每天吃进去的食物，有多少会转化成糖。\n把含糖饮料尽量换成白水，饮食注意总量，主食控制在一个拳头大小，在里面加入一些荞麦、燕麦等等粗粮，优先保证每餐有一大盘绿叶蔬菜，再搭配优质蛋白，鸡蛋、鱼虾、瘦肉、豆制品轮着吃。少吃深加工的食物，比如火腿、香肠、培根、腊肉，每周争取至少150分钟中等强度运动，坐一个小时站起来走一走，哪怕没有整块的运动时间，上下班多走两步，也会有新的改变。\n最后再强调一下，年轻不等于血糖一定正常，家里没人得糖尿病，也不等于自己没有风险。下次体检，记住三件事：看清血糖结果，了解自己的风险，有异常就及时复查。检查是为了早点发现，真正降低2型糖尿病风险，还得靠每天把饮食、运动和体重管理落实好。\n\n", "source": "本地DOCX；原生消息MD5校验", "error": "", "recomputedScore": 0.383}, {"messageId": 207285, "title": "KP14 曾炼坤 Z 体检发现血糖高，不想发展成糖尿病，记住这个逆转方法", "recordedScore": 0.0957, "body": "封面：体检发现血糖高，不想发展成糖尿病，记住这个逆转方法\n标题：体检突然发现血糖高了，不想发展成糖尿病，应该怎么吃怎么做？\n#抖出健康知识宝藏 #健康科普进行时#稳压护心#夜间高血压#高血糖\n\n体检发现血糖高，但又没到糖尿病的标准，该怎么做才能避免它变成糖尿病？其实血糖偏高是身体给我们发出的预警，如果能及时干预，很多人能把血糖拉回来，不至于戴上糖尿病的帽子。\n首先血糖多高就是高了？空腹血糖正常是3.9到6.1，超过6.1就是高了。但不能只看空腹血糖一个指标，还有两个指标高了，也会有糖尿病的风险。\n一个是餐后两小时血糖，测的是从你吃第一口饭开始算的血糖，正常是低于7.8；超过7.8也是高；\n另一个是糖化血红蛋白，就好像成绩单一样，反映的是最近两三个月的血糖，如果超过5.7，也要及时干预。\n一旦空腹大于7.0，餐后两小时大于11.1，糖化大于6.5，就要高度警惕糖尿病了。\n那在这之前，我们要怎么干预？\n指南推荐的、最重要的一点就是减重。胖糖友减掉体重的5%到7%，血糖代谢就会有很明显的改善。但这不是让你饿肚子，马上瘦十斤，而是要科学调整饮食结构，记住吃饭的四条原则。\n第一，每餐先吃蔬菜，再吃肉，最后吃主食。蔬菜最好占到一餐的一半，它的饱腹感强，还能延缓主食吸收，让餐后血糖慢一点升高。不过像土豆、山药、莲藕、南瓜这些淀粉类蔬菜，吃了它们就要相应减少主食。\n第二，每餐要有一份优质蛋白。鸡蛋、鱼肉、瘦肉、豆制品都可以。蛋白质消化得慢，还可以帮你长肌肉。\n第三，主食减量，粗细搭配。米饭、面条、馒头升糖快，可以掺一半粗粮，比如燕麦、糙米、杂豆等等。分量控制在一个拳头大小，少吃糊状的、水多的主食。\n第四，找出隐形糖。很多人觉得自己不喝糖水，怎么血糖会高？但饼干、沙琪玛、酸奶，这里面糖一点都不少。\n饮食说完了，再来说运动，这里推荐中等强度有氧运动。快走、慢跑、骑车、游泳、跳操都可以，强度以微微出汗、能说话但不能唱歌为准。\n每周至少150分钟，分摊下来就是每周五天、每次三十分钟。最好放在餐后一小时左右。每周可以安排两到三次力量训练。肌肉是消耗糖分非常重要的器官，肌肉量上去了，基础血糖会更稳。\n那怎么在家测血糖呢？\n首先，血糖仪一定要选正规厂家、国家批准上市的产品。\n其次，试纸要配套，过期、受潮都会让结果不准。\n采血前先把手洗干净，消毒后再扎，消毒最好用酒精，别用碘酒；不是扎指腹，最好选手指两侧，痛感更低；扎完后等血液自己流出来，不要用力挤压手指，以免测出来偏低。\n但不要天天都去扎手指，可以这样安排：每周挑两到三天，测空腹血糖，再加上一餐的餐后两小时血糖。每次测完，把数值、吃饭情况和当天运动情况一起记下来，复诊的时候拿给医生看，方便调整方案。如果哪天吃得比较丰盛，或者感觉乏力、口渴，可以多加测一次餐后。\n血糖偏高虽然还不是糖尿病，但是绝对不能放任不管。尤其是家里直系亲属有糖尿病，本身又有高血压、高血脂、脂肪肝的人，都属于高危人群，进展风险会比普通人高很多。\n饮食、运动、体重管理、定期监测，这几件事一起抓。很多人坚持半年一年之后，血糖慢慢回到正常区间，一直维持住，就可以降低糖尿病的风险。如果坚持生活方式干预三个月，复查血糖还是高，甚至比之前还高，一定要及时到内分泌科挂号，看看有没有必要吃药。尤其是有高血压、高血脂、多囊、黑棘皮症等等问题的人，更要找医生评估，不能自己买药吃，也不能完全不管。\n", "source": "本地DOCX；原生消息MD5校验", "error": "", "recomputedScore": 0.0957}, {"messageId": 221822, "title": "KP18 曾炼坤 Z 糖尿病不是戒糖戒主食，而是理解胰腺作用", "recordedScore": 0.0946, "body": "封面：糖尿病不是戒糖戒主食，而是理解胰腺作用\n标题：糖尿病不是戒糖戒主食，关键看胰腺和胰岛素发生了什么\n#抖出健康知识宝藏 #健康科普进行时#稳压护心#夜间高血压#糖尿病\n\n想远离糖尿病，或者不想胰岛素抵抗，把血糖降下来，关键不是不吃糖、不吃主食，而是要保护好胰腺。\n身体里能够升血糖的激素有好几种，但把血糖降下来的只有胰岛素。你可以把它理解成一把钥匙，负责打开肌肉、脂肪等组织的大门，让葡萄糖进去。\n但如果原来一把钥匙能打开的门，现在要三把、五把，胰腺只能拼命多分泌胰岛素，结果就是越来越累，最后血糖全面崩盘。\n所以我们说“保护胰腺”，不是去找某种食物进补，而是尽量减轻胰岛素抵抗，减少胰腺负担。\n那胰腺喜欢什么？\n第一，它喜欢你吃原样的、加工少的食物。比如深颜色蔬菜、完整水果、豆类、坚果和鱼类，有的膳食纤维更多，有的营养密度更高，可以帮助你补充营养，又不会升高太多血糖。\n但如果是油炸食品、五花肉、蛋糕和罐头，热量容易超标，体重和内脏脂肪慢慢增加。身体对胰岛素越来越不敏感，胰腺自然就得分泌更多胰岛素。\n第二，它喜欢你的血糖平稳。\n如果一顿饭有很多甜饮料、甜点、白粥、面条，碳水化合物吸收得很快，血糖就容易迅速升高，胰岛素也得赶紧大量分泌。\n但解决办法不是不吃主食，而是把主食的质量和总量调整好。增加全谷物、杂豆和薯类，吃饭时搭配前面说的蔬菜、水果。可以延缓消化吸收，让餐后血糖上升得平缓一些。\n第三，它喜欢你生活自律。长期熬夜、睡眠不足、吃饭时间忽早忽晚，尤其是半夜反复加餐，会让食欲、体重和胰岛素敏感性受到影响。\n不是说偶尔一次会糖尿病，真正需要避免的是长期这样。\n第四件，它喜欢你肌肉多。\n肌肉是人体消耗葡萄糖的重要场所。运动的时候，肌肉会主动使用更多葡萄糖。长期进行有氧运动和力量训练，还能提高身体对胰岛素的敏感性。\n所以别只盯着少吃。每周尽量完成150分钟左右的中等强度运动，再安排两到三次力所能及的力量训练。哪怕暂时做不到，也可以从饭后走十几分钟、少坐一会儿开始。\n肌肉练起来，腰围降下来，胰岛素的工作就会轻松很多。\n那胰腺讨厌什么呢？\n第一，它讨厌你经常喝酒。酒精可能损伤胰腺，也是胰腺炎的原因之一。反复发生胰腺炎，可能影响胰岛功能，增加糖代谢异常的风险。所以不喝最好，尤其是有胰腺炎、高甘油三酯，或者血糖异常的人，更不能拿“小酌养生”安慰自己。\n第二，它讨厌你暴饮暴食。\n偶尔一次没什么事，但如果反复暴饮暴食，体重、脂肪肝、甘油三酯和胰岛素抵抗很可能一起往上走。\n尤其是喝酒或大吃一顿后，突然出现持续而剧烈的上腹部疼痛，还伴有恶心、呕吐，甚至疼痛向后背放射，别在家硬扛，可能是急性胰腺炎。\n第三，长期高热量、高饱和脂肪的饮食。\n它容易带来肥胖、内脏脂肪增加和胰岛素抵抗。胰腺不得不长期多分泌胰岛素，负担会越来越重。\n第四是长期压力和睡眠不足。\n人处在高压状态下，皮质醇这种升糖激素会持续升高，睡眠不足又会影响食欲和胰岛素敏感性。结果就是胰岛素抵抗加重，胰腺又得多分泌胰岛素来补这个缺口。\n规律睡眠、增加运动、减少久坐，在长期焦虑、抑郁的时候，主动找医生或心理专业人员。\n所以说防2型糖尿病，不是简单地跟糖和主食较劲。你真正要做的，是改善饮食质量、控制体重和腰围、保持运动、增加肌肉、睡好觉，同时少喝酒，别长期暴饮暴食。\n如果已经查出空腹血糖升高，或者有肥胖、脂肪肝、多囊卵巢综合征、糖尿病家族史，别靠感觉判断，最终还是要去医院检查。已经属于糖尿病前期的人，一般至少每年复查一次，具体频率听医生安排。\n保护胰腺，不是给胰腺吃什么补品，而是别让它长期加班。\n\n\n", "source": "本地DOCX；原生消息MD5校验", "error": "", "recomputedScore": 0.0946}], "unavailableCount": 21, "matchStatus": "needs_review", "unavailableReasons": ["native_message_xml_unavailable"]}}, {"key": "sync-243374", "id": "243374", "doctor": "曾炼坤", "time": "2026-11-09 10:50:46", "kind": "飞书同步／进度差异", "reason": "飞书已发布，保留远端，不补发较早状态；历史队列／本地进度差异仍需记录。", "next": "保留飞书较新状态，核对作品版本与历史发送链；不回退远端。", "title": "肚子大、饭后困，记住三个简单方法，判断胰岛素抵抗", "windows": ["243374", "207283", "221822", "207287"], "aspects": [{"kind": "飞书同步／进度差异", "reason": "飞书已发布，保留远端，不补发较早状态；历史队列／本地进度差异仍需记录。", "next": "保留飞书较新状态，核对作品版本与历史发送链；不回退远端。"}]}, {"key": "image-246271", "id": "246271", "doctor": "曾炼坤", "time": "2026-11-10 10:32:11", "kind": "图片待完整核验", "reason": "尚无原图或清晰图完整文件证据；已有缩略图／上传回执不能替代原件核验。", "next": "保留缩略图供查看；证据不可辨认时不据此自动推进。", "title": "[图片] local_id=791", "windows": ["246271"], "aspects": [{"kind": "图片待完整核验", "reason": "尚无 任务关联须另行验证。"}], "comparison": {"capturedAt": "2026-11-10T12:00:01+08:00", "transcript": "很多人都默认只有得了高血压，吃上降压药就得一辈子吃药。但确实有一类高血压，如果揪出病根，血压可以明显好转，一部分人能够减药，少数人甚至可以不用长期吃药。但现实里不少这类患者要用到两种、三种甚。 这四种，血压还是居高不下，还在不停的换药加药。问题不在于药不够，而是诊断方向偏了。这不是普通的原发性高血压，而是肾血管性的高血压，很容易被漏掉。大家可以这么理解，给肾脏供血的这根血管变窄了，流进肾脏。 血液变少，肾脏不知道是血管堵了，它会误以为全身血压太低，于是企图自救，拼命的升高血压，一边收紧全身的血管，一边留住更多的水和钠，相当于身体自己一直在跟降压药对着干。它有一个很典型的特点，之前血压还。 算平稳，短期内突然飙升，三四种加药一起上，还是很难降下来。有的人抽血会发现血肌酐悄悄往上走，或是莫名出现低钾血症。医生听着，在上腹、腰背部可能听到血管杂音，只是这些信号常常不够醒目，很容易被忽。 肾动脉狭窄损害的不只是血压，肾脏长期供血不足，慢慢会萎缩，肾功能一点点下滑。过双侧肾动脉都严重狭窄，还可能诱发心衰、肺水肿，夜里胸闷憋气，直接被憋醒。给大家一个实用的提醒，如果你已经在。 三种降压药，其中还包括利尿剂，血压依旧控制不理想。别急着一味叠加药物，又想到会不会是给肾脏供血的血管出了问题？排查优先做肾动脉彩超，如果超声看不清楚，或者医生高度怀疑，再进一步安排肾动脉增强。", "seconds": 120, "stop": "max_duration", "basis": "用户指定原稿；同时列最新候选，均不冒充自动匹配成功", "documents": [{"messageId": 223172, "title": "KP17 肖良祥 Z 可以停药的高血压", "recordedScore": 0.1128, "body": "封面：可以停药的高血压\n标题：有一种高血压可以减药甚至停药，但确实大多数人忽视了\n#抖出健康知识宝藏 #健康科普进行时#高血压#肾脏健康#肾动脉狭窄\n\n有一类高血压，找到背后的病根后，有机会大幅好转，一部分人还能减药，甚至不用长期吃药。但现实是很多人吃了一种、两种、三种，甚至四五种降压药，血压还是降不下来，却还在不停地加药、换药。\n因为你的诊断可能是错的，这根本不是普通的高血压，而是肾血管性高血压。\n这个病很多人没听说过，也很容易被漏掉。其实就是给肾脏供血的血管变窄了，流到肾脏里的血减少。肾脏不知道是血管堵了，它会误以为是全身血压太低，于是拼命想办法把血压升上去。它一边让血管收紧，一边让身体留住更多的水和盐。所以这种人的血压往往特别难降，不是因为药不够好，而是身体一直在跟降压药对着干。\n这种病典型的特点，就是原来的血压还比较稳定，最近突然变得很高，三四种降压药都压不下来。\n有的人抽血检查，有时会发现肌酐悄悄往上走，或者血钾偏低。医生听诊的时候，可能在上腹部、腰背部听到血管杂音。只是这些信号都不算特别典型，很容易被忽视。\n更要注意的是，肾动脉狭窄影响的可不只是血压。肾脏长期供血不足，可能会慢慢萎缩，肾功能也会越来越差。如果两边的肾动脉都严重狭窄，还可能出现心衰、肺水肿，胸闷、喘不上气，甚至半夜躺着睡觉都会被憋醒。\n所以如果你已经吃了三种降压药，其中还有一种利尿剂，血压还是控制不好，就不要只顾着继续加药，还要看看是不是肾动脉出了问题。\n怎么查呢？通常可以先做一个肾动脉彩超。如果彩超看不清楚，或者医生还是高度怀疑，可以进一步做肾动脉CTA或者磁共振血管检查。\n不过这里一定要注意：检查发现肾动脉狭窄，不代表你的高血压一定就是它引起的，也不是看到狭窄就必须放支架。因为很多中老年人血管，多少都会有一些斑块和狭窄，关键要看它堵得严不严重，是不是真的影响了肾脏供血，是不是已经导致血压高、或者肾功能下降。\n如果是年轻人，因为血管本身发育问题，导致了肾动脉狭窄，那么用球囊把狭窄的地方扩开以后，血压很可能会明显下降，有些人还能减少，甚至停掉降压药。\n但如果是中老年人，这类人的肾动脉狭窄，更常见的原因是动脉粥样硬化，这时不能看到狭窄就放支架。多数人首先还是要好好吃药，把血压、血脂控制好。只有血压实在控制不住、肾功能越来越差，或者反复出现急性心衰、肺水肿的人，才要考虑把狭窄的血管打开。\n当然，我也必须强调，大部分人的高血压，还是原发性高血压，找不到一个可以直接去掉的病因，不能指望吃几天药就能根治，而是要长期、规律地控制。\n而且不管是哪一种高血压，都不能只盯着今天吃了几片药。因为降压药在前面踩刹车，你每天的生活可能还在后面踩油门：一顿重口味的饭，会让身体把更多的水和盐留下来；腰围越来越大，会让血压变得更难控制；晚上打鼾、反复缺氧，第二天早上的血压就可能特别高。最后你看到的是药越吃越多，却没有发现真正拖后腿的，可能是每天都在重复的生活习惯。所以控制血压，不是简单地“管住嘴、迈开腿”，而是要把那些一直在抵消药效的事情，一件一件找出来。\n把病因、药物和生活方式这三件事都管好，才是真正把血压控制住。\n\n\n", "source": "本地DOCX；已核对候选记录MD5", "error": "", "recomputedScore": 0.5842}], "unavailableCount": 27, "matchStatus": "needs_review", "unavailableReasons": ["native_message_xml_unavailable"]}}, {"key": "event-241241", "id": "241241", "doctor": "肖良祥", "time": "2026-11-06 18:49:40", "kind": "作品关联／证据", "reason": "用户确认对应KP18《同样是肾病，IgA和膜性有什么不同？》（原稿消息223173）。程序已找到该稿且排第一，但字面相似度0.3746低于0.8。口播有改写，现有文字匹配未识别为同一作品；非下载失败。", "next": "根据稿件正文、真实引用及同一作品版本核对；不以最高分或相同标题强行推进。", "title": "KP18 同样是肾病，IgA和膜性有什么不同？", "windows": ["241241"], "aspects": [{"kind": "作品关联／证据", "reason": "用户确认对应KP18《同样是肾病，IgA和膜性有什么不同？》（原稿消息223173）。程序已找到该稿且排第一，但字面相似度0.3746低于0.8。口播有改写，现有文字匹配未识别为同一作品；非下载失败。", "next": "保留用户确认；修复稿件读取和改写匹配，实际任务关联须另行验证。"}], "comparison": {"capturedAt": "2026-11-10T12:00:01+08:00", "transcript": "很多朋友拿到肾穿刺报告，看到 IgA 肾病、膜性肾病，以为差不多，其实完全不是一回事。它们虽然都伤到肾脏这张精密的过滤网，但受损的位置、典型的表现、危险点全都不同，治疗方案更不能相互照搬。先说 IgA 肾病。 它最标志性的特点就是常常跟着感冒、嗓子发炎一起来，感染之后很快出现肉眼血尿，小便变成浓茶色或者洗肉水一样。简单来讲，IgA本来是我们身体用来对抗感染的抗体，一部分人的IgA结构异常，聚成一团，沉积在。 肾小球里面诱发炎症，滤完一旦发炎，红细胞、蛋白就漏进尿液。但大家一定要记住，血尿只是它的招牌，真正决定肾脏长期走向的不是尿红不红，而是蛋白尿多少，血压高不高，肾功能下滑的速度。所以。 IgA 肾病管理的根基就是稳住血压，减少尿蛋白，戒烟，控制体重，再根据病情判断要不要用到激素或者靶向免疫治疗。而膜性肾病走的完全是另外一条路，它很少在感冒之后出现血尿，最突出的表现是越来越多的泡沫尿。 眼皮及下肢的水肿，短短几天体重可能就涨上去。如果 IgA 肾病是滤网内部发炎，那膜性肾病就是滤网外面那一层保护膜的屏障被免疫系统认错，攻击破坏了。那破掉之后，大量蛋白尿持续的漏进尿液。 液锁不住水分，水肿就来了。抽血常会发现血清白蛋白下降，血脂升高。这里面有一个特别关键的风险，蛋白大量丢失，血清白蛋白很低的时候，身体凝血平衡打乱，血栓的风险会明显的升高，但不是每个人都需要吃抗凝药。", "seconds": 120, "stop": "max_duration", "basis": "用户指定原稿；同时列最新候选，均不冒充自动匹配成功", "documents": [{"messageId": 223173, "title": "KP18 肖良祥 Z 同样是肾病，IgA和膜性有什么不同？", "recordedScore": 0.3746, "body": "封面：同样是肾病，IgA和膜性有什么不同？\n标题：IgA肾病和膜性肾病有什么区别？\n#抖出健康知识宝藏 #健康科普进行时#肾病#IgA肾病#肾\n\n同样是肾病，IgA肾病和膜性肾病有什么区别？虽然都伤到了肾脏这个“过滤器”，但坏的位置不一样，表现不一样，治疗方法当然也不能混着来。\n先说IgA肾病。\n它有一个比较有特点的表现，就是有些人感冒、嗓子发炎以后，很快发现尿液变红、变成浓茶色或者洗肉水色。这是因为尿里出现了比较多的红细胞，也就是肉眼血尿。\nIgA本来是身体里帮助我们抵抗感染的一种抗体。但问题是，有些人的IgA结构不太正常，身体又把这些异常IgA当成了需要处理的东西，于是它们抱成一团，形成免疫复合物。\n你不用记得很复杂，简单来说，就是一团要处理的垃圾，跑到了肾脏过滤网上，引起了炎症。过滤网一发炎，红细胞和蛋白质就可能漏进尿里，所以会出现血尿、泡沫尿。\n所以感冒后出现血尿，千万别等，要马上去医院，尿常规、尿蛋白和肾功能检查，只能帮助医生判断肾脏是否可能出了问题。真正确定IgA肾病，需要做肾穿刺，取一点肾组织进行检查，看看是不是有IgA沉积在肾小球里。\nIgA肾病的治疗，不能只盯着尿里有没有血。真正影响肾脏长期结果的，是尿蛋白有多少、血压高不高，以及肾功能下降得快不快。\n所以治疗的基础，是控制血压、减少尿蛋白、少吃盐、戒烟和控制体重。要不要激素、靶向药或者其他免疫治疗，要根据具体情况来定。\n再说膜性肾病。\n它更常见的画面，是泡沫越来越多，眼皮和腿开始肿，有的人体重几天就明显增加。\nIgA肾病主要是过滤网中间发炎，膜性肾病是过滤网外面那层屏障受伤。\n简单来说，免疫系统认错了人，开始攻击肾脏过滤屏障上的一个目标。屏障被破坏以后，本来应该留在血液里的蛋白质，就大量漏进尿里了。\n蛋白从血液里跑掉，血液留不住水，人就容易眼皮肿、腿肿，严重时全身都肿。检查还可能发现血白蛋白降低、血脂升高。\n膜性肾病还有一个要特别注意的风险，就是血栓。蛋白漏得特别多、血白蛋白很低的时候，身体的凝血平衡可能发生变化，血栓风险会升高。\n但别听到这里就自己吃阿司匹林，不是每个人都要抗凝，医生要结合白蛋白水平、蛋白尿多少、出血风险和其他因素决定。\n最后给大家总结成最容易记住的版本。\nIgA肾病，比较有特点的是感染前后出现血尿，但真正决定风险的，不能只看尿的颜色，还要看尿蛋白、血压和肾功能。\n膜性肾病，更常见的是大量蛋白尿和水肿，同时要留意血白蛋白下降以及血栓风险。\n不管是哪一种，都不能只凭泡沫尿、血尿或者年龄自己诊断。记住“两看、三查、一复诊”。\n两看，看尿液颜色有没有明显变化，看眼皮和双腿有没有水肿。\n三查，查尿蛋白，查血肌酐和估算肾小球滤过率，查血压。\n一复诊，就是根据病情定期回肾内科复查。病情稳定的人，常见是每三到六个月复查一次；刚调整药物、尿蛋白较多或者肾功能不稳定的人，医生通常会安排得更密一些。\n如果突然尿量明显减少、水肿迅速加重，或者出现一侧小腿肿痛、胸痛、呼吸困难，就不要等常规复查了，要及时去医院。\n两个病名字里都有“肾病”，但走的不是同一条路。分清它们，不是为了考试，而是让你知道该盯哪些指标、该防什么风险，也别拿别人的治疗方案往自己身上套。\n\n\n", "source": "本地DOCX；已核对候选记录MD5", "error": "", "recomputedScore": 0.3746}, {"messageId": 230936, "title": "KP22 肖良祥 Z 尿蛋白和血尿有什么区别？", "recordedScore": 0.1188, "body": "封面：尿蛋白和血尿有什么区别？\n标题：尿蛋白和血尿有什么区别？一条视频教你看懂\n#抖出健康知识宝藏 #健康科普进行时#尿蛋白#血尿#尿潜血\n\n想知道肾脏好不好，你一定要分清两个异常：尿蛋白和血尿。尿蛋白和血尿都可能跟肾脏有关，但它们完全不是一回事。\n先说尿蛋白。\n大家可以把肾脏想象成一张过滤网。身体里的废物可以通过这张网，跟着尿液排出去；蛋白质是身体需要的东西，正常情况下应该留在血液里。\n如果这张网受损了，蛋白质就可能漏进尿里，这就是尿蛋白。常见原因包括高血压、糖尿病和各种肾脏疾病。\n但要注意两点：\n一是泡沫多不一定是尿蛋白，尿得急、喝水少、马桶里有清洁剂，都可能产生泡沫。真正有没有尿蛋白，要看化验结果。\n二是一次尿蛋白阳性，不一定就是肾病。剧烈运动、发烧、熬夜、喝水太少，都可能让尿蛋白暂时升高。所以偶然发现尿蛋白，先不要自己吓自己，可以避开这些情况，用早晨第一次尿再复查。\n再说血尿。\n血尿就是尿液里出现了红细胞。红细胞少，尿的颜色可能完全正常，只有化验才能发现；红细胞多，尿液可能变成粉红色、红色、洗肉水样，甚至出现血块。\n血尿的原因很多。尿路感染、结石、肾炎、前列腺疾病、外伤，都可能引起血尿；少数情况下，也可能和泌尿系统肿瘤有关。\n如果血尿时伴有尿频、尿急、尿痛，更多可能是尿路感染；如果伴有突然发作的腰腹部剧痛，要考虑结石；如果尿色发红却不痛，尤其是中老年人或者长期吸烟的人，哪怕只出现过一次，也要怀疑肿瘤，及时去肾内科检查。\n所以，尿蛋白和血尿最大的区别：尿蛋白是肾脏的过滤网漏了；血尿更像是肾脏或者尿路某个地方出血了。\n持续尿蛋白升高，说明肾脏可能正在受到损伤。时间长了，肾功能可能逐渐下降。尿蛋白特别多的人，还可能出现眼皮肿、腿肿、血压升高。\n血尿更多是一种报警信号，关键要找到血从哪里来。感染和结石引起的血尿，可以针对病因处理；如果是肾炎或者肿瘤，就需要尽早发现、尽早治疗。\n还有一种情况更需要重视，就是尿蛋白和血尿同时出现。\n如果同时还有眼皮肿、腿肿、血压升高、尿量减少，或者肾功能异常，更要警惕肾脏本身出了问题，尽快去肾内科检查。\n讲到这里，很多朋友一定会问：尿蛋白和血尿到底应该怎么办？\n先讲尿蛋白。\n尿蛋白不是靠少吃几个鸡蛋、少喝几口牛奶就能解决，关键是找到肾脏损伤的原因。\n第一，把血压和血糖控制好。它们都是伤肾的原因，如果长期超标，尿蛋白往往很难真正降下来。\n第二，管住生活方式。少吃过咸的食物，避免长期热量过剩，保持规律运动。不要滥用药物和保健品。\n第三，该用药时不要硬扛。对于符合条件的慢性肾病患者，医生可能根据血压、尿蛋白、血钾和肾功能，使用药物降低尿蛋白、保护肾脏。但这些药不能自己买，更不能随便停。\n再讲血尿怎么处理。\n如果是尿路感染，要结合尿频、尿急、尿痛以及尿培养结果判断，确实存在细菌感染，才能按医嘱使用抗菌药。\n如果是结石，要根据结石的位置、大小、梗阻情况，以及有没有感染，决定观察、排石还是进一步处理。\n如果怀疑肾小球疾病，重点是肾功能、尿蛋白、尿沉渣、血压以及相关免疫学检查；\n如果怀疑泌尿系统肿瘤，还要按照风险分层，进行超声、CT尿路成像或者膀胱镜检查。\n如果出现鲜红色肉眼血尿、排出血块、尿不出来、明显腰腹痛伴发热，或者酱油色尿同时伴有水肿、血压升高、尿量减少，就不要在家继续观察，要马上去急诊。\n把这条视频转给家里的老人，下一次看到化验单，就知道哪些情况可以规范复查，哪些情况必须尽快去医院。\n", "source": "本地DOCX；已核对候选记录MD5", "error": "", "recomputedScore": 0.1188}, {"messageId": 187092, "title": "KP4 肖良祥 Z 降压药到底保肾还是伤肾？", "recordedScore": 0.1128, "body": "封面：降压药到底保肾还是伤肾？\n标题：血压正常了，肾却不好了，降压药到底保肾还是伤肾？\n#抖出健康知识宝藏 #健康科普进行时#降压药#高血压#肾脏\n\n为什么血压降下来了，肾功能却坏了，肾友吃降压药，怎么保护肾脏？很多人拿着化验单问，是不是吃药把肾吃坏了，还有的人怕吃药伤肾，自己把药停了。\n每次听到这些，我心里都堵得慌，因为把肾推向衰竭的，往往不是那粒正吃的药，而是一个落后的观念：是药三分毒。\n今天我就来讲清楚这一件事。\n把两颗肾想成一座工厂，里面装着几百万台微型净水器，每一台就是一个肾小球，一头接进水管，一头连出水管。\n血压正常的时候，肾脏自己会配一个阀门，调节血流快慢，让净水器里的压力始终正常。但如果血压长期高，这个阀门就先垮了。高压天天冲刷肾小球内脆弱的血管，管壁会慢慢变厚变硬，拉扯磨损肾小球的滤过膜，就会磨出细小的伤口。\n一旦滤网破了，本该留在血里的蛋白，就会漏进尿里，这就是蛋白尿，也是马桶里那层冲不散的泡沫。\n更要命的是，蛋白尿不只是肾受伤的信号，它本身还带毒性，反过来刺激肾小管，让肾脏进一步受伤。\n所以高血压千万别怕伤肾不吃药，等到脚开始肿，恶心吃不下，脸色发白出现贫血的时候，肾功能往往已经丢掉一半以上。\n但为什么吃降压药，肌酐还会高？\n普利、沙坦这类药，能松开肾的出水管，减小这个净水器的压力，滤网也会更安全。但压力降低了，过滤的速度会暂时慢一些，反映到抽血单上，就是肌酐高了一点。但不用太害怕，这叫功能性变化，不是肾被吃坏了。\n肌酐比用药前升高不超过三成，也没有血钾升高，就不用停药，这不但不是坏事，反而是药起了效肾开始受保护的标志，这个节骨眼上，要是自己把药停了，那就真成了因噎废食，白白扔掉了药物对肾的保护。\n那其他降压药也能护肾吗？它们护肾的逻辑，是把全身血压平稳控制达标，靠降压来减轻对肾脏血管的冲击，降低高血压肾病的风险。\n但吃药只是其中一条腿，还有一条是生活方式，这两条腿一起走，才能又快又好。\n第一是避免伤肾诱因，比如乱吃药，像布洛芬、双氯芬酸这类非甾体抗炎药，还有来路不明的偏方和保健品，都可能伤到肾脏。拉肚子、发烧出汗导致脱水，泌尿系统感染，做增强CT用的造影剂，抽烟、喝酒、熬夜等等，也会给肾脏增加负担。\n第二是严格控盐，每天食盐别超过五克，大约一啤酒瓶盖。酱油、蚝油、咸菜、腊肉、加工肉、挂面，里面的盐都不少，尽可能少吃。\n第三是坚持适度运动，运动能帮着降压、减重、改善胰岛素抵抗，对肾是间接的保护。建议每周累计一百五十分钟中等强度有氧运动，快走、慢跑、游泳、骑车、打太极都行，摊到每天就是一周五天，每次半小时。\n高血压合并慢性肾病，是一场要打很多年的拉锯战，前期不声不响，后期一恶化又几乎不可逆，好在现在医学越来越发达，有护肾的沙坦普利，又有各种护肾的药物，别等到坐上透析机那天，才后悔当初为什么停了小小一片药，相信您的主治医生，规范吃药，定期复查，就能守住肾脏的长久健康。\n\n", "source": "本地DOCX；已核对候选记录MD5", "error": "", "recomputedScore": 0.1128}, {"messageId": 223172, "title": "KP17 肖良祥 Z 可以停药的高血压", "recordedScore": 0.1128, "body": "封面：可以停药的高血压\n标题：有一种高血压可以减药甚至停药，但确实大多数人忽视了\n#抖出健康知识宝藏 #健康科普进行时#高血压#肾脏健康#肾动脉狭窄\n\n有一类高血压，找到背后的病根后，有机会大幅好转，一部分人还能减药，甚至不用长期吃药。但现实是很多人吃了一种、两种、三种，甚至四五种降压药，血压还是降不下来，却还在不停地加药、换药。\n因为你的诊断可能是错的，这根本不是普通的高血压，而是肾血管性高血压。\n这个病很多人没听说过，也很容易被漏掉。其实就是给肾脏供血的血管变窄了，流到肾脏里的血减少。肾脏不知道是血管堵了，它会误以为是全身血压太低，于是拼命想办法把血压升上去。它一边让血管收紧，一边让身体留住更多的水和盐。所以这种人的血压往往特别难降，不是因为药不够好，而是身体一直在跟降压药对着干。\n这种病典型的特点，就是原来的血压还比较稳定，最近突然变得很高，三四种降压药都压不下来。\n有的人抽血检查，有时会发现肌酐悄悄往上走，或者血钾偏低。医生听诊的时候，可能在上腹部、腰背部听到血管杂音。只是这些信号都不算特别典型，很容易被忽视。\n更要注意的是，肾动脉狭窄影响的可不只是血压。肾脏长期供血不足，可能会慢慢萎缩，肾功能也会越来越差。如果两边的肾动脉都严重狭窄，还可能出现心衰、肺水肿，胸闷、喘不上气，甚至半夜躺着睡觉都会被憋醒。\n所以如果你已经吃了三种降压药，其中还有一种利尿剂，血压还是控制不好，就不要只顾着继续加药，还要看看是不是肾动脉出了问题。\n怎么查呢？通常可以先做一个肾动脉彩超。如果彩超看不清楚，或者医生还是高度怀疑，可以进一步做肾动脉CTA或者磁共振血管检查。\n不过这里一定要注意：检查发现肾动脉狭窄，不代表你的高血压一定就是它引起的，也不是看到狭窄就必须放支架。因为很多中老年人血管，多少都会有一些斑块和狭窄，关键要看它堵得严不严重，是不是真的影响了肾脏供血，是不是已经导致血压高、或者肾功能下降。\n如果是年轻人，因为血管本身发育问题，导致了肾动脉狭窄，那么用球囊把狭窄的地方扩开以后，血压很可能会明显下降，有些人还能减少，甚至停掉降压药。\n但如果是中老年人，这类人的肾动脉狭窄，更常见的原因是动脉粥样硬化，这时不能看到狭窄就放支架。多数人首先还是要好好吃药，把血压、血脂控制好。只有血压实在控制不住、肾功能越来越差，或者反复出现急性心衰、肺水肿的人，才要考虑把狭窄的血管打开。\n当然，我也必须强调，大部分人的高血压，还是原发性高血压，找不到一个可以直接去掉的病因，不能指望吃几天药就能根治，而是要长期、规律地控制。\n而且不管是哪一种高血压，都不能只盯着今天吃了几片药。因为降压药在前面踩刹车，你每天的生活可能还在后面踩油门：一顿重口味的饭，会让身体把更多的水和盐留下来；腰围越来越大，会让血压变得更难控制；晚上打鼾、反复缺氧，第二天早上的血压就可能特别高。最后你看到的是药越吃越多，却没有发现真正拖后腿的，可能是每天都在重复的生活习惯。所以控制血压，不是简单地“管住嘴、迈开腿”，而是要把那些一直在抵消药效的事情，一件一件找出来。\n把病因、药物和生活方式这三件事都管好，才是真正把血压控制住。\n\n\n", "source": "本地DOCX；已核对候选记录MD5", "error": "", "recomputedScore": 0.1128}, {"messageId": 204327, "title": "KP7 肖良祥 Z 泡沫尿担心肾病，要做哪些检查？", "recordedScore": 0.109, "body": "封面：泡沫尿担心肾病，要做哪些检查？\n标题：尿中有泡沫担心肾病，该做哪些检查？\n#抖出健康知识宝藏 #健康科普进行时#泡沫尿#蛋白尿#肾病\n\n门诊几乎每天都会有人问，尿里有泡沫，是不是肾有问题，要不要做检查？很多人早上起床发现泡沫多，网上越查越害怕，怕肾衰竭、尿毒症。今天我就跟大家把这件事说清楚：泡沫尿有一部分不是病，不要过度的害怕。真正要担心的是哪一种，又该做什么检查，才能少花冤枉钱，又尽量不漏掉病情。\n首先大部分泡沫尿其实是生理性的。\n比如你憋尿时间比较久，排尿的时候冲击力很大，就容易打出泡沫；\n再比如喝水太少、出汗多，尿液高度浓缩，里面代谢废物浓度变高，也会起泡沫。\n前一天高蛋白饮食、剧烈运动、发烧、熬夜，甚至排尿位置偏高，都可能短暂出现泡沫。\n这种生理性泡沫，有大有小，静置几分钟，大部分会慢慢消散。\n真正要警惕的是病理性的蛋白尿泡沫。这种泡沫是细密、均匀的小泡沫，像啤酒沫、或者洗衣粉搅出来的一样，堆在尿液表面，十几分钟甚至更久都不消散。这是因为肾脏的滤过屏障受损，不该漏出去的蛋白跑到尿里，尿液的表面张力发生了改变。\n而且它不是偶尔出现，如果最近排尿反复有，那就要注意了。\n但有一种情况也要注意，尿路感染、尿里糖分很高的时候，同样也可能产生持久泡沫，所以肉眼看见泡沫，只能当做一个提醒，不一定是肾脏问题。最终确诊还是要去泌尿外科或肾内科。\n那怀疑肾病要做哪些检查？我给大家从基础到深入讲一讲。\n第一个是尿常规，这是很多人的第一道防线，价格也很便宜，一次就能看到尿蛋白、尿红细胞、白细胞、尿糖、尿比重这些指标，可以初步区分到底是蛋白漏出来了，还是有感染。但是尿常规也有短板，它容易受喝水多少、尿液稀释的影响，轻度的微量蛋白，尿常规可能显示阴性。\n所以我们就要看第二个检查，尿微量白蛋白和肌酐的比值。很多早期肾病，尿常规里蛋白还是阴性，但肾脏已经开始少量漏蛋白了，这个检查就能把它抓出来。适合高血压、糖尿病这类容易伤肾的人群做早期筛查，如果你最近有泡沫尿，我是比较建议跟尿常规一起查。\n第三个，如果上面两项提示蛋白阳性，医生可能会安排24小时尿蛋白定量。这个检查能看一天到底从尿里漏掉多少蛋白，是评估蛋白尿多少的金标准。\n但是它留尿稍微麻烦一点，需要完整收集一整天全部的尿液，一定要严格按照护士的要求留取，留错了结果就没有参考意义。\n第四个是抽血查肾功能，主要看肌酐、尿素氮、尿酸，还有估算肾小球滤过率。很多人以为肌酐正常，肾功能就正常，这其实是一个误区。肌酐反应没这么快，肾脏早期受损的时候，肌酐经常还在正常范围，等到肌酐明显升高，往往肾功能已经丢失不少了。\n所以它不能单独用来排查肾病，要和尿液检查搭配在一起看。\n第五个是泌尿系彩超，也就是肾脏、输尿管、膀胱的B超。看的是肾脏的形态、大小、皮质厚度，有没有结石、积水、囊肿这些结构性问题。如果肾脏已经缩小、皮质变薄，往往提示慢性肾病时间比较久了。\n如果前面这些基础检查，发现有明显的问题，医生会根据情况，安排更深的检查，比如自身抗体、补体、免疫指标，必要的时候还会考虑肾穿刺活检。这些不是一上来就做，但如果真的开了这些检查，也别因为害怕逃避。\n最后再说一遍，发现泡沫尿不要太过害怕，但也不能不管。先观察泡沫的形态，如果高度怀疑尿蛋白，就要来肾内科、泌尿外科，让医生给你开检查。别自己对着网上瞎猜，也别乱吃补肾偏方，很多偏方成分不明，反而会悄悄加重肾脏负担。规范检查、明确诊断，才是对肾脏负责的做法。\n\n\n", "source": "本地DOCX；已核对候选记录MD5", "error": "", "recomputedScore": 0.109}], "unavailableCount": 0, "matchStatus": "needs_review", "unavailableReasons": []}}, {"key": "doc-244741", "id": "244741", "doctor": "肖良祥", "time": "2026-11-09 16:13:33", "kind": "检查归类误报", "reason": "数字人录制指南是操作表格，不是交接稿件；不应作为“文案正文缺失”阻断作品。", "next": "修正非稿件附件的归类，保留原事件记录。", "title": "[文件] 数字人录制指南(2).xlsx (228.4 KB, xlsx)", "windows": ["244741"], "aspects": [{"kind": "检查归类误报", "reason": "数字人录制指南是操作表格，不是交接稿件；不应作为“文案正文缺失”阻断作品。", "next": "修正非稿件附件的归类，保留原事件记录。"}]}, {"key": "sync-240215", "id": "240215", "doctor": "喻敏", "time": "2026-11-06 16:55:09", "kind": "飞书同步／进度差异", "reason": "飞书已发布，保留远端，不补发较早状态；历史队列／本地进度差异仍需记录。", "next": "保留飞书较新状态，核对作品版本与历史发送链；不回退远端。", dy": "封面：尿突然少了，别急着灌水\n标题：尿突然少了，是喝水少还是肾脏出了问题？这三步比急着灌水更重要\n#抖出健康知识宝藏 #尿量减少 #急性肾损伤 #肾脏健康 #健康科普进行时\n尿突然少了。怎么办？需要赶紧灌水吗？其实不少人啊，一发现自己半天没怎么排尿，就觉得肯定是水喝少了，拿起杯子，一杯接一杯地喝。这个做法不一定对。因为尿少，可能是身体缺水，也可能是肾脏排水能力下降，或者尿液排出的通路堵住了。水喝进去，不一定排得出来。那到底怎么办呢？今天跟大家说三点。\n第一个，如果您发现尿一下少了，首先要分清，是上厕所次数少了，还是排出来的总量真的少了。\n有的人上午只去一次厕所，但一次排得不少；有的人来来回回跑了好几趟，每次却只有一点点。光数次数，判断不了尿量。您可以记录从什么时候开始变少、大概排了多少、喝了多少，带给医生看。但如果突然完全尿不出来，尤其下腹还胀痛，就直接去急诊，不能为了凑记录继续等。\n临床上，成人平均每小时尿量低于每公斤体重0.5毫升，持续至少6小时，需要警惕急性肾损伤。比如60公斤的人，6小时总尿量不到180毫升，就值得重视。这个数字是帮助判断的，不是让您必须等满6小时才去医院。\n第二个呢，您还得想想，最近为什么会尿少？\n是不是忙起来忘了喝水？是不是天热、运动后出了很多汗？有没有发烧、拉肚子，或者一直吐，吃不下也喝不进？这些情况都会让身体丢水，尿量可能跟着减少。\n但这里有个容易忽略的地方：缺水和肾脏出问题，是可能同时发生的。脱水严重了，流到肾脏的血液不够，也可能引起急性肾损伤，不能一想到“我今天喝得少”，就把其他问题排除了。\n还有的人，尿少是肾脏本身受损，或者前列腺、结石等问题影响了尿液排出。最近吃过什么药也要告诉医生，尤其是布洛芬这类止痛药。部分药物遇上脱水，可能增加肾损伤风险，但不要因此把长期处方药自行全部停掉。\n第三个，能不能补水，要看是不是真缺水，也要看身体能不能把水排出去。\n如果只是轻度缺水，人清醒、能正常喝水，也没有需要限水的疾病或医嘱，可以少量分次补充。腹泻、呕吐丢失的不只是水，还可能需要在医生或药师指导下使用口服补液盐。\n但如果本来就有心衰、明显肾功能异常，或者已经水肿、气短，就不能自己定个目标，非得灌进去几大杯水。持续明显尿少，或者恢复正常饮水后尿量仍明显减少，要尽快到医院查肌酐、电解质和尿液，必要时做超声，看看有没有梗阻。\n也别自己找利尿药“催尿”。是否需要补液、利尿，还是解除堵塞，得根据原因决定。\n还有一点，特别提醒啊，尿少同时出现腿越来越肿、胸闷憋气，尤其一躺下就喘不上气，要立即急诊。这时候可能已经有液体潴留，继续灌水反而会加重负担。\n如果还出现意识不清、异常嗜睡、皮肤湿冷，或者呼吸明显变快，也要立即就医，必要时拨打120。\n真的，不管是晚上还是过年过节，突然明显尿少，都别只用一句“喝点水就好了”打发过去。先判断急缓，再查清原因，才能知道这水到底该怎么补。\n", "source": "本地DOCX；已核对候选记录MD5", "error": "", "recomputedScore": 0.4066}, {"messageId": 191267, "title": "杨剑辉kp5 ZY 水喝多了尿就多，肾到底受不受得了？", "recordedScore": 0.102, "body": "封面：喝水多尿多，伤肾吗\n标题：水喝多了尿就多，肾到底受不受得了？\n#抖出健康知识宝藏 #健康科普进行时 #护肾 #肾脏健康 #水中毒\n经常能听到有人这么说：我可不敢多喝水，喝一点就往厕所跑，肾是不是被我喝坏了。说这话的人还挺认真，因为他确实发现自己跟别人不一样，别人坐一下午没事，他得跑好几趟。那这个担心到底有没有道理？今天我就跟你把这件事聊透。\n我先给你一个明确的答案：只要你的肾本身没毛病，喝水多、尿得多，跟“伤肾”这两个字根本不沾边。不但不沾边，它反而说明你的肾反应快、干活利索。\n为什么这么讲？你可以把肾脏想成一套特别聪明的污水处理系统，它一边过滤血液，一边还得决定哪些东西该留下、哪些该扔掉。血液里多余的代谢废物和水分，都会送到肾脏来处理。肾脏里面有大量细小的过滤结构，先把水分和毒素筛出来，然后它还会把身体需要的电解质再收回去一部分，剩下的才变成尿液排走。你水喝多了，血液变稀了，肾脏就会自动少回收一些水分，多排一点尿出去，把体内的平衡维持住。这套调节非常灵敏，能做到这一步，说明你的肾脏反应是好的。\n所以你记住，对健康人来说，适量多喝水不仅不伤肾，还能帮着冲一冲肾脏里堆积的代谢废物，减少肾结石和尿路感染的机会，这本身就是一种保护。\n但是，有两种情况要单独拿出来说，因为它们确实有风险。第一种，是跟比赛似的，短时间内喝特别多水，比如十几分钟干掉5升白开水，或者一口气就要喝1.5升水，肾根本来不及处理，多余的水就会往细胞里钻，人开始头晕、犯恶心，严重的会抽搐，这就是水中毒。另一种是肾本来就病得不轻的人，过滤结构已经坏了，水排不出去，全堆在身体里，水肿会加重，心脏也可能跟着撑不住，就可能引发心衰。这两类情况都属于特殊人群的特殊问题，健康人平时喝水不用照着这个来吓自己。\n那很多人听到这儿就想问：我怎么知道自己的肾到底好不好？别瞎猜！其实身体会提前给你发信号。比如早上起来眼皮肿，到了下午小腿和脚踝一按一个坑，半天弹不回来；比如小便上面飘着一层细密的泡沫，像啤酒沫一样，还好几分钟都不散，这说明过滤屏障可能坏了，蛋白漏到尿里了；还有夜里老得起夜，一晚上两三趟，这是肾把尿浓缩起来的能力在下降。你平时没有这些情况，就不用整天自己吓自己。\n而且你发现没有，大家总盯着喝水多这件事，却忽略了真正在背后慢慢拖垮肾的，是长期喝水太少。缺水时间一长，慢性肾病就容易找上门。这病最麻烦的地方在于早期悄无声息，等浑身难受去查，往往已经到尿毒症那一步了。除了喝水少，还有几件事也在悄悄消耗肾：\n第一，天天拿含糖饮料当水喝，长期过量糖分摄入，不仅增加胰岛负担，更致命的是肾脏的微血管会被高糖环境持续浸泡侵蚀，负责过滤的肾小球慢慢硬化坏死，从血糖偏高演变成糖尿病肾病；\n第二，口味太重、盐吃得太多，盐吃多了，身体里的水分和钠排不出去，全部积攒在体内，会加重肾脏负担，还容易诱发高血压；\n第三，有尿不去、习惯性憋着，长期憋尿，膀胱肌肉弹性会受损，尿液还可能反流刺激肾脏，增加尿路和肾脏炎症的风险；\n第四，止痛药随便吃，偶尔短时间用问题不大，但不能长期连续服用，会带来明显的肾脏副作用。\n那日常到底该怎么护肾？其实不复杂。健康人喝水就记住四个字：少量多次。手边放杯白开水，随时喝两口，尿液是淡淡的浅黄色，就正合适。别等到渴得受不了，才猛灌水。吃饭清淡一点，每天盐控制在5克以内，三餐可以从少盐、少油开始，多选新鲜蔬菜，优质蛋白，肾的负担自然就轻了。有高血压、糖尿病的人，别光盯着血压血糖的数字，最好每年把尿常规和肾功能也查一查。血糖血压长期控制不好，肾里那些细小的血管会一点点变硬。体检报告上哪怕血肌酐、尿蛋白只是轻微异常，别觉得没事就翻过去，早点找医生问清楚。\n其实肾这个器官挺沉默的，它不像胃，吃坏了马上疼给你看，它往往是撑到很后面才出声。所以你要做的不是天天担心喝水多，而是把那些真正伤肾的习惯一个一个改掉。少喝甜饮料，别总憋尿，吃药听医生的，别自己乱买乱吃。身体要是出现了浮肿、泡沫尿这些苗头，别拖，去查一下，心里就踏实了。", "source": "本地DOCX；已核对候选记录MD5", "error": "", "recomputedScore": 0.102}, {"messageId": 230578, "title": "杨剑辉kp16 KX 斑块为什么会破裂？高血压是重要原因，颈动脉有斑块血压更要稳", "recordedScore": 0.0997, "body": "封面：查出颈动脉斑块，血压更要稳\n标题：斑块为什么会破裂？高血压是重要原因，颈动脉有斑块血压更要稳\n#抖出健康知识宝藏 #健康科普进行时 #肾性贫血早知道 #高血压 #心脑血管健康\n查出颈动脉斑块，很多人第一反应是吃他汀稳定斑块，这当然重要。但作为医生，我要告诉你，还有一个更基础、也更容易被漏掉的环节：血压。\n因为斑块不会无缘无故破裂，它往往需要一个“扳机”。你比如说，跟人生气着急、便秘时使劲、突然剧烈运动，这些场景看起来不相关，共同点却是血压会在这时候冲上去。血压一冲高，对血管壁的压力骤然增大，就可能冲破斑块内皮，把斑块撕开。斑块一旦破裂，血栓就可能顺着血流堵住血管。堵到脑血管里，就是脑梗；堵到心血管里，就是心梗。\n对于一个平时血压不高的人，一次血压的剧烈波动都可能成为诱因；一个平时血压就高的人，斑块天天被高压冲刷，就更脆弱。所以对于有颈动脉斑块的朋友，稳定血压这件事不是可做可不做，而是必须做。目标至少要控制在140/90mmHg以下，能耐受的话，更好是控制在130/80mmHg以下。\n那如果测下来血压确实高了，合并颈动脉斑块，医生会怎么考虑用药？其实直到今天，也没有哪一种降压药能称得上完美，只有合不合适。\n你比如说，老年人、单纯收缩期高血压，或者合并颈动脉粥样硬化的人，地平类通常比较对路。像氨氯地平、硝苯地平控释片，降压比较稳，但有的人吃着吃着脚踝会肿，这跟剂量有关，肿得明显就跟医生商量调整。合并糖尿病、蛋白尿的人，可以选沙坦类，像缬沙坦、厄贝沙坦、阿利沙坦酯；不过用之前和用一段时间之后，要查查血钾和肌酐，不能开完药就不管。合并糖尿病肾病、心衰、蛋白尿的人，普利类也可以选，像依那普利、贝那普利，但吃这种药之后干咳的人不少，咳得影响生活就得找医生换。\n如果一种药控制不理想，或者一种药加量后副作用上来了，医生也会考虑联用不同机制的药。比如常见的沙坦加地平：一个负责拦住让血管收紧的信号，一个负责把血管直接放松，机制互补，地平类常见的脚踝水肿也可能被沙坦类减轻一些。现在还有把两者做成一片的复方制剂,阿利沙坦酯氨氯地平，收缩压能降18个mmHg，用药更简单省心，也更容易坚持，减少血压波动引发的心脑血管意外。\n当然，具体选哪一类、要不要联用、用不用复方制剂，不能自己照着药名买，最好把平时的血压记录、化验单和正在吃的药都带上，去找医生帮你定。\n还有，药选对了，日常也不能松。有斑块的人最怕血压忽高忽低，所以先管住嘴，少盐少油少糖，尤其盐别只算炒菜那勺，咸菜、酱料、加工肉里的隐形盐也要算进去。运动不用追求猛，快走、慢跑这种中等强度，能长期坚持比一次练狠了更重要。平时别一点事就着急上火，便秘别硬憋着使劲，天冷注意保暖，这些都是在防血压突然冲高。日常稳住了，斑块才少受冲击。\n防范斑块破裂是一场持久战，从测准血压、选对方案、管住日常开始。\n", "source": "本地DOCX；已核对候选记录MD5", "error": "", "recomputedScore": 0.0997}, {"messageId": 240251, "title": "杨剑辉kp19 ZY 二十多岁就高血压，以后的日子怎么办？", "recordedScore": 0.0982, "body": "封面：年轻血压高怎么办\n标题：二十多岁就高血压，以后的日子怎么办？\n#抖出健康知识宝藏 #健康科普进行时 #年轻人高血压 #科学管理血压 #高血压\n“你这么年轻就高血压，你将来能养家吗？”\n这句话听着，可能比查出高血压还难受。原作者是一位医生，他讲过，自己27岁查出高血压，去当时女朋友家里，就被未来的岳父这样问过。\n如果你也二十多岁，刚拿到诊断，可能特别能理解这种心情。工作还没站稳，未来还有那么多打算，怎么先跟慢性病扯上关系了？是不是以后干什么都得小心翼翼？\n先别急着把往后的生活想得那么难。高血压需要认真管理，但它不能用来判断一个人能不能工作、能不能照顾家庭。原作者分享这段经历，也是想告诉年轻患者：查出来了，不等于生活就没盼头了。\n他当时正在准备考博士，白天在医院工作，晚上回家继续看书，休息少，精神也一直绷着。不只是考试难，他和女朋友都想继续读博士，还担心考不上的话，两个人以后怎么办。\n再加上家里的饭菜口味比较重，几个因素赶在了一起。按照他的回忆，那时候血压测到了140/90毫米汞柱，后来被诊断为高血压。\n当然，这不代表所有年轻人的高血压，都是熬夜、紧张、吃咸了造成的。只是从这段经历里，我们能看到，有些平时觉得“忍一忍就过去”的生活状态，确实值得在就诊时跟医生说清楚，而不是只报一个血压数字。\n后来，他没有一直纠结“为什么偏偏是我”，而是开始调整能调整的事情。先让自己有机会好好休息，再把饭菜的盐减下来，也逐渐开始运动。\n运动不只是出去跑跑步，他还做一些力量训练。不是为了练出多夸张的身材，而是把活动安排进生活里，不再天天坐着工作、坐着看书。\n这些事情说起来不复杂，真正难的是，忙起来还能不能继续做。你比如说，少盐不是偶尔吃一顿水煮菜，休息也不是熬好几天，再指望周末睡一觉全补回来。更现实的做法，是找出自己最容易调整的一处，慢慢形成能维持的习惯。\n他还提到，自己最初用过降压药，后来生活方式改善，血压能够在不用药的情况下保持较好。\n但听到这里，可别只记住“不用吃药”这几个字。原作者讲的是个人经历，不能照着他的结果，替自己决定停药。每个人血压升高的原因、程度，以及有没有其他健康问题，都不一样。\n有的人改善生活方式后，医生评估可以调整用药；也有人即使吃得清淡、运动规律，仍然需要药物帮助。这不代表你不够努力，更不是谁的身体“争气”、谁“不争气”。真正要比较的，是血压有没有得到合适的控制，而不是药盒里少了几片药。\n如果你现在刚查出高血压，可以把自己的睡眠、饮食、运动和服药情况梳理一下，把血压记录带给医生，一起看看接下来怎么安排。不要因为年轻就硬扛，也不用刚听到诊断，就替自己把未来否定了。\n至于家里人，与其问“你以后还能干什么”，不如问一句：“饭菜要不要淡一点？最近是不是太累了？”这样的关心，更能帮得上忙。\n你需要的是把血压管理好，再继续过自己的生活，不是从此每天都围着“我是个高血压患者”打转。原作者的经历值得带走的，也正是这份信心，而不是一张人人适用的停药证明。\n", "source": "本地DOCX；已核对候选记录MD5", "error": "", "recomputedScore": 0.0982}, {"messageId": 229005, "title": "杨剑辉kp13 ZY 血钾低，是吃得少还是肾脏漏钾？找对原因，补钾才有效", "recordedScore": 0.0971, "body": "封面：血钾低先分清这两种情况\n标题：血钾低，是吃得少还是肾脏漏钾？找对原因，补钾才有效\n#抖出健康知识宝藏 #健康科普进行时 #低钾血症 #血钾 #肾脏健康 \n吃得少造成的低血钾，和肾脏漏钾造成的低血钾，不是一回事儿。很多查出低血钾的人，一说缺钾就笼统地说，我是不是吃得太少了？但是需要先搞清楚，是吃进去的钾不够，还是肾脏排出去的钾太多，原因是不一样的，处理的重点也是不一样的。我给大家详细分析一下，记不住的可以收藏起来，反复看看。\n先说吃得少是怎么回事儿。一般血钾低于3.5毫摩尔每升，就叫低钾血症。这个数值主要反映的是什么呢？它反映的是血液里钾的浓度，不能光看这一个数，就认定自己是吃得少了。因为血钾不光受饮食影响，还跟钾排出去多少、有没有转移到细胞里面有关。\n简单来说，身体需要的钾，主要靠食物提供，吃进去以后通过胃肠道吸收。而肾脏负责管着钾的出口，吃进去少了，正常肾脏就会尽量少排一点，把钾留住。所以，单纯因为吃得少，就出现低血钾，其实并不常见。\n那吃得少的人查出低血钾，重点要看什么呢？第一，是不是长期严重节食，或者一直胃口差、吃不下，摄入确实不够。第二，吃得少的同时，是不是还在腹泻，或者用了会增加丢钾的药。前面补进来的少，后面还在往外丢，血钾就更容易降下来。这里面，腹泻主要是从肠道丢钾，不能都算到肾脏头上。\n所以，确实存在摄入不足，那重点要调什么呢？先把饭吃够、吃均衡，蔬菜、豆类、薯类合理搭配，这些食物都能提供钾。如果还有持续腹泻，也要一起处理。已经查出低血钾，要不要用补钾药，还得看具体情况，不能觉得多吃几根香蕉就一定够了。\n再说说肾脏漏钾。每天从尿里排出一些钾，这是正常的，谁都会排，关键是血钾已经低了，肾脏有没有相应少排一点。如果这时候尿里仍然丢掉过多的钾，就要考虑肾性失钾。医生会根据情况查24小时尿钾，或者尿钾和肌酐的比值，再结合用药等信息来判断。\n原因可以重点查三个方面。\n第一种，药物的影响。比如呋塞米、氢氯噻嗪这类排钾利尿剂，在帮助身体排盐、排水的同时，也可能增加钾的流失。这种情况重点是把正在吃的药核对清楚，让医生看看要不要调整用药、要不要补钾，之后还要复查血钾和肾功能，别自己直接把药停了。\n第二种，醛固酮的作用太强。这个激素会让肾脏多留钠、多排钾，作用过强，钾就容易从尿里丢出去。如果你既有高血压，又反复低血钾，就要让医生评估一下，有没有原发性醛固酮增多症，需要时检查醛固酮和肾素。有些患者需要用药阻断醛固酮的作用，减少肾脏丢钾，不能只补钾，不处理原因。\n第三种，肾小管的转运功能出了问题，肾脏没能把钾留好。这种情况就要找医生进一步评估，结合血压、血镁、酸碱状态等检查，看看具体是什么原因。尤其是补了钾，血钾还是反复低的，还要注意有没有同时缺镁。因为缺镁也会增加肾脏丢钾，镁没纠正，钾就可能一直不好补上来。\n最后给大家总结一下，吃得少，重点看饮食够不够、有没有同时增加丢失；肾脏漏钾，重点看尿钾，再查药物、激素和肾小管的问题。不要一看到血钾低，就只想着多吃点含钾食物。找对原因，补进去的钾才能更好地留住。\n", "source": "本地DOCX；已核对候选记录MD5", "error": "", "recomputedScore": 0.0971}], "unavailableCount": 0, "matchStatus": "needs_review", "unavailableReasons": []}}, {"key": "event-242200", "id": "242200", "doctor": "杨剑辉", "time": "2026-11-07 23:52:10", "kind": "作品关联／证据", "reason": "视频开头未达到唯一文案匹配标准", "next": "根据稿件正文、真实引用及同一作品版本核对；不以最高分或相同标题强行推进。", "title": "尚未关联作品", "windows": ["242200", "191268", "191267", "208058"], "aspects": [{"kind": "作品关联／证据", "reason": "视频开头未达到唯一文案匹配标准", "next": "根据稿件正文、真实引用及同一作品版本核对；不以最高分或相同标题强行推进。"}], "comparison": {"capturedAt": "2026-11-10T12:00:02+08:00", "transcript": "这么年轻就高血压，将来能养家吗？这句话可能比查出高血压本身还难受。因为年轻讲过他 是这些长期损伤", "recordedScore": 0.1055, "body": "封面：肾脏为什么总是坏得悄无声息？\n标题：肾衰往往不是突然发生，真正该防的是这些长期损伤\n#抖出健康知识宝藏 #健康科普进行时 #慢性肾病 #肾脏健康 #高血压管理\n一个人平时能吃能睡，腰也不疼，怎么查出肾病时，已经到了需要透析的程度？你可能会觉得，身体出了这么大的问题，总该提前给点提醒吧。可肾脏的麻烦就在这里：有没有不舒服，和它还能完成多少工作，并不总是同步的。\n两个肾脏里大约有两百万个肾单位，它们每天反复过滤血液，把代谢废物和多余水分排出去。可是肾单位受损以后，人不一定马上难受，因为剩下的肾单位会增加工作量，暂时把整个系统撑住。也就是说，化验结果一时没有明显异常，不代表肾脏一直没有损伤。等这种代偿能力也撑不住了，肌酐升高、水肿、乏力等表现才可能逐渐出现，而这时肾功能往往已经损失了一部分。\n这也解释了为什么慢性肾病容易被忽视。我国调查显示，成人慢性肾病知晓率只有大约10%，很多人并不知道自己的肾脏已经出现问题。所以真正要防的，并不是某一天突然发生的“尿毒症”，而是那些持续多年、不断损伤肾脏的因素。\n其中很常见的一项就是高血压。肾小球里分布着大量细小血管，血压长期偏高，相当于这些血管一直在高压下工作，时间久了就可能硬化、受损。反过来，肾功能下降又会让血压更难控制，两件事会互相影响。因此，高血压患者不能只看自己有没有头晕，也不能觉得血压偶尔正常就自行停药。多数患者需要在能够耐受的前提下，把血压控制到医生设定的范围；吃药后仍不达标，也不要自己加量或换药，而要让医生根据肾功能、血钾和其他疾病调整方案。\n接下来是盐。盐吃多以后，身体容易潴留水分，血压也更难降下来，肾小球承受的压力自然会增加。需要控制的不只是炒菜时放进去的盐，咸菜、腐乳、酱料、加工食品和外卖里的钠都要算进去。成年人每天食盐最好控制在5克以内，大约是一平茶匙，而不是把一个瓶盖当作通用量具，因为瓶盖大小并不统一。\n还有人担心，喝水以后尿多，是不是会把肾脏累坏？对于没有被医生限制饮水的人来说，正常喝水、及时排尿，并不会因为尿量增加就损伤肾脏。真正需要避免的是长时间缺水和反复憋尿，因为尿液过度浓缩会增加结石等问题的风险，长期憋尿也可能诱发泌尿系统不适。但水也不是越多越好，已经有心衰、明显水肿或严重肾功能异常的人，饮水量要听医生安排。\n至于经常熬夜，它不会单独决定一个人是否发生肾衰，但长期作息紊乱可能影响血压和代谢，让原本已经存在的风险更难控制。保护肾脏，重点不是临时喝几天养生茶，而是把血压管住、减少高盐饮食、按需饮水、及时排尿，同时不要随意服用止痛药、偏方或成分不明的保健品。\n尤其是患有高血压、糖尿病、高尿酸血症，或者家里有人得过肾病的人，别只查一项肌酐。定期检查血肌酐、估算肾小球滤过率和尿白蛋白，才能更早发现变化。肾脏的问题往往发展得慢，这确实容易让人放松警惕；但也正因为发展需要时间，越早发现、越早控制危险因素，就越有机会把肾功能保护得更久。\n", "source": "本地DOCX；已核对候选记录MD5", "error": "", "recomputedScore": 0.1055}, {"messageId": 191267, "title": "杨剑辉kp5 ZY 水喝多了尿就多，肾到底受不受得了？", "recordedScore": 0.1051, "body": "封面：喝水多尿多，伤肾吗\n标题：水喝多了尿就多，肾到底受不受得了？\n#抖出健康知识宝藏 #健康科普进行时 #护肾 #肾脏健康 #水中毒\n经常能听到有人这么说：我可不敢多喝水，喝一点就往厕所跑，肾是不是被我喝坏了。说这话的人还挺认真，因为他确实发现自己跟别人不一样，别人坐一下午没事，他得跑好几趟。那这个担心到底有没有道理？今天我就跟你把这件事聊透。\n我先给你一个明确的答案：只要你的肾本身没毛病，喝水多、尿得多，跟“伤肾”这两个字根本不沾边。不但不沾边，它反而说明你的肾反应快、干活利索。\n为什么这么讲？你可以把肾脏想成一套特别聪明的污水处理系统，它一边过滤血液，一边还得决定哪些东西该留下、哪些该扔掉。血液里多余的代谢废物和水分，都会送到肾脏来处理。肾脏里面有大量细小的过滤结构，先把水分和毒素筛出来，然后它还会把身体需要的电解质再收回去一部分，剩下的才变成尿液排走。你水喝多了，血液变稀了，肾脏就会自动少回收一些水分，多排一点尿出去，把体内的平衡维持住。这套调节非常灵敏，能做到这一步，说明你的肾脏反应是好的。\n所以你记住，对健康人来说，适量多喝水不仅不伤肾，还能帮着冲一冲肾脏里堆积的代谢废物，减少肾结石和尿路感染的机会，这本身就是一种保护。\n但是，有两种情况要单独拿出来说，因为它们确实有风险。第一种，是跟比赛似的，短时间内喝特别多水，比如十几分钟干掉5升白开水，或者一口气就要喝1.5升水，肾根本来不及处理，多余的水就会往细胞里钻，人开始头晕、犯恶心，严重的会抽搐，这就是水中毒。另一种是肾本来就病得不轻的人，过滤结构已经坏了，水排不出去，全堆在身体里，水肿会加重，心脏也可能跟着撑不住，就可能引发心衰。这两类情况都属于特殊人群的特殊问题，健康人平时喝水不用照着这个来吓自己。\n那很多人听到这儿就想问：我怎么知道自己的肾到底好不好？别瞎猜！其实身体会提前给你发信号。比如早上起来眼皮肿，到了下午小腿和脚踝一按一个坑，半天弹不回来；比如小便上面飘着一层细密的泡沫，像啤酒沫一样，还好几分钟都不散，这说明过滤屏障可能坏了，蛋白漏到尿里了；还有夜里老得起夜，一晚上两三趟，这是肾把尿浓缩起来的能力在下降。你平时没有这些情况，就不用整天自己吓自己。\n而且你发现没有，大家总盯着喝水多这件事，却忽略了真正在背后慢慢拖垮肾的，是长期喝水太少。缺水时间一长，慢性肾病就容易找上门。这病最麻烦的地方在于早期悄无声息，等浑身难受去查，往往已经到尿毒症那一步了。除了喝水少，还有几件事也在悄悄消耗肾：\n第一，天天拿含糖饮料当水喝，长期过量糖分摄入，不仅增加胰岛负担，更致命的是肾脏的微血管会被高糖环境持续浸泡侵蚀，负责过滤的肾小球慢慢硬化坏死，从血糖偏高演变成糖尿病肾病；\n第二，口味太重、盐吃得太多，盐吃多了，身体里的水分和钠排不出去，全部积攒在体内，会加重肾脏负担，还容易诱发高血压；\n第三，有尿不去、习惯性憋着，长期憋尿，膀胱肌肉弹性会受损，尿液还可能反流刺激肾脏，增加尿路和肾脏炎症的风险；\n第四，止痛药随便吃，偶尔短时间用问题不大，但不能长期连续服用，会带来明显的肾脏副作用。\n那日常到底该怎么护肾？其实不复杂。健康人喝水就记住四个字：少量多次。手边放杯白开水，随时喝两口，尿液是淡淡的浅黄色，就正合适。别等到渴得受不了，才猛灌水。吃饭清淡一点，每天盐控制在5克以内，三餐可以从少盐、少油开始，多选新鲜蔬菜，优质蛋白，肾的负担自然就轻了。有高血压、糖尿病的人，别光盯着血压血糖的数字，最好每年把尿常规和肾功能也查一查。血糖血压长期控制不好，肾里那些细小的血管会一点点变硬。体检报告上哪怕血肌酐、尿蛋白只是轻微异常，别觉得没事就翻过去，早点找医生问清楚。\n其实肾这个器官挺沉默的，它不像胃，吃坏了马上疼给你看，它往往是撑到很后面才出声。所以你要做的不是天天担心喝水多，而是把那些真正伤肾的习惯一个一个改掉。少喝甜饮料，别总憋尿，吃药听医生的，别自己乱买乱吃。身体要是出现了浮肿、泡沫尿这些苗头，别拖，去查一下，心里就踏实了。", "source": "本地DOCX；已核对候选记录MD5", "error": "", "recomputedScore": 0.1051}, {"messageId": 208058, "title": "杨剑辉kp7 ZY 肌酐没有箭头，为什么也不能完全排除肾脏问题？", "recordedScore": 0.103, "body": "封面：肌酐正常就没事\n标题：肌酐没有箭头，为什么也不能完全排除肾脏问题？\n话题：#抖出健康知识宝藏 #健康科普进行时 #肌酐 #肾功能检查 #肾脏健康\n来拿出你最近一次的化验报告，我今天必须教会你们看一个数，就是这个代表肾功能的肌酐。不过，看肌酐不能只找旁边有没有箭头：没有箭头，不一定能排除肾脏问题；出现箭头，也不能直接认定肾功能已经受损。关键是结合自身情况、过去的结果和其他检查一起判断。\n为什么同样一个数，放在不同人身上，意义可能不一样？因为肌酐主要来自肌肉中肌酸的代谢，之后主要通过肾脏排出。它在血液里的水平，既受肾脏排泄能力影响，也与身体产生了多少有关。\n你比如说，肌肉量比较大的人，产生的肌酐可能更多，数值偏高不一定完全是肾脏排不出去。反过来，肌肉量较少的人，即使肾脏过滤能力有所下降，肌酐也可能仍在参考范围内。所以，不能因为自己健身就忽略异常，也不能给所有瘦小女性划一条相同的判断线。\n报告上的参考范围仍然有用，只是不能单独决定诊断。不同实验室的检测方法和参考范围可能存在差异，拿两次报告比较时，也要确认单位是否一致。尽量在条件相近、同一家医院复查，有助于看清变化。\n除了看这次的结果，还要翻翻以前的报告。如果肌酐持续上升，哪怕尚未超过参考上限，也值得让医生评估。但这不等于一年涨到某个固定数值，就一定出现了肾损伤。变化有多大、发生得多快，以及检查前的饮食、运动、身体状态和用药，都需要一起考虑。\n你可能会问，既然肌酐受这么多因素影响，那到底怎样了解肾功能？通常还要看估算肾小球滤过率，也就是报告上常见的eGFR。它把肌酐与年龄、性别等信息结合起来，帮助估计肾脏过滤血液的能力，比孤立地看一个肌酐数值更有参考价值。\n不过，它毕竟是估算。对于肌肉量特别多或特别少、结果与实际情况不一致的人，医生可能进一步检测胱抑素C，或者选择其他方法评估，并不是人人都必须留24小时尿。\n如果医生确实安排了24小时尿液检查，要按要求完整收集，因为漏留会影响结果。通过尿液和血液中的肌酐，可以计算内生肌酐清除率，但这个数不能简单替代肾小球滤过率，也不能仅凭一次结果就给慢性肾病分期。\n这里尤其要分清“低于60”是什么意思。慢性肾病的判断需要结合异常是否持续至少三个月等依据；肾小球滤过率持续处于30～59毫升每分钟每1.73平方米，才属于G3期的范围。不是所有低于60的结果都叫三期，更不代表下一步必然就是尿毒症。\n另外，肾脏有没有问题，还不能漏掉尿液检查。有些人肌酐没有升高，却已经出现持续的白蛋白尿或蛋白尿，这可能提示肾脏损伤，需要进一步查明原因。但一次尿蛋白异常，也要结合情况复查确认，不能立即等同于肾衰竭。\n所以，下次看报告，不妨把肌酐、估算肾小球滤过率和尿液检查放在一起，再与过去的结果比较。有持续异常或明显变化，就带着历次报告去肾内科，而不是只等箭头出现。\n早发现的意义，是争取尽早处理病因、延缓进展。即使到了肾衰竭阶段，也不是只有医院透析这一种安排，还可能根据条件选择腹膜透析或肾移植。我们需要重视风险，但不必把一次化验异常，直接想成未来一定失去正常生活。\n", "source": "本地DOCX；已核对候选记录MD5", "error": "", "recomputedScore": 0.103}, {"messageId": 229005, "title": "杨剑辉kp13 ZY 血钾低，是吃得少还是肾脏漏钾？找对原因，补钾才有效", "recordedScore": 0.0947, "body": "封面：血钾低先分清这两种情况\n标题：血钾低，是吃得少还是肾脏漏钾？找对原因，补钾才有效\n#抖出健康知识宝藏 #健康科普进行时 #低钾血症 #血钾 #肾脏健康 \n吃得少造成的低血钾，和肾脏漏钾造成的低血钾，不是一回事儿。很多查出低血钾的人，一说缺钾就笼统地说，我是不是吃得太少了？但是需要先搞清楚，是吃进去的钾不够，还是肾脏排出去的钾太多，原因是不一样的，处理的重点也是不一样的。我给大家详细分析一下，记不住的可以收藏起来，反复看看。\n先说吃得少是怎么回事儿。一般血钾低于3.5毫摩尔每升，就叫低钾血症。这个数值主要反映的是什么呢？它反映的是血液里钾的浓度，不能光看这一个数，就认定自己是吃得少了。因为血钾不光受饮食影响，还跟钾排出去多少、有没有转移到细胞里面有关。\n简单来说，身体需要的钾，主要靠食物提供，吃进去以后通过胃肠道吸收。而肾脏负责管着钾的出口，吃进去少了，正常肾脏就会尽量少排一点，把钾留住。所以，单纯因为吃得少，就出现低血钾，其实并不常见。\n那吃得少的人查出低血钾，重点要看什么呢？第一，是不是长期严重节食，或者一直胃口差、吃不下，摄入确实不够。第二，吃得少的同时，是不是还在腹泻，或者用了会增加丢钾的药。前面补进来的少，后面还在往外丢，血钾就更容易降下来。这里面，腹泻主要是从肠道丢钾，不能都算到肾脏头上。\n所以，确实存在摄入不足，那重点要调什么呢？先把饭吃够、吃均衡，蔬菜、豆类、薯类合理搭配，这些食物都能提供钾。如果还有持续腹泻，也要一起处理。已经查出低血钾，要不要用补钾药，还得看具体情况，不能觉得多吃几根香蕉就一定够了。\n再说说肾脏漏钾。每天从尿里排出一些钾，这是正常的，谁都会排，关键是血钾已经低了，肾脏有没有相应少排一点。如果这时候尿里仍然丢掉过多的钾，就要考虑肾性失钾。医生会根据情况查24小时尿钾，或者尿钾和肌酐的比值，再结合用药等信息来判断。\n原因可以重点查三个方面。\n第一种，药物的影响。比如呋塞米、氢氯噻嗪这类排钾利尿剂，在帮助身体排盐、排水的同时，也可能增加钾的流失。这种情况重点是把正在吃的药核对清楚，让医生看看要不要调整用药、要不要补钾，之后还要复查血钾和肾功能，别自己直接把药停了。\n第二种，醛固酮的作用太强。这个激素会让肾脏多留钠、多排钾，作用过强，钾就容易从尿里丢出去。如果你既有高血压，又反复低血钾，就要让医生评估一下，有没有原发性醛固酮增多症，需要时检查醛固酮和肾素。有些患者需要用药阻断醛固酮的作用，减少肾脏丢钾，不能只补钾，不处理原因。\n第三种，肾小管的转运功能出了问题，肾脏没能把钾留好。这种情况就要找医生进一步评估，结合血压、血镁、酸碱状态等检查，看看具体是什么原因。尤其是补了钾，血钾还是反复低的，还要注意有没有同时缺镁。因为缺镁也会增加肾脏丢钾，镁没纠正，钾就可能一直不好补上来。\n最后给大家总结一下，吃得少，重点看饮食够不够、有没有同时增加丢失；肾脏漏钾，重点看尿钾，再查药物、激素和肾小管的问题。不要一看到血钾低，就只想着多吃点含钾食物。找对原因，补进去的钾才能更好地留住。\n", "source": "本地DOCX；已核对候选记录MD5", "error": "", "recomputedScore": 0.0947}], "unavailableCount": 0, "matchStatus": "needs_review", "unavailableReasons": []}}, {"key": "image-244944", "id": "244944", "doctor": "杨剑辉", "time": "2026-11-09 16:43:16", "kind": "图片清晰图超时", "reason": "清晰图4次尝试超时，当前只有缩略图。原生终态回调未采集，底层原因未知。", "next": "保留缩略图供查看；证据不可辨认时不据此自动推进。", "title": "[图片] local_id=311", "windows": ["244944"], "aspects": [{"kind": "图片清晰图超时", "reason": "清晰图4次尝试超时，当前只有缩略图。原生终态回调未采集，底层原因未知。", "next": "保留缩略图供查看；证据不可辨认时不据此自动推进。"}]}, {"key": "doc-244776", "id": "244776", "doctor": "邓金华", "time": "2026-11-09 16:21:25", "kind": "检查归类误报", "reason": "数字人录制指南是操作表格，不是交接稿件；不应作为“文案正文缺失”阻断作品。", "next": "修正非稿件附件的归类，保留原事件记录。", "title": "[文件] 数字人录制指南(2).xlsx (228.4 KB, xlsx)", "windows": ["244776"], "aspects": [{"kind": "检查归类误报", "reason": "数字人录制指南是操作表格，不是交接稿件；不应作为“文案正文缺失”阻断作品。", "next": "修正非稿件附件的归类，保留原事件记录。"}]}, {"key": "sync-240289", "id": "240289", "doctor": "郭兆安", "time": "2026-11-06 17:03:15", "kind": "飞书同步／进度差异", "reason": "飞书已发布，保留远端，不补发较早状态；历史队列／本地进度差异仍需记录。", "next": "保留飞书较新状态，核对作品版本与历史发送链；不回退远端。", "title": "白蛋白低，别只顾着补", "windows": ["240289"], "aspects": [{"kind": "飞书同步／进度差异", "reason": "飞书已发布，保留远端，不补发较早状态；历史队列／本地进度差异仍需记录。", "next": "保留飞书较新状态，核对作品版本与历史发送链；不回退远端。"}]}, {"key": "sync-243606", "id": "243606", "doctor": "郭兆安", "time": "2026-11-09 11:42:02", "kind": "飞书同步／进度差异", "reason": "飞书已发布，保留远端，不补发较早状态；历史队列／本地进度差异仍需记录。", "next": "保留飞书较新状态，核对作品版本与历史发送链；不回退远端。", "title": "白蛋白低，别只顾着补", "windows": ["243606", "240289", "191286", "206132"], "aspects": [{"kind": "飞书同步／进度差异", "reason": "飞书已发布，保留远端，不补发较早状态；历史队列／本地进度差异仍需记录。", "next": "保留飞书较新状态，核对作品版本与历史发送链；不回退远端。"}]}, {"key": "event-246153", "id": "246153", "doctor": "郭兆安", "time": "2026-11-10 07:35:23", "kind": "作品关联／证据", "reason": "等待视频下载及校验", "next": "根据稿件正文、真实引用及同一作品版本核对；不以最高分或相同标题强行推进。", "title": "尚未关联作品", "windows": ["246153"], "aspects": [{"kind": "作品关联／证据", "reason": "等待视频下载及校验", "next": "根据稿件正文、真实引用及同一作品版本核对；不以最高分或相同标题强行推进。"}, {"kind": "原件待下载／待核验", "reason": "未通过本地原件核验；台账状态：待下载。这不是已证实的底层下载失败。", "next": "核对该次下载尝试、原生结果和文件落盘；取得原件后再做稿件关联。"}], "comparison": {"capturedAt": "2026-11-10T12:00:03+08:00", "transcript": "护肾啊记住三个字。查出慢性肾脏病，怎样争取长期稳定？糖压测这三件事你别忽视。肾病患者啊长寿最大的王牌啊。 就藏在这三个字里边。同样查出慢性肾脏病，为什么有人短短两三年就会肾脏报废，只能躺在我们的透析室里，浑身插满管子，而有的人啊却能带病生存几十年，病情啊稳如泰山。差别啊往往。", "seconds": 40, "stop": "matched", "basis": "最新匹配缓存候选", "documents": [{"messageId": 240292, "title": "郭兆安kp21 KX 查出慢性肾病，怎样争取长期稳定？“糖、压、测”这3件事别忽视！", "recordedScore": 0.8851, "body": "封面：护肾记住三个字\n标题：查出慢性肾病，怎样争取长期稳定？“糖、压、测”这3件事别忽视！\n#抖出健康知识宝藏 #健康科普进行时 #肾性贫血早知道 #肾脏健康 #科学护肾\n肾病患者长寿最大的王牌就藏在这5个字里，同样查出慢性肾脏病，为什么有人短短两三年就会身脏报废，只能躺在我们透析室里，浑身插满管子，而有的人却能带病生存几十年，病情稳如泰山。\n差别往往不在肌酐高低，而在平时有没有管住3个字？\n第一个字，糖\n血糖长期偏高，会一点点膜坏肾里的滤过膜。糖尿病智力就是这么来的，他现在已经是尿毒症的头号原因。所以有糖尿病的肾友糖化血红蛋白尽量控制在7%左右，少吃粳米、白面和甜食，守护好肾脏的第一道闸。\n第二个字，压\n血压高，就像水管里压力太大，天天撑着这样求时间一长肾就扛不住。肾病的朋友，血压最好压到130/80mmHg以下。目前临床上，除了普列类，沙坦类降压药，医生也会考虑指南里新增的新一代降压药，也就是 ARNI 类降压药，像沙库巴曲阿利沙坦钙。研究证实它在强效降压的同时，还能降低尿酸、尿蛋白、改善肾脏纤维化，实现了从单纯降压到保护心肾的升级。\n第三个字就是测，就是定期复查，建议每3~6个月复查一次肾功能，重点盯住我们的肌酐、尿蛋白和肾样球滤过率。血红蛋白呢也要查的更勤一些。最好每个月测一次。有高血压、糖尿病的血压和血糖也得常量。指标不稳的时候就得查的再勤一点，早一步看出变化就能早一步干预。千万别等身体扛不住了才后悔。\n肾脏可能是咱们长寿的本钱，别等出了问题，你再去后悔，建议转发提醒家里人。\n", "source": "本地DOCX；已核对候选记录MD5", "error": "", "recomputedScore": 0.8851}, {"messageId": 178909, "title": "kp1 郭兆安 kx 肾脏早期损伤不容易被肌酐发现，关注这些肾脏信号", "recordedScore": 0.1362, "body": "封面：查出肾病，为什么肌酐没升？\n标题：肾脏早期损伤不容易被肌酐发现，关注这些肾脏信号\n#抖出健康知识宝藏#健康科普进行时#肾病#肌酐#体检\n很多肌酐正常的人都有过这种疑惑：“我报告上没箭头，数值也在正常范围，身体也没啥不舒服，那医生凭啥还说我的肾不一定完全没问题？”\n跟你说句实在的：肌酐正常，不等于肾脏一定就完全正常。因为肌酐主要查的是肾小球滤过能力，它看不出肾小球屏障有没有损伤，也没法反映肾小管功能，更代替不了对肾脏结构本身的判断。\n那为什么有时候肾脏已经出现变化了，肌酐还能保持正常呢？主要有几个原因。一个是肾脏本身挺能扛事，早期或者轻度滤过功能下降的时候，剩余正常的肾单位还能代班干活，所以肌酐可能变化不明显。再一个，肌酐和肾小球滤过率并不是画等号的，尤其是滤过功能还处在比较高水平的时候，即便降了一部分，肌酐也可能仍然待在正常范围里。\n还有一个容易被忽略的问题：肌酐不光看肾，还看你身上有多少肌肉。因为它主要来自肌肉代谢，如果一个人本身肌肉量就少——比如年纪大了、很瘦、长期卧床、肌肉萎缩或者营养不太好——哪怕肾小球滤过能力已经下降了，产生的肌酐少，测出来也可能还是“正常”的。所以判断肾功能，不能拿一个参考范围去套所有人。\n那肌酐正常，到底能不能放心？光看这一个数字不行，还得结合几样东西来看。主要看三件事：有没有持续的肾脏损伤证据，有没有近期的急性变化，以及整体检查是不是稳定正常。\n第一，看有没有持续的肾脏损伤证据。 肾脏出问题，不一定先表现在肌酐上。有些人肌酐一直正常，但尿里已经出信号了。比如尿白蛋白肌酐比值持续超过30mg/g，或者估算肾小球滤过率持续低于60、超过3个月，都提示可能存在慢性肾脏损伤。还有，如果长期存在肾小球源性的血尿、红细胞管型，或者影像检查发现肾脏结构异常，比如瘢痕、积水、囊性改变，也不能因为肌酐正常就觉得没事。\n第二，看有没有近期急性肾损伤的风险。 有时候肾脏突然受到打击，肌酐不会马上升高，它需要一点时间才能反映出来。比如48小时内肌酐比自己的基础水平升高0.3mg/dL以上，或者7天内升高到原来的1.5倍，即便数值还没超出正常范围，也可能已经符合急性肾损伤的标准了。\n特别是最近如果出现过严重呕吐腹泻、感染低血压、大手术，或者吃了可能影响肾功能的药，同时尿量变少了，这时候就别等肌酐出箭头再处理。如果出现明显的少尿、无尿、血尿，甚至开始呼吸困难、持续呕吐、或者精神状态变差，得赶紧去医院，这时候看的已经不是化验单上的数字了，是肾脏本身有没有在受损害。\n第三，看整体状态是不是长期稳定。 如果本身没有肾病高危因素，多次检查肌酐水平都稳定，估算肾小球滤过率正常，尿白蛋白和尿沉渣也都没问题，血压控制得好，影像检查没发现明显结构异常——那目前出现有临床意义肾病的可能性就比较低。\n我们做这么多检查，看这么多指标，说到底是想确定：哪怕肌酐正常，只要尿没事、滤过率稳定、结构没出问题，你心里就能踏实一点。该复查的定期复查，该调整的慢慢调整，剩下的交给时间。", "source": "本地DOCX；已核对候选记录MD5", "error": "", "recomputedScore": 0.1362}, {"messageId": 191288, "title": "郭兆安kp6 ZY 为什么控制血糖、血压和血脂，也是在保护肾脏？", "recordedScore": 0.1362, "body": "封面：护肾也要护血管\n标题：为什么控制血糖、血压和血脂，也是在保护肾脏？\n#抖出健康知识宝藏 #健康科普进行时 #肾脏健康 #三高管理 #科学用药\n有一种慢性病，一旦确诊之后，日常的管理节奏要一直保持稳定，几乎没有可以松懈休息的时候，这就是肾衰，需要血液透析的那一类。你肯定想问，怎样才能尽量避免走到这一步？绝大多数肾衰的根源，都是这些细小血管发生损伤，所以想要躲开肾衰、避免走到透析这一步，核心思路就是保护好肾脏里的微血管。\n血液进入肾脏后，会经过许多细小的血管团，也就是肾小球。它们与肾小管等结构共同组成肾单位，完成过滤和后续处理。部分水分、小分子物质通过过滤屏障，血细胞和大部分蛋白质则留在血液里。所以，血管和过滤屏障受损，肾脏处理血液的能力也可能受到影响。\n先看血糖。持续的高血糖会损伤微小血管，肾脏也在其中。糖尿病患者不能只关心某一次血糖有没有降下来，还要留意肾脏是否已经受到影响。因此，尿蛋白需要定期检查，发现异常后及时评估，而不是等到身体难受再处理。\n再说血压。高血压同样会伤害肾脏，原理就是长期偏高的血压持续冲击血管壁，慢慢损伤肾脏的动脉。所以，有高血压的人即使没有头晕，也不能把治疗放在一边。血压控制得是否稳定，会影响肾脏今后的状况。\n除了血糖和血压，血脂也不能漏掉。肾病患者需要评估整体心血管风险，再确定低密度脂蛋白胆固醇的目标。已经患上肾病的人群，对这项指标的控制标准会更加严格，一般需要降到2.6或1.8毫摩尔每升，具体情况要看医生这么说。\n除了三高这些常见危险因素，肾单位里面的血管本身管径很小，一旦出现炎症水肿，血管腔就会被挤压，血流流通受阻。有一部分人的肾衰，就来自自身免疫相关的炎症疾病，比如狼疮肾炎、过敏性紫癜肾炎。这类人群，需要做好免疫状态的调节，尽量减轻精神压力，不要长期熬夜。\n所以，护肾要先弄清自己的风险来自哪里。有糖尿病就持续管理血糖，有高血压就认真控制血压，血脂和免疫相关疾病也分别处理。平时要按医嘱规范用药，适量饮水、保持适合自己的运动、少熬夜，坚持适度活动，维持平稳轻松的心态，把这些细节长期坚持下来，再通过规律复查，观察治疗有没有达到目标，才能尽可能降低肾脏持续受损的风险。\n", "source": "本地DOCX；已核对候选记录MD5", "error": "", "recomputedScore": 0.1362}, {"messageId": 206129, "title": "郭兆安kp9 ZY 年轻人不想走到尿毒症，这几件事要弄明白", "recordedScore": 0.129, "body": "封面：护肾别漏检查\n标题：年轻人不想走到尿毒症，这几件事要弄明白\n#抖出健康知识宝藏 #健康科普进行时 #肾脏健康 #尿毒症预防 #科学体检\n年轻人想预防尿毒症，是不是少熬夜、不憋尿、少喝饮料就够了？这些习惯当然要注意，但还有一件事不能漏：先弄清楚，自己的肾脏有没有已经出现的问题。\n因为有些人不是肾脏突然坏了，而是之前就有肾病，只不过一直没发现。肾病早期可能既不疼，也不肿，吃饭、上班都和平时一样，你自然不会觉得自己需要看病。等到明显浮肿、乏力、吃不下饭，再去检查，肾功能可能已经下降了不少。\n这种“有病却不知道”的情况并不少见。一项覆盖大约17万成年人的全国调查发现，慢性肾脏病患病率为8.2%，估算约有8200万人患病，其中大约九成并不知道自己患病。这是全体成年人的数据，不是年轻人的专属数据，但也说明，单凭身体有没有不舒服，很容易漏掉问题。\n所以，第一步不是自己猜，而是在体检时把尿常规、血压和肾功能查一查。尿常规看的是尿里有没有蛋白、红细胞；肾功能除了肌酐，还要结合估算的肾小球滤过率，看看肾脏过滤血液的能力怎么样。血压也要量，因为血压高会伤肾，肾脏受损又可能让血压升高，这几项结合起来，才能看得更全面。\n那查出尿蛋白或者潜血阳性，是不是就得了肾炎？也不能这么判断。一次异常还不足以下结论，需要按医生的建议复查。但如果反复出现蛋白尿、血尿，就不能因为没有症状，把报告收起来不管了。接下来要找的是原因，因为不同肾病的处理办法不一样。早点明确诊断，接受规范治疗，把蛋白尿和血压控制好，很多人的肾功能可以保持稳定很多年。\n有时这些线索不在体检单上，而是在一次感冒之后。你比如说，感冒、嗓子疼前后，尿液突然变红，或者颜色像浓茶，这就值得及时检查。有些IgA肾病患者会有这样的表现，但尿变色也可能有其他原因，不能只靠颜色判断。去查尿常规和肾功能，比在家猜是不是“上火”更有用；即使后来尿色恢复了，也要把这次变化告诉医生。\n如果检查确认肾脏有问题，很多人接着就会想：那我吃点什么补一补？先别急着买补药。所谓偏方、秘方、排毒茶，如果成分都说不清楚，并不能因为它叫“补肾”，就认定它对肾脏安全。把这些产品以及平时吃的药告诉医生，才能判断有没有不适合你的东西。\n常用的止痛药同样不能随意吃。布洛芬、双氯芬酸、洛索洛芬这类非甾体抗炎药，并不是一片都不能用，而是不要自行长期、反复服用。尤其已经有肾病，或者腹泻、呕吐、发烧后出现脱水，用药前更需要问医生或药师。\n至于日常怎么保护肾脏，重点还是把已经存在的危险因素管好。血压、血糖偏高，就按医生安排控制；体重超标，就逐步调整饮食和运动。少盐、戒烟、规律活动，也别因为暂时没感觉，就把医生开的药停了。\n这样看下来，预防尿毒症不只是“少做几件伤身的事”，还包括及时发现和处理已经存在的疾病。年轻、没症状，都不能代替检查；查出异常，也不等于一定会走到透析。先查清楚是什么问题，再决定怎么处理，比一直担心或者干脆不管，都更能帮到自己。\n", "source": "本地DOCX；已核对候选记录MD5", "error": "", "recomputedScore": 0.129}, {"messageId": 206132, "title": "郭兆安kp12 CX 每12个成年人里，可能就有1个肾已经出问题了，大多数人自己还不知道。", "recordedScore": 0.1277, "body": "封面：透析的人为啥越来越多\n标题：每12个成年人里，可能就有1个肾已经出问题了，大多数人自己还不知道。\n#抖出健康知识宝藏 #健康科普进行时 #肾性贫血早知道 #慢性肾脏病 #远离透析\n你有没有发现，这几年身边做透析的人好像越来越多了？很多人一想到这个，第一反应就是现在的人吃得太咸，或者乱吃药、乱吃保健品，把肾吃坏了。这些因素确实有影响，但真正让这么多人走到透析这一步的，大概率不是它们。\n我先说一个你可能想不到的原因，透析的人变多，其实有一部分是好事。因为早些年很多人肾衰竭了，透析做不起，附近也没地方做，人就这么没了。现在医保能报销，县里也有了透析室，能做上透析、活得更久的人多了，你身边看到的透析病人自然也就多了。\n但这只能解释一部分，另一部分是真的有越来越多的人肾坏了。大规模调查显示，咱们国家成年人里大约每12个人就有1个有慢性肾病，而且绝大多数人自己根本不知道。\n那为什么会不知道呢？因为肾特别能扛。你可以把肾想象成一张由无数个小血管团织成的滤网，其中坏掉一部分，剩下的会把工作顶上，所以人不痛也不痒。等到你开始觉得浮肿、没力气，或者发现尿里泡沫多了，这张网往往已经坏了一大半。\n那到底是什么在一点点把这张网毁掉的呢？以前最常见的是肾炎，也就是肾自己发炎。但这些年，糖尿病和高血压引起的肾病越来越多，已经追上甚至超过了肾炎。血糖高的时候，血就好像加了糖浆，黏糊糊地流过肾里那些很细的血管，时间一长，血管就被泡坏了。高血压的损伤更隐蔽一些，因为肾里的小血管特别细，血压一直高，就相当于天天拿高压水枪冲一张纱网，冲上几年，网眼被撑大了，蛋白就从尿里漏出来了。而且这还是一个恶性循环，肾坏了以后血压会更高，肾又坏得更快。\n听到这儿，你可能会想，那我把血压降下来不就行了吗？方向是对的，但降压的时候有两个容易踩的坑。\n第一个坑是只想着把数字降下来，却不管用什么药降。降压药分好几大类，它们对肾的作用并不一样。其中普利类和沙坦类的药，除了降血压，还能把肾里面过高的压力降下来，减少蛋白漏到尿里，所以对肾有风险的人，医生常常会优先考虑这两类。不过普利类有些人吃了会干咳，所以现在沙坦类用得更多一些。\n第二个坑是一种药血压降不到130/80以下，还硬撑着不调整。很多人吃了一种降压药，血压还在一百五六，就觉得差不多了。但其实在这个血压水平下，肾一直都在挨冲。如果一种药控制不好，指南是建议把两种作用机制不同的药联合起来用的。你比如说阿利沙坦酯氨氯地平这种新型复方制剂，就是把一个沙坦类和一个地平类放进了同一片药里。研究显示，血压能降18个mmHg，还对心肾有更多保护。这里面的阿利沙坦酯还有独特的降尿酸作用，对肾脏更友好。\n但是有几点要注意。刚开始吃沙坦类药的时候，医生一般会让你复查血钾和肌酐，而且备孕和怀孕的人不能用这类药。至于要不要用药、具体用哪一种，一定要让医生看过你的肾功能再决定，不要看完视频就自己换药。还有一些人听说降压药伤肾，就不敢吃。其实对绝大多数人来说，真正伤肾的是血压一直高着没人管，而不是降压药本身。\n所以，想离透析远一点，你记住三件事就行：每年查一次尿常规和肌酐，把血压和血糖控制达标，不要乱吃来路不明的药。肾确实很能扛，但如果你一直不管它，它也扛不住。\n", "source": "本地DOCX；已核对候选记录MD5", "error": "", "recomputedScore": 0.1277}], "unavailableCount": 0, "matchStatus": "matched", "unavailableReasons": []}}, {"key": "video-246154", "id": "246154", "doctor": "郭兆安", "time": "2026-11-10 07:45:03", "kind": "原件待下载／待核验", "reason": "未通过本地原件核验；台账状态：待下载。这不是已证实的底层下载失败。", "next": "核对该次下载尝试、原生结果和文件落盘；取得原件后再做稿件关联。", "title": "[视频]", "windows": ["246154"], "aspects": [{"kind": "原件待下载／待核验", "reason": "未通过本地原件核验；台账状态：待下载。这不是已证实的底层下载失败。", "next": "核对该次下载尝试、原生结果和文件落盘；取得原件后再做稿件关联。"}]}, {"key": "image-246159", "id": "246159", "doctor": "郭兆安", "time": "2026-11-10 09:42:25", "kind": "图片待完整核验", "reason": "尚无原图或清晰图完整文件证据；已有缩略图／上传回执不能替代原件核验。", "next": "保留缩略图供查看；证据不可辨认时不据此自动推进。", "title": "[图片] local_id=854", "windows": ["246159"], "aspects": [{"kind": "图片待完整核验", "reason": "尚无原图或清晰图完整文件证据；已有缩略图／上传回执不能替代原件核验。", "next": "保留缩略图供查看；证据不可辨认时不据此自动推进。"}]}, {"key": "image-246160", "id": "246160", "doctor": "郭兆安", "time": "2026-11-10 09:42:26", "kind": "图片待完整核验", "reason": "尚无原图或清晰图完整文件证据；已有缩略图／上传回执不能替代原件核验。", "next": "保留缩略图供查看；证据不可辨认时不据此自动推进。", "title": "[图片] local_id=855", "windows": ["246160"], "aspects": [{"kind": "图片待完整核验", "reason": "尚无原图或清晰图完整文件证据；已有缩略图／上传回执不能替代原件核验。", "next": "保留缩略图供查看；证据不可辨认时不据此自动推进。"}]}, {"key": "event-246161", "id": " n反复提醒低压高，不是想让大家多吃药，而是不想你因为“没感觉”把问题拖过去。记好血压和心率，管住盐、腰围和睡眠，药物和医生一起调整。慢一点没关系，方向对就行。\n \n", "source": "本地DOCX；已核对候选记录MD5", "error": "", "recomputedScore": 0.6043}, {"messageId": 205126, "title": "KP10 李洁 Z 高压高、低压高，哪一个对肾脏伤害大？", "recordedScore": 0.21, "body": "封面：高压高、低压高，哪一个对肾脏伤害大？\n标题：血压的高压高和低压高，到底有啥区别？\n#抖出健康知识宝藏 #健康科普进行时#高血压#低压高#降血压\n\n同样都是高血压，为什么有的人是高压高，有的人是低压高？哪一个对肾脏的伤害大？\n先说一个结论：它们都会伤肾，高压高带来的伤害更直接，低压高带来的伤害更容易忽视。\n高压是心脏用力把血往外泵的那一下，血管承受的最大压力。心脏每收缩一次，血就猛冲一下大动脉。年纪大的人，大血管变硬了、弹性差了，就更容易出现只有高压高。肾脏里血管特别多，高压长期偏高，就等于天天拿水枪冲肾脏的滤网，时间长了，肾脏就慢慢硬化了。\n而低压呢，是心脏放松、不往外泵血的时候，血管里还维持着的压力。这时候血还能往前走，靠的是大动脉自己弹回来。如果全身的小血管一直紧绷着、收缩着，血往前流的阻力就大，低压也就容易升上去。很多年轻人比较常见的就是低压高，觉得高压正常就没事，但其实低压长期高，一样会天天磨肾脏的小血管，让肾功能下降。所以不管是哪一种情况，高压、低压都要达标，才能保护肾脏。\n那具体怎么管？先说高压高的人。重点是两件事：让血管别硬得太快，别让血压大起大落。\n首先是控制好血脂，重点看低密度脂蛋白，这个指标高了，会沉积在血管内壁，加速斑块长出来，血管里面就越来越窄了。\n其次是控制盐，盐多了，血容量就大，血管负担就重。一般建议控制在5克以内，也就是一瓶盖的量。\n然后是戒烟限酒，这两样都会破坏血管内壁，让硬化来得更快。\n最后是运动，最好选择平稳、能长期坚持的有氧运动，循序渐进，保住大动脉的弹性。\n量血压重点盯住早晚两个高峰，尤其小心早上的六点到十点，这是脑梗的高发期，如果猛一下起床，会让血压飙升，增加脑梗风险。\n再说低压高的人。这类人往往压力大、爱熬夜、久坐不动，交感神经长期兴奋，小血管就一直缩着，低压就降不下来。所以降压的关键，是把让血管紧张的原因去掉。\n第一，把觉睡好，每天睡眠控制在7小时以上。老熬夜、睡不够，血管就一直被刺激着收缩，像琴弦一直绷着；白天再一焦虑、一紧张，血管更难放松。\n第二，少坐。每隔一小时起来动几分钟，帮外周的小血管舒展开。\n第三，体重超标，尤其是肚子大的，要认真减重，因为肚子大的人内脏脂肪多，这些脂肪会分泌炎症因子和游离脂肪酸，会让血管收缩，还常常伴有胰岛素抵抗。\n另外少喝浓茶、咖啡，也能减少对交感神经的刺激。\n最后，不管你是高压高还是低压高，如果医生建议吃药，该吃还得吃。每个人肾脏情况不一样，用什么药、血压降到多少，都要医生来定。吃药后在家量血压，高压低压两个数都记下来，复诊时给医生看，医生才知道药效怎么样，有没有必要调药。\n高血压对肾脏的伤害，是一个缓慢、持续的过程，而且几乎没有症状。别等到肾衰竭、尿毒症再管，现在就开始做起来，盐少一点，烟能戒就戒，酒能少就少，觉尽量睡够，肾脏才能少受一点受伤。\n\n", "source": "本地DOCX；已核对候选记录MD5", "error": "", "recomputedScore": 0.1095}, {"messageId": 223160, "title": "KP10 李洁 Z 高压高、低压高，哪一个对肾脏伤害大？", "recordedScore": 0.16, "body": "封面：高压高、低压高，哪一个对肾脏伤害大？\n标题：血压的高压高和低压高，到底有啥区别？\n#抖出健康知识宝藏 #健康科普进行时#高血压#低压高#降血压\n\n\n高压高、低压高，哪一个对肾脏伤害更大？高压高带来的伤害更直接，低压高带来的伤害更容易忽视。\n高压是心脏收缩、把血液泵出去，血管承受的最大压力。随着年龄增长，大动脉逐渐变硬、弹性下降，心脏每泵一次血，压力就更容易升高，所以高压高在中老年人中更常见。高压高相当于拿水枪冲肾脏的滤网，时间长了，肾脏就慢慢硬化了。\n低压是心脏舒张，血管里维持的压力。年轻人如果肥胖、长期熬夜、精神紧张或者久坐不动，交感神经持续兴奋，小血管一直收缩，血液往前流动的阻力增加，低压就容易高。\n很多人觉得低压高没事，但其实也会磨肾脏血管，让肾功能下降。\n而且低压高久了，慢慢也可能发展成高压、低压都高。那应该怎么预防？\n记住三点。\n第一，把血压量准。连续5到7天早晚测量，每次测两遍，高压和低压都记录，不要根据偶尔一次的数字下结论。\n第二，把盐控制在每天5克以内，控制体重，少熬夜、少久坐，坚持适量有氧运动，戒烟并限制饮酒，减少血管持续收缩和硬化。\n第三，医生开的降压药规律服用，不要因为没有症状就停药。高血压患者还要定期检查尿常规、尿白蛋白肌酐比、血肌酐和肾小球滤过率。发现尿蛋白增加或肾功能下降，要尽快复诊。\n高血压对肾脏的伤害，是一个缓慢、持续的过程，别等到肾衰竭、尿毒症再管，现在就开始做起来，肾脏就能少受一点受伤。\n\n", "source": "本地DOCX；已核对候选记录MD5", "error": "", "recomputedScore": 0.1112}, {"messageId": 205129, "title": "KP13 李洁 Z 有人说高尿酸不算病，不用管，是这样吗？", "recordedScore": 0.15, "body": "封面：有人说高尿酸不算病，不用管，是这样吗？\n标题：高尿酸不疼不痒就不用管？别等肾脏受伤才明白，这个谣言害了不少人\n#抖出健康知识宝藏 #健康科普进行时#高尿酸#痛风#肾脏\n\n高尿酸不算病，不疼不痒不用管，吃药还伤肾，这个谣言，最近有多少人信了？\n网上还有人这样解释：尿酸高就是化验单上一个数字不好看。只要关节不红、不肿、不疼，就说明身体还能处理，多余的尿酸慢慢就排出去了。所以无症状高尿酸千万别吃药，你以为把尿酸降下来了，其实药物反而加重了肾脏负担，最后尿酸没伤肾，吃药倒把肾伤了。\n这个说法为什么容易让人相信？因为它正好说中了大家的心理：既然没症状，谁愿意吃药呢？\n我们先承认，人体确实有调节能力。有些指标只是轻微波动，调整一下饮食、作息，就能恢复正常。但身体的调节能力也是有限的，不是所有异常，都能等着它自己好。\n所以问题就出在这里，没有症状，不代表身体能把多余的尿酸处理好。尿酸一直高，说明生成的和排出去的已经不平衡了。这时候只等着它自己降下来，问题可能还会继续发展。\n那有人会问：“我又没得痛风，尿酸高一点，能有什么影响？”\n尿酸主要靠肾脏排出去。血里的尿酸升高，要么是身体生成得太多，要么是排出去的太少。\n肾脏一直在帮我们排尿酸，但它也有承受不住的时候。尿酸浓度太高，可能形成一些细小的尿酸盐结晶，沉积在肾脏里。这些结晶持续刺激肾脏组织，就可能慢慢造成损伤。还容易形成尿酸结石。结石如果堵住尿路，尿排不出去，也会伤害肾脏。\n但一直发展下去，就像路面出现了细小的裂缝，这个裂缝越来越大，虽然现在路还没塌，但已经很危险了。\n所以，不能只靠疼不疼，判断要不要管。如果只是轻微超过420，没有痛风、痛风石，可以先调整饮食、作息，定期复查，看看能不能降下来。如果血尿酸持续明显升高，经过一段时间的调整，复查仍然降不下来，或者尿酸在480以上，已经发作过痛风，就要到肾内科或者内分泌科，让医生判断有没有必要启动降尿酸治疗。帮忙减少尿酸生成，或者促进尿酸排出。\n那大家担心的“吃药伤肾”呢？降尿酸药确实可能有副作用，但不能简单理解成：药经过肾脏，就一定会把肾脏伤了。概率大不大，危不危险？还要看是哪种药物，用药前医生评估，用药后及时观察、复查，一般不会有严重的不良反应。但如果尿酸长期高，那肾脏受伤的可能性就大了。\n所以高尿酸，不能只盯着关节疼不疼，也要关注尿酸有没有持续超标、肾脏有没有出现问题。不要等到肾结石、肾功能减退找上门，才想起来处理。\n最后再讲几点预防：\n第一，别把忌口等于不吃肉。重点是少吃高嘌呤的食物。动物内脏、老火浓汤、贝类海鲜尽量避开；日常可以多吃鸡蛋、鸡胸肉、猪瘦肉等等，都是很合适的蛋白质来源。\n第二，喝水不是渴了再喝，少量多次才有用。心肾功能正常的人，每天保证1.5L左右的饮水量，可以多排尿，带走更多尿酸。避开果糖饮料，奶茶、果汁、蜂蜜水里的果糖，会在体内直接促进尿酸生成。酒精全部尽量避免，不只是啤酒，白酒、红酒也一样。\n第三，不要迷信偏方、保健品。市面上很多号称可以溶结晶、快速降尿酸的产品，大多没有明确的依据。部分产品成分不明，还可能加重肾脏负担。\n高尿酸的管理核心，从来不是等疼痛出现了再去救火，而是提前监测、及时干预。定期查尿酸，把生活方式也兼顾上，该吃药的时候别拖，你的肾脏、血管，将来就会感谢你。\n", "source": "本地DOCX；已核对候选记录MD5", "error": "", "recomputedScore": 0.0977}], "unavailableCount": 0, "matchStatus": "matched", "unavailableReasons": []}}, {"key": "e
