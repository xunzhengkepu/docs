699", "time": "2026-10-30 16:25:34", "sender": "WNJ", "type": "视频", "text": "[视频]"}, "223702": {"id": "223702", "time": "2026-10-30 16:26:35", "sender": "WNJ", "type": "图片", "text": "[图片] local_id=383"}, "223703": {"id": "223703", "time": "2026-10-30 16:26:54", "sender": "WNJ", "type": "文本", "text": "@李洁 KP11 尿液出现三种表现，可能是糖尿病正在加重。视频剪辑好啦，辛苦老师看看~[玫瑰][玫瑰]"}, "206411": {"id": "206411", "time": "2026-10-23 11:12:02", "sender": "云飞扬", "type": "文本", "text": "都可以"}, "206426": {"id": "206426", "time": "2026-10-23 11:15:26", "sender": "祁冀.", "type": "文本", "text": "@云飞扬 老师，这是咱们的六篇新文案，辛苦老师看一下有没有问题，有问题您随时和我说，我尽快调整，没有问题就辛苦您录制啦~~[玫瑰][玫瑰]"}, "206427": {"id": "206427", "time": "2026-10-23 11:15:26", "sender": "祁冀.", "type": "链接/文件", "text": "[文件] 云鹏kp5 ZY 血压高是为了保证供血，所以不能降？把这件事讲清楚.docx (12.7 KB, docx)"}, "206428": {"id": "206428", "time": "2026-10-23 11:15:27", "sender": "祁冀.", "type": "链接/文件", "text": "[文件] 云鹏kp6 ZY 血压、血脂、血糖都高，究竟哪个更危险？.docx (12.9 KB, docx)"}, "206429": {"id": "206429", "time": "2026-10-23 11:15:27", "sender": "祁冀.", "type": "链接/文件", "text": "[文件] 云鹏kp7 ZY 血压一会儿130、一会儿110，到底该信哪次？.docx (12.7 KB, docx)"}, "206430": {"id": "206430", "time": "2026-10-23 11:15:28", "sender": "祁冀.", "type": "链接/文件", "text": "[文件] 云鹏kp8 ZY 高血压患者过冬，晨练、保暖和感冒该怎么应对？.docx (12.6 KB, docx)"}, "206431": {"id": "206431", "time": "2026-10-23 11:15:29", "sender": "祁冀.", "type": "链接/文件", "text": "[文件] 云鹏kp9 ZY 怕降压药一吃就停不掉，所以一直不吃？.docx (12 KB, docx)"}, "206432": {"id": "206432", "time": "2026-10-23 11:15:30", "sender": "祁冀.", "type": "链接/文件", "text": "[文件] 云鹏kp10 CX 最烧钱的是什么病？.docx (12.8 KB, docx)"}, "225543": {"id": "225543", "time": "2026-11-01 17:22:07", "sender": "云飞扬", "type": "文本", "text": "血压、血脂、血糖都高，先管哪一个？\n第一段（0:00–1:00）\n大家好，我是云鹏医生。\n门诊上经常有人问我：“血压、血脂、血糖都高，到底哪个最危险？我能不能先把最危险的那个管好，另外两个先放一放？”\n这个想法特别自然。但今天我想跟您说一句可能有点意外的话：三高之间，很难排出一个对所有人都适用的“危险顺序”。 更关键的是，分开管和一起管，结果完全不一样。\n有一项香港的研究，追踪了一批“三高”的患者。血糖、血压、血脂三项都达标的人，和三项都不达标的人相比，心血管事件风险降低了55%。这不是某一个指标在起作用，是一起达标带来的结果。\n第二段（1:00–2:00）\n为什么不能只挑一个管？\n因为这三件事，伤的是同一套系统——血管。\n血压高，是血管壁长期承受过高的压力，心脏要更使劲泵血，血管更容易受损。血糖高，伤的是全身的小血管和神经，早期不疼不痒，等有感觉的时候，眼底、肾脏可能已经出了问题。血脂高，尤其是坏胆固醇长期偏高，会促进斑块形成。斑块破裂形成血栓，心梗、脑梗可能就在几分钟之内。\n它们不是三个独立的问题，是三个方向同时推高同一个风险。只关掉其中一个开关，另外两个还在往同一个方向使劲。\n第三段（2:00–3:00）\n那医生该怎么处理？不是“只挑最危险的那一个”，而是看谁最失控、谁最紧迫，先处理，但另外两个也不能丢。\n比如您血糖最近控制得不错，但血压一直高，低密度脂蛋白胆固醇也没降下来。血糖这一项指标的改善值得高兴，但不能因为一个数字变好了，就认为另外两个也跟着安全了。“先处理”不等于“另外两个可以一直不管”。\n日常能做的，其实很多是“一箭三雕”的。少放点盐、少喝含糖饮料、控制食量、规律运动、把体重降一点——这些调整，对这三个指标的改善都有帮助。\n第四段（3:00–4:00）\n所以，三高不是一场“谁更危险”的比赛。您真正该问医生的，不是“先管哪一个”，而是：我的“三高”分别该控制到什么水平？现在还有哪一项没达标？\n需要优先处理的先处理，但其他存在的问题也要一起管理。降好了一个，缺漏掉另外两个，等于白忙一场。\n我是云鹏医生，下期见。"}, "225544": {"id": "225544", "time": "2026-11-01 17:22:07", "sender": "云飞扬", "type": "文本", "text": "血压一会儿130，一会儿110，到底该信哪个？答案可能不是“多量几次”\n第一段（0:00–1:00）\n大家好，我是云鹏医生。\n您量血压的时候，是不是也遇到过：刚量完130，再测一次，变成110了。到底该信哪个？\n很多人的第一反应是：“那我多量几遍，总能找到准的那个。”但如果您一边量一边说话，坐姿在变、手臂位置在变，量得再多，也没法比较。\n血压本来就不是一个固定不动的数字。我们要做的，不是找一个“永远不变的值”，而是尽量在相同的条件下测，看一段时间的整体情况。\n第二段（1:00–2:00）\n先说设备。家用优先选经过准确性验证的上臂式电子血压计，袖带大小要合适。腕式电子血压计更容易受位置影响，普通手表的读数不能代替规范测量。\n设备对了，也别刚坐下就去测血压。测量前30分钟，避免运动、吸烟、饮酒、咖啡和浓茶，先去排尿，然后安静坐至少5分钟。\n坐姿也有讲究：后背有支撑，双脚平放不跷腿，胳膊放在桌面上，袖带中间大致和心脏同高。手臂垂得太低，读数可能偏高；抬得太高，又可能偏低。\n第三段（2:00–3:00）\n绑袖带时，上臂露出来，不隔衣服，袖带下缘离肘窝约两横指。测的时候不说话，不盯着数字看，正常呼吸。\n第一遍结束后，保持姿势，等至少1分钟再测第二遍，取两次的平均值。如果差别明显，再间隔加测一次。所有结果都留着，不要只记最低的那次。\n初次评估时两边手都测一下；如果确认一侧持续较高，以后固定测这一侧，别今天左手明天右手。\n第四段（3:00–4:00）\n那什么时候该去医院？\n如果刚发现血压偏高，或者正在调药，可以连续测5-7天，早晚各一个时段，每个时段测两遍。家庭规范测量的平均血压，高压达到135，或者低压达到85，就建议带着记录去就诊。\n但有一种情况不能等平均值：如果高压达到或超过180，或者低压达到或超过120，安静复测一次仍然这么高，就要立即联系医生、及时就医。如果还伴有胸痛、呼吸困难、突然麻木无力或说话不清，直接打急救电话。\n130和110该信哪个？先看两次是不是用同样的方法测的。把条件固定下来，比不停地按开始键，更能弄清您的血压到底怎么样。 我是云鹏医生，下期见。"}, "225545": {"id": "225545", "time": "2026-11-01 17:22:07", "sender": "云飞扬", "type": "文本", "text": "怕降压药“一吃就停不掉”，所以一直不吃？\n第一段（0:00–1:00）\n大家好，我是云鹏医生。\n门诊上经常遇到这样的朋友：降压药已经开回家了，放在抽屉里，一直没开始吃。问他为什么，他说：“我怕吃上以后，就得吃一辈子。”\n我特别理解这种担心。但今天我想跟您说一句可能有点扎心的话：您怕的是“被药绑住”，但真正一直在那里损伤您身体的，是高血压本身。\n第二段（1:00–2:00）\n先把一件事说清楚：降压药没有成瘾性。2024年《中国高血压防治指南》明确指出，临床常用降压药不存在成瘾机制，停药后没有心理渴求、烦躁心慌这类戒断反应。\n那为什么吃药以后血压正常了，一停又高？不是因为身体“离不开药”，是因为高血压这个病一直还在。血压降下来，说明药在起作用；停药后血压回升，说明原来的问题没有被“治愈”，只是被控制住了。\n这就像戴眼镜。戴上看得清，摘下来又模糊——不是眼睛被眼镜“绑住”了，是近视本身还在。\n第三段（2:00–3:00）\n当然，也不是说开始吃药，以后就永远一个剂量、一成不变。\n后面怎么调整，要看血压记录和身体情况，由医生判断。有人需要调整药量，有人需要换方案。但能不能调、什么时候调，不能靠某一天的读数自己决定，更不能突然停掉。尤其是某些类型的降压药，骤然停用可能引起血压反跳，风险更大。\n开始吃药和以后能不能停药，是两件事。不能因为担心第二件，就一直不处理第一件。\n第四段（3:00–4:00）\n还有一点很重要：别等出事了才开始。\n长期高血压增加心、脑、肾受损的风险，这个过程不一定让您有明显感觉。“头不晕”不等于“没问题”，难不难受和血压控制得好不好，不能画等号。\n如果您也是药拿回家却一直没吃，不妨把“我怕以后停不掉”这句话直接说给医生听。先弄清楚现在为什么需要用药、怎么吃、什么时候复查。至于后面是否需要长期服药，让身体情况和血压变化来回答。\n我是云鹏医生，下期见。"}, "225546": {"id": "225546", "time": "2026-11-01 17:22:07", "sender": "云飞扬", "type": "文本", "text": "最“烧钱”的病，可能不是癌症，而是你每天忽略的那两个数字\n第一段（0:00–1:00）\n大家好，我是云鹏医生。\n要说最“烧钱”的病，很多人第一反应是癌症。但真走到透析那一步，开销和对生活的影响，可能比很多人想象的要大得多。\n2025年，全国血液透析的在透患者已经突破113.7万人，一年新增22.2万。而且，新增透析患者的首位病因，已经不是很多人以为的慢性肾炎，而是糖尿病肾病，高血压肾损害紧随其后。\n也就是说，很多人正在做的事——血糖、血压高一点无所谓，不疼不痒就没事——恰恰在把肾脏往透析的方向推。\n第二段（1:00–2:00）\n为什么高血糖、高血压会伤肾？\n肾脏里密密麻麻全是微小的血管和滤过单位。血糖长期偏高，会一点一点损伤这些微血管，破坏滤过屏障，早期可能只是尿里出现微量蛋白，人没有任何感觉。血压长期偏高，相当于这些脆弱的毛细血管每天承受超标的压力，时间久了血管变硬、功能下降。\n两者的共同点是：早期不疼不痒，等有身体有不适的感觉时，损伤往往已经不是早期了。这就是为什么不能靠“难不难受”来判断肾脏好不好。\n第三段（2:00–3:00）\n那我们能做什么？最核心的两件事就是：把血糖管住，把血压管住。\n有糖尿病的，把糖化血红蛋白和空腹血糖控制在医生给的目标范围内；有高血压的，把血压稳定在目标值以下。从源头上给“高糖”和“高压”踩住刹车，才是真正给肾脏减负。\n另外，别乱吃药。尤其是长期自行服用止痛消炎药，以及来路不明的偏方、保健品，有些成分有肾脏毒性，滥用可能直接造成药物性肾损伤。\n第四段（3:00–4:00）\n肾脏是一个特别“能忍”的器官。它不会因为您今天多吃了一口甜的、少测了一次血压，就立刻报警。但它一直在记账。\n如果您有糖尿病或高血压，别只盯着血糖仪和血压计上的数字，需要定期查一次尿白蛋白和肾功能，看看肾脏有没有已经在悄悄受影响。早期发现，才有机会把疾病的进度条往回拉。\n离透析远不远，不取决于您现在有没有感觉，取决于您有没有把血糖、血压这两个数值控制好。我是云鹏医生，下期见。"}, "225547": {"id": "225547", "time": "2026-11-01 17:24:02", "sender": "云飞扬", "type": "文本", "text": "最后一个视频是分成两段录的，因为中间讲到一半讲不下去了，所以中间可能有个二三十秒的时间，内容是重复的，方便你们从合适的地方剪切"}, "226179": {"id": "226179", "time": "2026-11-02 09:40:59", "sender": "剪辑 范义雅", "type": "链接/文件", "text": "[引用] 收到老师\n  ↳ 云飞扬: 最后一个视频是分成两段录的，因为中间讲到一半讲不下去了，所以中间可能有个二三十秒的时间，内容是重复的，方便你们从合适的地方剪切"}, "226292": {"id": "226292", "time": "2026-11-02 10:05:56", "sender": "祁冀.", "type": "链接/文件", "text": "[引用] 老师，关注到您这篇删减了很多内容，请问是有什么问题吗？\n  ↳ 祁冀.: [文件] 云鹏kp10 CX 最烧钱的是什么病？.docx (12.8 KB, docx)"}, "225539": {"id": "225539", "time": "2026-11-01 17:20:11", "sender": "云飞扬", "type": "视频", "text": "[视频]"}, "225540": {"id": "225540", "time": "2026-11-01 17:20:31", "sender": "云飞扬", "type": "视频", "text": "[视频]"}, "225541": {"id": "225541", "time": "2026-11-01 17:22:07", "sender": "云飞扬", "type": "文本", "text": "血压高是身体在“自救”，所以不能降？\n第一段（0:00–1:00）\n大家好，我是云鹏医生。\n门诊上经常有患者跟我说：“血压高，是身体为了保证脏器供血才升上去的。我要是把血压降下来，大脑、心脏不就缺血了吗？”\n这话听起来有一定的道理。血液要流到全身，确实需要压力。但这里面有一个关键的区别：血液流动需要压力，不等于压力越高，供血就越好。\n您可以把血管想象成水管。水管被捏紧了，水要挤过去，管壁承受的压力确实会升高。但这时候流到末端的水，是更多了还是更少了？压力高，很多时候恰恰说明血管阻力大、血流不顺畅，而不是供血更充足。\n所以，不能从“血压高”直接倒推出“身体在自救、不能降”。\n第二段（1:00–2:00）\n那为什么血压会高？原因很多。心脏泵血的力量、血管的弹性、体内的水分和盐分、神经和激素的调节，都在起作用。不是只有“缺不缺血”这一个开关。\n而且，身体确实有自我调节的能力。某个部位需要更多血，局部血管可以扩张。但这些调节不是万能的，也不能用来解释所有长期高血压。\n真正需要担心的是另一件事：血压长期偏高，本身就在损伤器官。心脏每次泵血都要克服更大的阻力，血管壁一直承受过高的压力。时间久了，心、脑、肾都可能出问题。\n所以，问题不是“该不该降”，而是降哪一部分、降到什么程度。\n第三段（2:00–3:00）\n这里要讲清楚一个概念：降压，不是把血压越降越低。 我们要降的是“过高的那一部分”。\n有些降压药，是让收缩的血管放松，血液通过的阻力减小了，维持循环就不需要原来那么高的压力。还有些药，帮助排出多余的钠和水，也是从影响血压的环节入手，不是简单地减少器官需要的血液。\n当然，如果降得太快、太低，确实可能让人不舒服。老年人、脑血管狭窄的患者，尤其需要个体化的目标。这就是为什么医生要结合年龄、血管情况和耐受程度来定方案，而不是给所有人同一个数字目标。\n第四段（3:00–4:00）\n那怎么判断降得合不合适？\n如果您吃药以后头晕，尤其是站起来时眼前发黑，很可能就是血压偏低了，需要尽快找医生复诊，调整降压药的剂量、种类。\n血压高多数情况下并不是身体的“保护机制”，它是一个需要被管理的风险。对于高血压来讲，该降的降，该稳的稳，该调的调。我是云鹏医生，下期见。"}, "225542": {"id": "225542", "time": "2026-11-01 17:22:07", "sender": "云飞扬", "type": "文本", "text": "冬天坚持晨练，可能是在给血管“上刑”\n第一段（0:00–1:00）\n大家好，我是云鹏医生。\n天一冷，门诊上血压波动的患者就多起来。有位老患者跟我说：“我晨练十几年了，雷打不动。怎么一到冬天，血压就控不住了？”\n我问他：“您几点出门？”他说：“六点半。”\n问题可能就出在这儿。冬天坚持晨练，精神可嘉，但时间选错了，可能恰恰是在给血管增加负担。\n第二段（1:00–2:00）\n为什么会这样呢？两个因素叠在一起。\n第一，清晨本身就是血压的高峰时段。人从睡眠中醒来，交感神经激活，血压会有一个自然的“晨峰”。第二，寒冷会进一步刺激血管收缩。冬天清晨的冷空气，让本已经偏高的血压再往上走一层。\n2026年发表在权威期刊《高血压》上的一篇综述讲得很清楚：冬季清晨，寒冷暴露和觉醒反应叠加，会产生协同效应，同时抬高基础血压、放大血压波动、加剧晨峰。刚睡醒的那段时间，是心血管系统风险最高的窗口。\n这不是说晨练本身不好，是说在冬天最冷、血压最高的那个时间点，顶着冷风出门，不划算。\n第三段（2:00–3:00）\n那怎么办？把出门时间往后挪一挪。\n不提倡在寒冷的清晨进行户外锻炼。推荐上午10点到下午3点之间外出活动，这时候气温回升，血压的晨峰也已经过去。如果一整天都很冷，就换到室内。\n保暖也一样。不是只出门那一会儿要穿够，在家、在单位，室温也要让身体待得住。有些地方没有集中供暖，屋里也冷，坐着不动手脚冰凉，血管一样会收缩。该开暖气就开，里面多穿一层，方便增减。\n第四段（3:00–4:00）\n还有一件事：感冒了，别硬撑着照常晨练。\n有高血压的人，如果本身还有冠心病、心衰，呼吸道感染可能让原有病情加重。不舒服的时候，先把活动量降下来。如果出现气短明显加重、新的呼吸不适，及时联系医生，别全当成普通感冒。\n冬天管血压，不是要把日子过得紧张兮兮。好习惯可以保留，但不必在天气变了以后，还要求自己一点都不变。 时间挪一挪，衣服穿够，生病了缓一缓——这些调整，比硬扛更保护血管。我是云鹏医生，下期见。"}, "225538": {"id": "225538", "time": "2026-11-01 17:20:09", "sender": "云飞扬", "type": "视频", "text": "[视频]"}, "210432": {"id": "210432", "time": "2026-10-26 11:13:52", "sender": "王可欣", "type": "文本", "text": "@聂丽敏 ℡₁₇₆₀₃₁₁₉₂₆₈ 老师，我们的新文案准备好啦，辛苦您看看可以嘛~"}, "210434": {"id": "210434", "time": "2026-10-26 11:13:59", "sender": "王可欣", "type": "链接/文件", "text": "[文件] kp1 聂丽敏 kx 长期吃药和长期高血压，到底哪个对身体更危险？三件事，教你稳定血压.docx (12.4 KB, docx)"}, "210435": {"id": "210435", "time": "2026-10-26 11:13:59", "sender": "王可欣", "type": "链接/文件", "text": "[文件] kp2 聂丽敏 kx 肾友别再盲目低蛋白饮食，管好这四件事，吃得对比吃得少重要.docx (12.5 KB, docx)"}, "210436": {"id": "210436", "time": "2026-10-26 11:14:00", "sender": "王可欣", "type": "链接/文件", "text": "[文件] kp3 聂丽敏 kx 肾出问题了还能不能恢复？很多人天天做的这3件事，才是真正的伤肾元凶.docx (12.6 KB, docx)"}, "210437": {"id": "210437", "time": "2026-10-26 11:14:01", "sender": "王可欣", "type": "链接/文件", "text": "[文件] kp4 聂丽敏 kx 糖友出现这4种排尿变化，糖尿病肾病可能在加重.docx (14.1 KB, docx)"}, "207285": {"id": "207285", "time": "2026-10-23 15:43:23", "sender": "曾圆缘", "type": "链接/文件", "text": "[文件] KP14 曾炼坤 Z 体检发现血糖高，不想发展成糖尿病，记住这个逆转方法.docx (13.8 KB, docx)"}, "207286": {"id": "207286", "time": "2026-10-23 15:43:23", "sender": "曾圆缘", "type": "链接/文件", "text": "[文件] KP11 曾炼坤 Z 血糖控制到多少，不用担心并发症？.docx (13.4 KB, docx)"}, "207287": {"id": "207287", "time": "2026-10-23 15:43:24", "sender": "曾圆缘", "type": "链接/文件", "text": "[文件] KP12 曾炼坤 Z 糖尿病想要控制好，牢记八个底层逻辑.docx (13.4 KB, docx)"}, "207329": {"id": "207329", "time": "2026-10-23 15:47:52", "sender": "Dr.zeng", "type": "表情", "text": "[表情]"}, "208496": {"id": "208496", "time": "2026-10-23 19:41:41", "sender": "Dr.zeng", "type": "链接/文件", "text": "[小程序] lv_0_20261023102552.mp4"}, "208497": {"id": "208497", "time": "2026-10-23 19:42:12", "sender": "Dr.zeng", "type" : "曾圆缘", "type": "链接/文件", "text": "[文件] KP3 赵谧 Z 天气凉了，吃沙坦普利的肾友注意三点过冬.docx (13 KB, docx)"}, "210277": {"id": "210277", "time": "2026-10-26 10:41:09", "sender": "安宁静谧", "type": "视频", "text": "[视频]"}, "210319": {"id": "210319", "time": "2026-10-26 10:52:27", "sender": "剪辑 范义雅", "type": "链接/文件", "text": "[引用] 收到老师\n  ↳ 安宁静谧: [内部账号隐藏]: [附件技术数据隐藏]"}, "223854": {"id": "223854", "time": "2026-10-30 16:54:10", "sender": "安宁静谧", "type": "文本", "text": "抖音口播稿｜IgA肾病全攻略：是什么、怎么治、怎么查、怎么养\n\n诊断了IgA肾病，先别慌，也别不当回事。\n有人问我：\"医生，我这个病会不会变成尿毒症？\"\n我的答案是：这个病你不管它，它就可能越来越重；你管好它，它就能跟你和平共处一辈子。\n今天用一条视频，把IgA肾病讲明白：是什么、怎么治、多久查一次、生活上注意什么。建议先点赞收藏，这条能帮你少走弯路。\n第一，先说它是什么。\n我们身体里有一种免疫球蛋白，叫IgA。正常情况下，它是帮我们抵抗感染的\"护卫\"。\n但IgA肾病患者的体内，这种IgA出了问题，形成的免疫复合物跑到肾脏，沉积在肾小球上，引发了炎症，一点一点损伤肾脏的\"滤网\"。\n很多人是怎么发现的呢？\n感冒、嗓子发炎之后，突然发现尿色变红，像洗肉水一样——这叫肉眼血尿。去医院一查，IgA肾病。\n还有一种更隐蔽的：体检发现尿里有红细胞、有蛋白，但人毫无感觉。\n所以记住一句话：它不是感染直接伤了肾，而是感染点燃了身体里本来就存在的免疫异常。\n\n第二，怎么治\n治疗之前，先明确一个目标：\n治疗IgA肾病，不是追求\"断根\"，而是把尿蛋白降下来、把血压控制好、把肾功能下降的速度减慢，尽量不让它走向尿毒症。\n那具体怎么治疗？记住这三大块：\n第一块：长期基础护肾，所有人都适用。\n1. 普利类或沙坦类药物——很多人以为它只是降压药，其实它的核心作用是降尿蛋白、保护肾小球。哪怕血压不高，只要有蛋白尿，医生评估后也可能用；\n2. 符合条件的人，医生会加用SGLT2抑制剂（列净类药物）和或非奈利酮；\n3. 血压、盐摄入、血脂、尿酸、体重，全部都要管。\n⚠️ 吃这些药之后，1到4周内要复查肌酐和血钾，这个别忘。\n第二块：针对IgA的免疫损伤，中高危患者用。\n1. 靶向肠道黏膜免疫调节——比如布地奈德肠溶胶囊，固定9个月疗程，后续根据你的医生评估调整。\n2. 传统免疫抑制——全身糖皮质激素、霉酚酸酯等，适用于严格筛选的人群，用药期间要预防感染。\n3. 新型靶向/补体药物：部分已获批、部分仍在研究中，按最新获批适应证和专科评估选用。\n第三块：非常重要——用药不是一成不变的。\n每次复查后，医生会根据你的尿蛋白、肾功能、血压、有没有感染和副作用，决定是维持、加量、联合还是换药。\n⚠️ 三条铁律送给你：\n不照搬别人的方案；不自己买药吃；不停药、不换药。所有调整，必须让肾内科医生来做。\n\n第三，怎么随访？\n随访这件事，说到底就一句话：\n它是在为你的肾脏争取时间。\n研究数据显示：不充分治疗、长期失访的IgA肾病患者，进展到终末期肾病——也就是尿毒症的风险，会随着时间不断累积。\n所以复查频率怎么安排？记住这个节奏：\n每3个月，查核心项目：\n血压、体重、有没有水肿；\n尿常规加尿蛋白定量（查ACR比值或者24小时尿）；\n血肌酐、eGFR；\n电解质，尤其是血钾；\n以及根据你的病情需要的其他检查，还有症状、感染情况和用药的不良反应。\n每6个月，做一次全面复核：\n在3个月项目的基础上，加查血常规、血白蛋白、血糖、血脂、肝功能，评估心血管风险，必要时重新评估病理和风险分层。\n⚠️ 两种情况要加密复查：\n • 病情进展、复发或者调药期间——可能1到2个月就要查一次；\n • 刚启动新药或者加量后——1到4周内先查肌酐和血钾。\n最后提醒一句：别拿自己某一次化验单去推算\"我还能撑多少年\"，个体差别很大，规律随访才靠谱。\n\n第四，如何生活方式干预\n药物治疗是一半，另一半在你自己手里。这6件事，条条都重要：\n1. 低盐饮食。每天盐控制在5克以内，盐吃多了，蛋白尿和血压都更难控。\n2. 蛋白适量，不是越多越好。不要盲目大鱼大肉\"补身体\"，加重肾脏负担。\n3. 规律运动、控制体重、戒烟。保护好心血管，就是在保护肾。\n4. 预防感染，别熬夜、别过度劳累。扁桃体反复化脓的，找医生评估要不要处理。\n5. 远离伤肾的东西：成分不明的中草药、偏方、保健品，还有长期吃止痛药——非甾体抗炎药，这些都要避开。\n6. 特殊时刻主动告知医生：在备孕、怀孕、要做手术或造影检查之前，一定先告诉医生你有IgA肾病。\n7.适当饮水，如果口服SGLT2(列净类）、非奈利酮，需要保证肾灌注，需要适当多饮水，但如果已经有肾衰竭尿量减少、明显水肿、心力衰竭等医生要求需要限制饮水的人除外。\n\n最后总结三句话：\n第一，IgA肾病是慢性病，治的目标不是断根，是延缓肾功能的进展。\n第二，用药听医生的，复查按节奏，别怕麻烦。\n第三，你的每一口盐、每一次熬夜、每一顿复查，都在决定肾脏的未来。\n管好它，它就能陪你稳稳当当过一辈子。\n\n"}, "212737": {"id": "212737", "time": "2026-10-26 23:41:26", "sender": "喻敏", "type": "视频", "text": "[视频]"}, "212739": {"id": "212739", "time": "2026-10-26 23:42:51", "sender": "喻敏", "type": "视频", "text": "[视频]"}, "212740": {"id": "212740", "time": "2026-10-26 23:44:11", "sender": "喻敏", "type": "视频", "text": "[视频]"}, "212757": {"id": "212757", "time": "2026-10-27 06:59:52", "sender": "喻敏", "type": "链接/文件", "text": "[文件] 喻敏kp18 ZY 吃素了，低密度怎么还高？降血脂不只是忌口.docx (12.5 KB, docx)"}, "212772": {"id": "212772", "time": "2026-10-27 08:35:57", "sender": "邢慧茹", "type": "文本", "text": "收到，老师"}, "213826": {"id": "213826", "time": "2026-10-27 13:39:03", "sender": "邢慧茹", "type": "视频", "text": "[视频]"}, "213828": {"id": "213828", "time": "2026-10-27 13:39:30", "sender": "邢慧茹", "type": "图片", "text": "[图片] local_id=1091"}, "223984": {"id": "223984", "time": "2026-10-30 17:15:52", "sender": "祁冀.", "type": "文本", "text": "@刘伟伟 老师这是咱们的五篇新文案，麻烦您看一下有没有问题，有问题您随时和我说，我尽快调整，没有问题就辛苦老师有时间的时候录制啦~[玫瑰][玫瑰]"}, "223985": {"id": "223985", "time": "2026-10-30 17:15:52", "sender": "祁冀.", "type": "链接/文件", "text": "[文件] 刘伟伟kp14 ZY 做菜不放盐更健康？先分清少吃盐和低血钠.docx (12.5 KB, docx)"}, "223986": {"id": "223986", "time": "2026-10-30 17:15:53", "sender": "祁冀.", "type": "链接/文件", "text": "[文件] 刘伟伟kp11 ZY 血钾明明很高，医生为何让你重新抽血？原来这个环节可能影响结果！.docx (12.7 KB, docx)"}, "223987": {"id": "223987", "time": "2026-10-30 17:15:54", "sender": "祁冀.", "type": "链接/文件", "text": "[文件] 刘伟伟kp13 ZY 肾病想长期稳定，别只盯着肌酐这一个数.docx (12.8 KB, docx)"}, "223988": {"id": "223988", "time": "2026-10-30 17:15:54", "sender": "祁冀.", "type": "链接/文件", "text": " ": "[文件] KP5 赵谧 Z 得了 IgA 肾病，早晚都要透析？医生告诉你真相.docx (13.3 KB, docx)"}, "224335": {"id": "224335", "time": "2026-10-30 18:26:47", "sender": "曾圆缘", "type": "链接/文件", "text": "[文件] KP6 赵谧 Z 高了伤血管，低了伤骨头，血磷怎么管？.docx (13.1 KB, docx)"}, "224336": {"id": "224336", "time": "2026-10-30 18:26:48", "sender": "曾圆缘", "type": "链接/文件", "text": "[文件] KP7 赵谧 Z 两个抽血化验的检查项目，肾友复查要记住.docx (13 KB, docx)"}, "224567": {"id": "224567", "time": "2026-10-30 20:54:00", "sender": "安宁静谧", "type": "文本", "text": "《腹透好还是血透好？》\n\n各位肾病朋友、家属大家好，我是肾内科医生。门诊每天被问最多的一个问题就是：终末期肾病要透析了，到底选腹透，还是血透？很多人到处打听，有人说腹透好，可以在家做；有人说血透更稳妥，医院有医护盯着。今天先把核心结论告诉大家：没有绝对谁更好，远期总体生存率相近，只有哪一种更适合你当下的身体、家庭和生活状态，而且两种透析后续还可以互相转换，不是一次选定终身不变。\n首先我们快速理解两者原理。\n血液透析，也就是血透，通俗讲就是体外洗肾。 把血液引出体外，经过透析机、人工肾，快速清除毒素和多余水分，再把净化后的血液输回体内。常规是每周去透析中心3次，每次大约4小时，需要提前8周建立血管通路，最常用的就是手臂动静脉内瘘，如果内瘘未成熟就需要紧急透析，则根据病史需要留置股静脉、颈内静脉置管。\n腹膜透析，简称腹透，是利用我们自身腹腔里的腹膜，当作天然滤膜。 手术在腹腔植入腹透管，把腹透液灌入腹腔，毒素、多余水分通过腹膜交换进透析液，再把废液排出，一般每天换液3到5次，也可以选择夜间自动腹透机，睡觉的时候完成治疗，居家就可以操作。\n其次我们来了解一下血透的优缺点，我们先讲血透的优势：\n第一，毒素清除效率高，短时间快速降毒素、脱水，适合急性高钾、严重水肿、毒素负荷很重，需要快速纠正代谢紊乱的患者；\n第二，全程在透析中心，由专业医护操作监护，不用患者自己动手，对手眼协调差、年纪大、自理能力弱、家属没办法协助居家操作的病友非常友好；\n第三，技术非常成熟，并发症可以及时处理。\n当然它也有明显缺点：\n第一，时间地点固定，必须雷打不动往返医院，对上班族、居住地很远的患者，时间成本很高；\n第二，短时间快速脱水排毒，血流动力学波动大，容易出现低血压、肌肉痉挛，对心血管负担相对更大；\n第三，需要维护血管通路，每次穿刺，要保护内瘘，透析间期需要严格控水、控钾磷。\n接着我们来聊腹透的优缺点，腹透它最大亮点就是居家治疗，时间灵活，可以兼顾上班、照顾家庭，不用频繁跑医院，不用扎针；持续缓慢清除毒素水分，血压更平稳，对心脏冲击小，并且对残余肾功能保护更有优势，这一点对于还有尿量的患者非常重要。\n但是腹透不是人人都适合，它的短板也要客观说清楚：\n第一，非常考验自我管理，换液必须严格无菌操作，一旦污染，最常见并发症就是腹膜炎；\n第二，家里需要干净独立的操作空间，还要储存腹透液；\n第三，长期多年透析之后，部分患者会出现腹膜纤维化、超滤衰竭，腹膜功能下降，后续有可能需要转成血透；\n第四，存在腹透禁忌，比如严重腹腔粘连、既往多次腹部大手术、严重呼吸功能差、反复腹膜炎的患者，是不适合做腹透的。\n那到底怎么选？给大家一个临床选择思路：\n✅ 更倾向优先腹透：年轻患者、还希望正常工作、心功能差血压波动大、外周血管条件很差难以做内瘘、还有残余尿量、居住地离透析中心很远。\n✅ 更倾向优先血透：高龄、视力差手抖、没有能力完成无菌换液、家庭无法协助居家透析、急性危重高钾酸中毒、腹腔有严重粘连，腹透超滤不足毒素清除不达标的患者。\n这里一定要强调，选择不是一锤定音！ 初期选择腹透，后期腹膜功能衰退可以转血透；血透如果后期条件合适，也可以评估改腹透，是可以动态调整的。\n最后提醒大家：透析是肾脏替代治疗，不是治愈肾病。决定长期预后的，除了透析方式本身，还有基础疾病、营养状态、血压控制、并发症管理、依从性。最终方案一定要肾内科团队全面评估，结合你的病情、家庭条件综合决定，不要盲目跟风别人的选择。"}, "225785": {"id": "225785", "time": "2026-11-01 2 到底该不该管？.docx (12.7 KB, docx)"}, "193797": {"id": "193797", "time": "2026-10-19 09:27:03", "sender": "祁冀.", "type": "链接/文件", "text": "[文件] 云鹏kp3 ZY 血压降下来了，为什么还要检查心脏、血管和肾脏？.docx (12.5 KB, docx)"}, "193798": {"id": "193798", "time": "2026-10-19 09:27:04", "sender": "祁冀.", "type": "链接/文件", "text": "[文件] 云鹏kp4 ZY 降压药会伤肾、会耐药？这五个误区要分清.docx (12.6 KB, docx)"}, "193820": {"id": "193820", "time": "2026-10-19 09:31:25", "sender": "云飞扬", "type": "文本", "text": "好的[握手][玫瑰]今晚来录知"}, "193794": {"id": "193794", "time": "2026-10-19 09:27:01", "sender": "祁冀.", "type": "文本", "text": "@云飞扬 老师，这是咱们的四篇新文案，辛苦老师看一下有没有问题，有问题您随时和我说，我尽快调整，没有问题就辛苦您录制啦~~[玫瑰][玫瑰]"}, "202625": {"id": "202625", "time": "2026-10-21 20:46:04", "sender": "云飞扬", "type": "文本", "text": "脚本一：吃他汀，这几件事要留意\n第一段（0:00–1:00）\n大家好，我是云鹏医生。\n门诊上，很多吃他汀的朋友最担心的是伤肝伤肾。每次复查，转氨酶稍微升高一点，就很紧张，甚至自行停药。\n我今天想跟您说一句可能有点意外的话：吃他汀真正容易“出事”的地方，往往不在肝功能报告单上，而在您每天吃进去的东西里，在您同时吃的其他药里。\n注意，我不是说肝功能不用看。我是说，有些雷区比转氨酶升高更容易被忽略，而且一旦踩中，后果缺更严重。\n今天我就把吃他汀时最容易被忽略的几件事，一件一件跟您聊清楚。\n\n第二段（1:00–2:00）\n第一件事：有一种水果，真的不能和他汀“同桌”。\n西柚，也叫葡萄柚。它本身是好水果，但它里面有一种成分，会抑制身体里负责分解他汀的酶，导致他汀分解变慢，血液里的药物浓度就会升高。\n血药浓度一高，肌肉损伤的风险就上来了。有资料显示，西柚可以让洛伐他汀的血药浓度升高15倍，横纹肌溶解的风险明显增加。\n这里有一个关键点：受影响最大的是辛伐他汀和洛伐他汀。如果您吃的是阿托伐他汀，也需要注意；但普伐他汀、瑞舒伐他汀受影响相对小得多。\n所以不是让您把所有水果都戒了，而是西柚这一类，吃他汀期间最好避开。哪怕间隔几个小时，也不一定安全。\n\n第三段（2:00–3:00）\n第二件事：如果您同时吃降压药，要留意“两条路”的问题。\n很多朋友是血脂、血压一起高，他汀和降压药一起吃。他汀要靠肝脏里的“代谢通道”来降解，如果降压药也走同一条通路，两种药挤在一起，肝脏的负担就重了，药物在体内的浓度也会变得不稳定。\n所以医生在开药时，会有意识地错开药物的代谢通道。比如有些沙坦类降压药，像阿利沙坦酯，不经过肝脏的他汀代谢通道，而是通过肠道水解产生活性成分，从机制上减少了和他汀“冲突”的机会。\n但具体您该用哪种他汀，一定要让医生根据您的肝肾功能和合并用药来决定，不能自己道听途说。\n\n第四段（3:00–4:00）\n第三件事：短效他汀和长效他汀，吃的时间不一样。\n很多人听过“他汀都得晚上吃”，其实不是。辛伐他汀、洛伐他汀、普伐他汀这类短效的药物，半衰期短，晚上睡前吃更贴合肝脏夜间合成胆固醇的高峰。而阿托伐他汀、瑞舒伐他汀是长效的，药效管一整天，早上或晚上固定一个时间吃都行。\n\n比“几点吃药”更重要的是：固定时间，别今天早上明天晚上。\n最后，刚开始吃他汀或者调整剂量后的前三个月，记得复查肝功能和肌酸激酶。如果出现不明原因的大腿、小腿酸痛、乏力，需要及时到医院就诊。\n他汀是一个帮我们压低未来心梗、脑梗风险的工具。避开该避的，盯住该盯的，大多数人可以长期、安全地获益。我是云鹏医生，下期见。"}, "202626": {"id": "202626", "time": "2026-10-21 20:46:04", "sender": "云飞扬", "type": "文本", "text": "脚本三：血压降了，为什么还要做这么多检查？\n第一段（0:00–1:00）\n大家好，我是云鹏医生。\n很多高血压的朋友，药吃了，血压也降下来了。然后我跟他说：“还需要查一下心脏、颈动脉、肾脏。”他往往会有疑问：“血压都正常了，还查这些干什么？”\n这个问题特别真实。今天我就想跟您聊清楚：血压正常，为什么不代表“万事大吉”？过去那些年偏高的血压，有没有已经在器官上留下痕迹，靠一个血压计是看不出来的。\n\n第二段（1:00–2:00）\n我们先讲一下什么叫“靶器官损害”。\n长期血压高，就像一根水管常年承受偏高的水压。管壁会变厚、变硬，下游的“设备”也会受影响。在身体里，最常被牵连的三个地方是：心脏、血管和肾脏。\n心脏长期超负荷泵血，心肌会变厚，这叫左心室肥厚。一项汇总分析显示，在高血压人群中，左心室肥厚的患病率大约是36.5%。它不是靠感觉能发现的，需要心脏超声来看。\n颈动脉是全身血管的一个“窗口”。颈动脉超声能看到有没有斑块、血管有没有狭窄。高血压本身就会增加动脉粥样硬化的风险。\n肾脏里有大量细小血管，长期高压会损伤它们。早期可能没有任何感觉，但尿液里可能已经出现了微量白蛋白。\n第三段（2:00–3:00）\n那查这些，到底有什么用？\n用处在于：它决定了您的治疗目标应该到什么程度，以及除了降压之外，还需要做什么。\n2024年欧洲心脏病学会的高血压指南和2025年美国心脏病学会的指南，都把*高血压介导的靶器官损害评估作为风险分层的重要一步。也就是说，同样是血压降到130/80，一个没有靶器官损害的人，和一个已经有左心室肥厚或颈动脉斑块的人，后续的管理策略是不一样的。\n比如颈动脉超声发现斑块，医生可能会更重视降脂治疗；心脏超声发现左心室肥厚，医生在选择降压药时会考虑那些对逆转肥厚有帮助的药物类别。检查是为了让治疗更有针对性。\n第四段（3:00–4:00）\n当然，也不是所有人都需要把所有检查反复做一遍。查哪些、多久查一次，要根据您的血压水平、病程长短、合并疾病来决定。\n但有一条原则是清楚的：血压数字只告诉您“压力控制得怎么样”，靶器官评估才告诉您“过去那些年，身体有没有为此买单”。把这两件事放在一起，医生才能给您一个真正完整的方案。\n别让“血压正常”这四个字，成为您不再复查的理由。我是云鹏医生，下期见。"}, "202627": {"id": "202627", "time": "2026-10-21 20:46:04", "sender": "云飞扬", "type": "文本", "text": "脚本四：降压药伤肾？你可能担心反了\n\n第一段（0:00–1:00）\n大家好，我是云鹏医生。\n门诊上，一说要开始吃降压药，很多人的第一反应不是“吃了血压能稳”，而是“这药会不会伤肝伤肾？吃久了会不会耐药？是不是一吃就停不下来了？”\n我特别理解这些担心。但我今天想跟您说一句可能有点扎心的话：真正出问题恰恰是因为这些没根据的担心，导致该吃的药没吃，最后肾脏出了问题。\n关于降压药的误区，今天挑最要紧的几个，跟您聊清楚。\n第二段（1:00–2:00）\n先说“伤肾”。\n高血压本身，才是伤肾的主力之一。长期血压偏高，肾脏里那些细小的血管会持续受损，过滤功能会慢慢下降。而普利类、沙坦类降压药，在合适的人群中，恰恰有保护肾脏的作用——它们降低肾小球内的压力，减少蛋白的漏出。\n当然，任何药物都有需要监测的指标。用这类药，医生会定期看您的血肌酐和血钾。如果指标有变化，医生会判断原因、调整方案。不吃药带来的肾脏风险，比规范用药要大得多。\n\n第三段（2:00–3:00）\n\n再说“耐药”。\n“一种药吃几年就失效了，所以要定期换着吃”，这个说法在降压药里不成立。降压药不存在抗生素那种“耐药”的概念。\n如果原来的方案控制不住了，首先要看的是：有没有漏服？体重有没有变化？盐是不是吃多了？有没有新出现的合并疾病或药物相互作用？而不是简单地归结为“药吃久了没用了”。如果确实需要调整，医生可以改剂量、联合另一种药，但没必要仅仅因为“用了很多年”就换药。\n\n第四段（3:00–4:00）\n最后说“停不下来”。\n需要长期吃药，通常是因为血压需要持续控制，不是药物让身体产生了依赖。有一项综述汇总了停用降压药的研究，发现停药后1年成功率大约40%，2年成功率大约27%。也就是说，确实有少数人可以在医生指导下成功减量或停药，但比例并不高，而且需要监测血压。\n更常见的情况是：吃药后血压正常了，就以为“病好了”，自己把药停了。结果血压反弹，甚至比原来更高。血压正常，恰恰说明是降压药在起作用。\n您真正该关心的，不是“我吃了多久”，而是血压有没有持续达标、有没有不舒服、复查指标怎么样。把这些记录下来，和医生一起来判断，才是对自己最负责的做法。我是云鹏医生，下期见。"}, "202628": {"id": "202628", "time": "2026-10-21 20:47:07", "sender": "云飞扬", "type": "文本", "text": "你们给我的脚本2，其实跟原来的内容是差不多的。我就觉得内容有重复了，我就没有录，我就只录了脚本1、脚本3和脚本4。并且这个脚本呢，按照我个人的这个习惯呢，我也做了一点修改，就是大致的内容是相同的，但是具体的这个讲的方法做了一点修改"}, "202630": {"id": "202630", "time": "2026-10-21 20:49:58", "sender": "云飞扬", "type": "文本", "text": "脚本4中间有点错误，分成两段录制完成"}, "202634": {"id": "202634", "time": "2026-10-21 20:50:47", "sender": "云飞扬", "type": "视频", "text": "[视频]"}, "205944": {"id": "205944", "time": "2026-10-23 09:42:57", "sender": "剪辑 范义雅", "type": "视频", "text": "[视频]"}, "205945": {"id": "205945", "time": "2026-10-23 09:42:58", "sender": "剪辑 范义雅", "type": "文本", "text": "@云飞扬 老师，“降压别只看数字”这条视频剪好了，辛苦您看一下~[玫瑰]"}, "205946": {"id": "205946", "time": "2026-10-23 09:44:38", "sender": "云飞扬", "type": "文本", "text": "没有问题"}, "205954": {"id": "205954", "time": "2026-10-23 09:45:46", "sender": "云飞扬", "type": "文本", "text": "第一段（0:00–1:00）\n\n大家好，我是云鹏医生。\n\n门诊上经常遇到三四十岁的朋友，高压一百二挺正常，低压却到了九十五、九十八。他们常问：“医生，我血压没事吧？不用吃药吧？”我以前会说“再观察观察”，现在我会多问一句：“低压高多久了？”\n\n因为这几年有个很重要的变化：年轻人低压高，不再被当成“扛得住”的良性现象了。2026年心血管权威期刊上的一项研究，随访了近两万四千人17年。结果发现：青年时期有单纯舒张期高血压的人，心血管疾病风险升高36%，心衰风险升高69%，而且约三分之一会进展成高压、低压都高。\n\n今天我就跟您聊聊：低压高意味着什么，为什么不能“再等等”，以及生活上最该改变的是什么。\n\n第二段（1:00–2:00）\n\n我们先弄明白，低压是怎么来的。\n\n心脏收缩喷射血液，形成高压；心脏舒张时，大动脉靠弹性推血，维持的压力就是低压。\n\n高压高，多是大血管变硬了；而低压高，问题出在更细的小血管上——它们持续收缩，血液往前流阻力增大了。\n\n为什么小血管一直“紧绷”？最常见的原因是交感神经持续兴奋。像熬夜、压力大、久坐、肥胖，让身体总处在“随时要战斗”的状态。小血管收缩，心率偏快，低压就高了。\n\n所以低压高不是凭空来的，是身体在用数字告诉您：血管调控已经出了问题，只是还没到高压升上去的时候。\n\n第三段（2:00–3:00）\n\n那为什么不能“再等等”？\n\n因为对50岁以下的人，低压对心血管风险的预测价值，其实比高压更强。有分析显示，低压每升高10毫米汞柱，心脑血管死亡风险大约翻一倍。您觉得“只是低压高一点”，但血管已经在承受持续偏高的压力，不会因为您没感觉就停下来。\n\n当然，听到这您别紧张，不是说低压高就得立马吃药。2024年欧洲指南指出，年轻人单纯低压高，暂时先不用药是可以的。但前提是，您得死死盯住它。如果不通过生活方式干预，它很容易慢慢演变成双高。\n\n所以真正该做的，是从现在开始，认真做一件能把低压降下来的事。\n\n第四段（3:00–4:00）\n\n这件事，就是规律的有氧运动。\n\n2026年的一项研究显示：有氧运动可以降低24小时舒张压约2.76毫米汞柱，有氧加抗阻的联合训练可以降低约3.94毫米汞柱。数字看似不大，但它是24小时动态血压，意味着全天都在起效。\n\n具体怎么做？每周至少150分钟中等强度有氧运动，快走、慢跑、游泳都行。什么叫中等强度？运动时能说话，但不能唱歌。平时不运动的，从每天快走20分钟开始，比猛练更可持续。\n\n如果体重也超标，减重同样重要。有研究显示，体重每减轻1公斤，舒张压平均下降约1毫米汞柱。\n\n第五段（4:00–4:30）\n\n最后说句实在话。\n\n低压高，最怕两种态度：一是“高压正常就没事”，一直拖；二是“听说低压高要吃药”，自己跑去买别人的药吃。\n\n该不该用药，要看您整体的心血管风险。如果反复测量低压持续在90以上，或者已经出现微量白蛋白尿、左心室肥厚等靶器官损害，那就不是“再等等”的事了，应该找医生评估用药。\n\n但在那之前，您手里马上能做的事就是：动起来，把体重往下降一点。低压高，是血管在提前向您报警。我是云鹏医生，下期见。"}, "205978": {"id": "205978", "time": "2026-10-23 09:50:18", "sender": "剪辑 范义雅", "type": "文本", "text": "好的老师"}, "206361": {"id": "206361", "time": "2026-10-23 11:04:57", "sender": "剪辑 范义雅", "type": "图片", "text": "[图片] local_id=289"}, "206365": {"id": "206365", "time": "2026-10-23 11:05:18", "sender": "剪辑 范义雅", "type": "视频", "text": "[视频]"}, "191223": {"id": "191223", "time": "2026-10-16 14:40:51", "sender": "曾圆缘", "type": "文本", "text": "@李芝医生 老师老师，咱们有一条文案写好啦，辛苦您看看合不合适~合适的话就可以开始录制啦[爱心]"}, "191224": {"id": "191224", "time": "2026-10-16 14:40:51", "sender": "曾圆缘", "type": "链接/文件", "text": "[文件] KP8 李芝 Z 肾病补什么，都不如先补血.docx (12.2 KB, docx)"}, "191381": {"id": "191381", "time": "2026-10-16 14:40:51", "sender": "未知发言人", "type": "系统", "text": "[系统] \"曾圆缘\" 撤回了一条消息"}, "191382": {"id": "191382", "time": "2026-10-16 15:13:05", "sender": "曾圆缘", "type": "链接/文件", "text": "[文件] KP8 李芝 Z 降压药能停吗.docx (12.9 KB, docx)"}, "178042": {"id": "178042", "time": "2026-10-12 10:35:06", "sender": "循证科普培训班  张老师", "type": "文本", "text": "@李芝医生 老师老师，咱们有三条文案写好啦，辛苦您看看合不合适呀，合适的话就可以开始录制了[玫瑰][玫瑰]"}, "178043": {"id": "178043", "time": "2026-10-12 10:35:08", "sender": "循证科普培训班  张老师", "type": "链接/文件", "text": "[文件] KP2 李芝 Z 空腹血糖正常，糖化血红蛋白高，要不要管？.docx (13.1 KB, docx)"}, "178044": {"id": "178044", "time": "2026-10-12 10:35:12", "sender": "循证科普培训班  张老师", "type": "链接/文件", "text": "[文件] KP1 李芝 Z 糖尿病没感觉≠没问题.docx (13.1 KB, docx)"}, "178045": {"id": "178045", "time": "2026-10-12 10:35:16", "sender": "循证科普培训班  张老师", "type": "链接/文件", "text": "[文件] KP3 李芝 Z 甲状腺结节4类就是癌？先看报告这些词.docx (13.3 KB, docx)"}, "179086": {"id": "179086", "time": "2026-10-12 16:01:11", "sender": "王雅琳", "type": "图片", "text": "[图片] local_id=276"}, "179087": {"id": "179087", "time": "2026-10-12 16:01:42", "sender": "王雅琳", function filtered(){let q=$('search').value.trim().toLowerCase();return sets[tab][1].filter(r=>(!$('doctor').value||r.doctor===$('doctor').value)&&(!$('group').value||r.group===$('group').value)&&(!q||JSON.stringify(r).toLowerCase().includes(q)||(r.windows||[]).some(mid=>JSON.stringify(D.messages[mid]||{}).toLowerCase().includes(q))));}
function render(){document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));$('group').disabled=tab!=='events';if(tab==='fixes'){$('count').textContent='7个自动状态；人工与预留状态独立';$('rows').innerHTML=`<article><h2>新规则</h2><p>视频分析门槛55秒；同一作品分段有证据确认时按整体处理。同阶段重复、较早证据不计错误。</p><table>${D.rules.map(r=>`<tr><td>${esc(r[0])}</td><td>${esc(r[1])}</td></tr>`).join('')}</table><p>已取消、已下架由人工修改；已定时、待录制保留暂不用。远端状态优于本地时记录差异，不回退飞书。</p></article>`+D.fixes.map(f=>`<article><h2>${esc(f[0])}</h2><p>${esc(f[1])}</p></article>`).join('');return;}const rows=filtered();$('count').textContent=`显示 ${rows.length} / ${sets[tab][1].length} 条；点击每条展开证据与上下文。`;$('rows').innerHTML=rows.map(r=>`<article><details><summary><span class="tag">${esc(r.group||r.media||r.kind||r.assessment)}</span>${r.result?'<span class="tag">'+esc(r.result)+'</span>':''}<span>${esc(r.doctor)} · 消息${esc(r.id)} · ${esc(r.time)}</span><span>${esc(r.title)}</span></summary>${details(r)}</details></article>`).join('')||'<p>没有符合筛选条件的记录。</p>';}
$('tabs').innerHTML=Object.entries(sets).map(([k,[name,rows]])=>`<button data-tab="${k}">${name}${k==='fixes'?'':'（'+rows.length+'）'}</button>`).join('');$('tabs').addEventListener('click',e=>{if(e.target.dataset.tab){tab=e.target.dataset.tab;$('group').value='';render();}});for(const id of ['doctor','group','search'])$(id).addEventListener('input',render);render();
</script></html>
