的血管来说，这就是雪上加霜。遇到事别着急、别生闷气，情绪稳了，血管也少受刺激。\n发现斑块别慌，但一定要重视，找专业医生看，把血脂、血压和情绪这三件事坚持做好，血管状况才会越来越好。\n \n", "source": "本地DOCX；已核对候选记录MD5", "error": "", "recomputedScore": 0.1565}, {"messageId": 206428, "title": "云鹏kp6 ZY 血压、血脂、血糖都高，究竟哪个更危险？", "recordedScore": 0.1357, "body": "封面：三高先管哪一个\n标题：血压、血脂、血糖都高，究竟哪个更危险？\n#抖出健康知识宝藏 #健康科普进行时 #稳压护心 #夜间高血压 #健康生活\n你说高血压、高血脂、高血糖，这三兄弟哪个最危险，哪个最影响生命呢？你可能觉得，既然都是高，总得有个轻重吧，我先把最危险的那个管好，另外两个能不能放一放？\n这得看你具体高到什么程度，还真不能给所有人排同一个顺序。咱们先看看，它们分别会给身体带来什么影响，你就明白为什么不能只挑一个管了。\n先说血压。心脏每跳一下，都要把血液往外送。如果血管里的压力一直很高，心脏就得更使劲，才能把血泵出去。偶尔多干一点活，和天天这样干，当然不一样。时间长了，心脏可能出现改变，严重时就可能发生心衰。\n血管也一样，长期承受偏高的压力，更容易受损。所以高血压不仅与脑出血有关，也会增加脑梗、肾脏损伤以及主动脉夹层等问题的风险。但不是说血压一高，血管马上就会破，而是一直控制不好，出问题的可能性会增加。\n那高血糖呢？很多人觉得，我血糖高了好几年，也照样吃饭、上班，好像没受什么影响。可血糖造成的影响，有些并不会马上让你难受。\n你比如说眼睛，眼底的小血管已经出现变化，早期可能还看得清东西。等到视力明显受影响，再去检查，病变可能已经比较重了。肾脏也是，有时已经开始漏白蛋白，人却不疼不肿，得通过尿液检查才能发现。\n还有脚麻这件事。听着好像只是感觉不舒服，但如果神经受损，脚的感觉变迟钝，就可能连受伤都不知道。鞋子磨破了皮，没有及时处理，再碰上腿脚供血不好，伤口就不容易长好。严重的糖尿病足，确实可能需要截肢。\n不过，这些都是可能发生的并发症，不是得了糖尿病就一定要经历。讲清楚这些，是让你知道为什么要管理血糖，而不是让你提前认定自己以后会怎样。\n说到高血脂，你可能又觉得，这个总该轻一点吧？平时没感觉，化验才知道。问题是，血脂异常的风险，恰恰不能靠感觉来判断。\n尤其是低密度脂蛋白胆固醇长期偏高，会促进动脉粥样硬化斑块形成。斑块长在血管壁里，可能让血管变窄，血液通过就没那么顺畅了。\n而且，不是非要等它把血管慢慢堵满才出事。有些斑块会破裂，随后形成血栓，突然把血流堵住，这就可能引发心梗或者脑梗。所以，“平时不难受”不能作为放着血脂不管的理由。\n你看，这三种问题虽然不完全一样，但很多时候都在影响血管。一个是压力长期偏高，一个可能损伤血管和神经，另一个会促进斑块形成。如果同时出现在一个人身上，就不能分开算账了。\n比如你有糖尿病，最近血糖控制得不错，但血压一直高，低密度脂蛋白胆固醇也没降下来。那血糖这一项确实改善了，可血压、血脂带来的风险还在。不能因为一个数字变好了，就认为其他两个也跟着安全了。\n所以，医生给你安排治疗时，不只是看哪个有箭头，还要看升高多少、持续多久，有没有心脑血管病或肾脏损伤。某一项明显失控，可能需要先处理，但“先处理”不等于另外两项可以一直不管。\n日常也不用把自己弄得太复杂。饭菜少放点盐，含糖饮料少喝，合理控制食量，再把规律运动和体重管理做起来，这些调整往往不只对一个指标有帮助。但也不是油一点不能吃、主食全得戒，还是要吃得均衡。\n如果已经需要药物，就按医嘱治疗，再通过复查看效果。你真正要问医生的，可以是：我这几项分别该控制到什么水平，现在还有哪一项没达标？\n这么一来，三高就不是一场谁更危险的比赛了。需要优先处理的先处理，其他存在的问题也一起管理，才不会降好了一个，又漏掉另外两个。\n", "source": "本地DOCX；已核对候选记录MD5", "error": "", "recomputedScore": 0.1357}, {"messageId": 225543, "title": "血压、血脂、血糖都高，先管哪一个？", "recordedScore": 0.1357, "body": "血压、血脂、血糖都高，先管哪一个？\n第一段（0:00–1:00）\n大家好，我是云鹏医生。\n门诊上经常有人问我：“血压、血脂、血糖都高，到底哪个最危险？我能不能先把最危险的那个管好，另外两个先放一放？”\n这个想法特别自然。但今天我想跟您说一句可能有点意外的话：三高之间，很难排出一个对所有人都适用的“危险顺序”。 更关键的是，分开管和一起管，结果完全不一样。\n有一项香港的研究，追踪了一批“三高”的患者。血糖、血压、血脂三项都达标的人，和三项都不达标的人相比，心血管事件风险降低了55%。这不是某一个指标在起作用，是一起达标带来的结果。\n第二段（1:00–2:00）\n为什么不能只挑一个管？\n因为这三件事，伤的是同一套系统——血管。\n血压高，是血管壁长期承受过高的压力，心脏要更使劲泵血，血管更容易受损。血糖高，伤的是全身的小血管和神经，早期不疼不痒，等有感觉的时候，眼底、肾脏可能已经出了问题。血脂高，尤其是坏胆固醇长期偏高，会促进斑块形成。斑块破裂形成血栓，心梗、脑梗可能就在几分钟之内。\n它们不是三个独立的问题，是三个方向同时推高同一个风险。只关掉其中一个开关，另外两个还在往同一个方向使劲。\n第三段（2:00–3:00）\n那医生该怎么处理？不是“只挑最危险的那一个”，而是看谁最失控、谁最紧迫，先处理，但另外两个也不能丢。\n比如您血糖最近控制得不错，但血压一直高，低密度脂蛋白胆固醇也没降下来。血糖这一项指标的改善值得高兴，但不能因为一个数字变好了，就认为另外两个也跟着安全了。“先处理”不等于“另外两个可以一直不管”。\n日常能做的，其实很多是“一箭三雕”的。少放点盐、少喝含糖饮料、控制食量、规律运动、把体重降一点——这些调整，对这三个指标的改善都有帮助。\n第四段（3:00–4:00）\n所以，三高不是一场“谁更危险”的比赛。您真正该问医生的，不是“先管哪一个”，而是：我的“三高”分别该控制到什么水平？现在还有哪一项没达标？\n需要优先处理的先处理，但其他存在的问题也要一起管理。降好了一个，缺漏掉另外两个，等于白忙一场。\n我是云鹏医生，下期见。", "source": "来源文本消息全文（保留原消息，不自动认定为有效稿件）", "error": "", "recomputedScore": 0.1357}, {"messageId": 202627, "title": "脚本四：降压药伤肾？你可能担心反了", "recordedScore": 0.1254, "body": "脚本四：降压药伤肾？你可能担心反了\n\n第一段（0:00–1:00）\n大家好，我是云鹏医生。\n门诊上，一说要开始吃降压药，很多人的第一反应不是“吃了血压能稳”，而是“这药会不会伤肝伤肾？吃久了会不会耐药？是不是一吃就停不下来了？”\n我特别理解这些担心。但我今天想跟您说一句可能有点扎心的话：真正出问题恰恰是因为这些没根据的担心，导致该吃的药没吃，最后肾脏出了问题。\n关于降压药的误区，今天挑最要紧的几个，跟您聊清楚。\n第二段（1:00–2:00）\n先说“伤肾”。\n高血压本身，才是伤肾的主力之一。长期血压偏高，肾脏里那些细小的血管会持续受损，过滤功能会慢慢下降。而普利类、沙坦类降压药，在合适的人群中，恰恰有保护肾脏的作用——它们降低肾小球内的压力，减少蛋白的漏出。\n当然，任何药物都有需要监测的指标。用这类药，医生会定期看您的血肌酐和血钾。如果指标有变化，医生会判断原因、调整方案。不吃药带来的肾脏风险，比规范用药要大得多。\n\n第三段（2:00–3:00）\n\n再说“耐药”。\n“一种药吃几年就失效了，所以要定期换着吃”，这个说法在降压药里不成立。降压药不存在抗生素那种“耐药”的概念。\n如果原来的方案控制不住了，首先要看的是：有没有漏服？体重有没有变化？盐是不是吃多了？有没有新出现的合并疾病或药物相互作用？而不是简单地归结为“药吃久了没用了”。如果确实需要调整，医生可以改剂量、联合另一种药，但没必要仅仅因为“用了很多年”就换药。\n\n第四段（3:00–4:00）\n最后说“停不下来”。\n需要长期吃药，通常是因为血压需要持续控制，不是药物让身体产生了依赖。有一项综述汇总了停用降压药的研究，发现停药后1年成功率大约40%，2年成功率大约27%。也就是说，确实有少数人可以在医生指导下成功减量或停药，但比例并不高，而且需要监测血压。\n更常见的情况是：吃药后血压正常了，就以为“病好了”，自己把药停了。结果血压反弹，甚至比原来更高。血压正常，恰恰说明是降压药在起作用。\n您真正该关心的，不是“我吃了多久”，而是血压有没有持续达标、有没有不舒服、复查指标怎么样。把这些记录下来，和医生一起来判断，才是对自己最负责的做法。我是云鹏医生，下期见。", "source": "来源文本消息全文（保留原消息，不自动认定为有效稿件）", "error": "", "recomputedScore": 0.1254}, {"messageId": 202626, "title": "脚本三：血压降了，为什么还要做这么多检查？", "recordedScore": 0.1252, "body": "脚本三：血压降了，为什么还要做这么多检查？\n第一段（0:00–1:00）\n大家好，我是云鹏医生。\n很多高血压的朋友，药吃了，血压也降下来了。然后我跟他说：“还需要查一下心脏、颈动脉、肾脏。”他往往会有疑问：“血压都正常了，还查这些干什么？”\n这个问题特别真实。今天我就想跟您聊清楚：血压正常，为什么不代表“万事大吉”？过去那些年偏高的血压，有没有已经在器官上留下痕迹，靠一个血压计是看不出来的。\n\n第二段（1:00–2:00）\n我们先讲一下什么叫“靶器官损害”。\n长期血压高，就像一根水管常年承受偏高的水压。管壁会变厚、变硬，下游的“设备”也会受影响。在身体里，最常被牵连的三个地方是：心脏、血管和肾脏。\n心脏长期超负荷泵血，心肌会变厚，这叫左心室肥厚。一项汇总分析显示，在高血压人群中，左心室肥厚的患病率大约是36.5%。它不是靠感觉能发现的，需要心脏超声来看。\n颈动脉是全身血管的一个“窗口”。颈动脉超声能看到有没有斑块、血管有没有狭窄。高血压本身就会增加动脉粥样硬化的风险。\n肾脏里有大量细小血管，长期高压会损伤它们。早期可能没有任何感觉，但尿液里可能已经出现了微量白蛋白。\n第三段（2:00–3:00）\n那查这些，到底有什么用？\n用处在于：它决定了您的治疗目标应该到什么程度，以及除了降压之外，还需要做什么。\n2024年欧洲心脏病学会的高血压指南和2025年美国心脏病学会的指南，都把*高血压介导的靶器官损害评估作为风险分层的重要一步。也就是说，同样是血压降到130/80，一个没有靶器官损害的人，和一个已经有左心室肥厚或颈动脉斑块的人，后续的管理策略是不一样的。\n比如颈动脉超声发现斑块，医生可能会更重视降脂治疗；心脏超声发现左心室肥厚，医生在选择降压药时会考虑那些对逆转肥厚有帮助的药物类别。检查是为了让治疗更有针对性。\n第四段（3:00–4:00）\n当然，也不是所有人都需要把所有检查反复做一遍。查哪些、多久查一次，要根据您的血压水平、病程长短、合并疾病来决定。\n但有一条原则是清楚的：血压数字只告诉您“压力控制得怎么样”，靶器官评估才告诉您“过去那些年，身体有没有为此买单”。把这两件事放在一起，医生才能给您一个真正完整的方案。\n别让“血压正常”这四个字，成为您不再复查的理由。我是云鹏医生，下期见。", "source": "来源文本消息全文（保留原消息，不自动认定为有效稿件）", "error": "", "recomputedScore": 0.1252}], "unavailableCount": 1, "matchStatus": "needs_review", "unavailableReasons": ["document_identity_parameters_missing"]}, "result": "待核对"}, {"id": "241745", "doctor": "云鹏", "time": "2026-11-06 23:45:41", "group": "需要处理", "action": "needs_review", "reason": "同一作品两段（60.209秒＋29.7秒），医生241747已确认；整体关联仍未完成。", "verdict": "同一作品两段（60.209秒＋29.7秒），医生241747已确认；整体关联仍未完成。", "task": "", "title": "尚未关联作品", "local": "空", "remote": "未绑定／未取得", "recordId": null, "hold": "", "enabled": false, "notes": ["合计89.909秒，应按一个作品处理；旧短视频排除只作为历史记录，不当成正常完成。", "程序原始结果：视频开头未达到唯一文案匹配标准。", "本次只读核验：本地视频文件通过校验。阻塞在后续作品／稿件匹配，不是该原件未下载。", "匹配缓存：达标候选0个，采样60.209秒，结果needs_review；最高3个候选分数列在下方。", "当前身份目录中的发送人职责：医生；职责目录是本次读取值，不冒充历史身份快照。", "该事件尚无任务归属，不能将这条消息直接计为一个失败任务，也不能把最高分候选当成已确认归属。"], "history": [], "sync": {"text": "本条未新增状态历史，不要求重复写回。", "records": [], "attention": false}, "windows": ["241745", "205954", "193796", "225541"], "media": {"fileVerified": true, "videoPresent": true, "download": "已下载", "seconds": 60.21, "matchStatus": "needs_review", "qualifyingCount": 0, "sampleSeconds": 60.209, "candidateCount": 5, "best": [{"title": "第一段（0:00–1:00）", "score": 0.2092, "taskRef": "", "messageId": 205954}, {"title": "云鹏kp2 ZY 高压不高，只有低压高，到底该不该管？", "score": 0.1366, "taskRef": "", "messageId": 193796}, {"title": "血压高是身体在“自救”，所以不能降？", "score": 0.1339, "taskRef": "fc78fabb", "messageId": 225541}]}, "comparison": {"capturedAt": "2026-11-10T12:00:01+08:00", "transcript": "大家好，三四十岁的人，高压一百二，低压九十五，很多人问我医生，这种情况需不需要吃药啊？我的回答是先别急着吃药，但是呢也不能不重视。这种情况叫做单纯舒张期高血压，背。 常见的原因呢是外周血管阻力升高，交感神经持续兴奋，像熬夜、久坐、压力大、体重超标都可以推高舒张压，也就是我们俗称的低压。那我们应该做什么呢？首先是规律的有氧运动，二零二四版。 中国高血压指南推荐每周至少要有一百五十分钟中等强度的有氧运动，比如说像快走、慢跑、游泳、骑车，还要配合呢每周有两到三次的抗阻运动。那么什么是中等强度的有氧运动呢？那么就是像我们啊。 Thank you.", "seconds": 60.209, "stop": "video_end", "basis": "最新匹配缓存候选", "documents": [{"messageId": 205954, "title": "第一段（0:00–1:00）", "recordedScore": 0.2092, "body": "第一段（0:00–1:00）\n\n大家好，我是云鹏医生。\n\n门诊上经常遇到三四十岁的朋友，高压一百二挺正常，低压却到了九十五、九十八。他们常问：“医生，我血压没事吧？不用吃药吧？”我以前会说“再观察观察”，现在我会多问一句：“低压高多久了？”\n\n因为这几年有个很重要的变化：年轻人低压高，不再被当成“扛得住”的良性现象了。2026年心血管权威期刊上的一项研究，随访了近两万四千人17年。结果发现：青年时期有单纯舒张期高血压的人，心血管疾病风险升高36%，心衰风险升高69%，而且约三分之一会进展成高压、低压都高。\n\n今天我就跟您聊聊：低压高意味着什么，为什么不能“再等等”，以及生活上最该改变的是什么。\n\n第二段（1:00–2:00）\n\n我们先弄明白，低压是怎么来的。\n\n心脏收缩喷射血液，形成高压；心脏舒张时，大动脉靠弹性推血，维持的压力就是低压。\n\n高压高，多是大血管变硬了；而低压高，问题出在更细的小血管上——它们持续收缩，血液往前流阻力增大了。\n\n为什么小血管一直“紧绷”？最常见的原因是交感神经持续兴奋。像熬夜、压力大、久坐、肥胖，让身体总处在“随时要战斗”的状态。小血管收缩，心率偏快，低压就高了。\n\n所以低压高不是凭空来的，是身体在用数字告诉您：血管调控已经出了问题，只是还没到高压升上去的时候。\n\n第三段（2:00–3:00）\n\n那为什么不能“再等等”？\n\n因为对50岁以下的人，低压对心血管风险的预测价值，其实比高压更强。有分析显示，低压每升高10毫米汞柱，心脑血管死亡风险大约翻一倍。您觉得“只是低压高一点”，但血管已经在承受持续偏高的压力，不会因为您没感觉就停下来。\n\n当然，听到这您别紧张，不是说低压高就得立马吃药。2024年欧洲指南指出，年轻人单纯低压高，暂时先不用药是可以的。但前提是，您得死死盯住它。如果不通过生活方式干预，它很容易慢慢演变成双高。\n\n所以真正该做的，是从现在开始，认真做一件能把低压降下来的事。\n\n第四段（3:00–4:00）\n\n这件事，就是规律的有氧运动。\n\n2026年的一项研究显示：有氧运动可以降低24小时舒张压约2.76毫米汞柱，有氧加抗阻的联合训练可以降低约3.94毫米汞柱。数字看似不大，但它是24小时动态血压，意味着全天都在起效。\n\n具体怎么做？每周至少150分钟中等强度有氧运动，快走、慢跑、游泳都行。什么叫中等强度？运动时能说话，但不能唱歌。平时不运动的，从每天快走20分钟开始，比猛练更可持续。\n\n如果体重也超标，减重同样重要。有研究显示，体重每减轻1公斤，舒张压平均下降约1毫米汞柱。\n\n第五段（4:00–4:30）\n\n最后说句实在话。\n\n低压高，最怕两种态度：一是“高压正常就没事”，一直拖；二是“听说低压高要吃药”，自己跑去买别人的药吃。\n\n该不该用药，要看您整体的心血管风险。如果反复测量低压持续在90以上，或者已经出现微量白蛋白尿、左心室肥厚等靶器官损害，那就不是“再等等”的事了，应该找医生评估用药。\n\n但在那之前，您手里马上能做的事就是：动起来，把体重往下降一点。低压高，是血管在提前向您报警。我是云鹏医生，下期见。", "source": "来源文本消息全文（保留原消息，不自动认定为有效稿件）", "error": "", "recomputedScore": 0.2092}, {"messageId": 193796, "title": "云鹏kp2 ZY 高压不高，只有低压高，到底该不该管？", "recordedScore": 0.1366, "body": "封面：低压高别忽视\n标题：高压不高，只有低压高，到底该不该管？\n#抖出健康知识宝藏 #健康科普进行时#稳压护心#夜间高血压 #心血管健康\n高压高的人多数是因为大血管变硬了，而低压高呢，多数时候啊是小血管收紧了。那这两种情况呢，虽然都叫高血压，但它根本就不是一回事儿，调理的重点也完全不同，那今天呢，我就和大家讲清楚高压高和低压高的区别，你听明白了以后啊，你就知道你的血压应该怎么调理了。\n先想想心脏把血液往外送的过程。心脏收缩，血液进入动脉，这时候形成的压力高峰，就是收缩压，也就是高压。大动脉有弹性，血液进来时能够适当撑开，缓冲这股压力。如果动脉逐渐变硬，同样一股血流进入，压力就更容易升高。\n这也解释了为什么中老年人更容易出现高压升高。不过，年龄不是唯一因素，肥胖、吸烟、血脂血糖异常等，也可能影响血管健康；吃盐太多，则可能通过水钠潴留等机制推高血压。所以，高压高不能全部归结为年纪大了，更不是到了某个年龄就不用管。\n心脏舒张以后，血液也不会立刻停止流动，动脉仍然维持着一定压力，这就是低压。你可以把末梢的小动脉想成血流经过的通道，通道收窄，血液往前流动的阻力增大，就可能使低压升高。但低压也受到心率、大动脉弹性等因素影响，不是只由小血管决定。\n有些中青年人长期紧张、睡眠不足，交感神经持续兴奋，可能同时出现血管收缩和心率加快，这些变化会影响低压。不过，不能因此把所有低压高都当成焦虑，也不能觉得只要放松下来，就一定不需要治疗。\n说到这里，你可能更关心：知道这些区别以后，生活上到底怎么改？首先要明确，不论哪个数字高，控制体重、减少盐摄入、规律运动和改善睡眠，都是共同的基础，只是每个人需要重点解决的问题不同。\n比如已经超重的人，减重有助于降压，但不能把“减一公斤降多少”当成对自己的保证。饮食可以合理安排鱼、蔬菜、全谷物和适量坚果，同时关注血脂、血糖，需要治疗时按医嘱处理，而不是只盯着血压表。\n盐也要算全天总量，尽量少于5克，酱油、腌菜和加工食品中的盐都包括在内。含钾低钠盐可以是部分人的选择，但并不适合所有人。肾功能异常、血钾偏高，或者使用可能升高血钾药物的人，不能自行更换，应该先询问医生。即使换了低钠盐，也不代表可以随便多放。\n如果你的突出问题是经常熬夜、精神紧绷，就要给作息和压力管理留出位置。尽量保持规律、充足的睡眠，通常可以争取每晚7～8小时，也要关注醒来后是否真正得到休息。运动从身体能够承受的强度开始，散步、太极、瑜伽都可以作为选择，但不是低压高的人只能做这些，更不需要靠突然剧烈运动来降压。\n咖啡、浓茶、功能饮料也要留意，尤其喝后容易心悸、心率加快的人，应减少摄入。至于是不是需要控制心率、用什么药，不能只凭低压高来决定，更不能自己找药把心跳压慢。\n最后，判断血压问题，需要看规范测量后的持续情况。按我国常用的诊室标准，反复测得高压达到140毫米汞柱或以上，就需要评估是否存在高血压；不能拿一次读数直接确诊，家庭测量的判断标准也有所不同。\n高压和低压都值得关注，持续升高都可能增加心脑血管和肾脏损害风险。理解机制，是为了更有针对性地配合治疗，不是自己对号入座。把血压记录带给医生，结合身体情况制定方案，生活调整和必要的药物治疗要一起做。\n", "source": "本地DOCX；已核对候选记录MD5", "error": "", "recomputedScore": 0.1366}, {"messageId": 225541, "title": "血压高是身体在“自救”，所以不能降？", "recordedScore": 0.1339, "body": "血压高是身体在“自救”，所以不能降？\n第一段（0:00–1:00）\n大家好，我是云鹏医生。\n门诊上经常有患者跟我说：“血压高，是身体为了保证脏器供血才升上去的。我要是把血压降下来，大脑、心脏不就缺血了吗？”\n这话听起来有一定的道理。血液要流到全身，确实需要压力。但这里面有一个关键的区别：血液流动需要压力，不等于压力越高，供血就越好。\n您可以把血管想象成水管。水管被捏紧了，水要挤过去，管壁承受的压力确实会升高。但这时候流到末端的水，是更多了还是更少了？压力高，很多时候恰恰说明血管阻力大、血流不顺畅，而不是供血更充足。\n所以，不能从“血压高”直接倒推出“身体在自救、不能降”。\n第二段（1:00–2:00）\n那为什么血压会高？原因很多。心脏泵血的力量、血管的弹性、体内的水分和盐分、神经和激素的调节，都在起作用。不是只有“缺不缺血”这一个开关。\n而且，身体确实有自我调节的能力。某个部位需要更多血，局部血管可以扩张。但这些调节不是万能的，也不能用来解释所有长期高血压。\n真正需要担心的是另一件事：血压长期偏高，本身就在损伤器官。心脏每次泵血都要克服更大的阻力，血管壁一直承受过高的压力。时间久了，心、脑、肾都可能出问题。\n所以，问题不是“该不该降”，而是降哪一部分、降到什么程度。\n第三段（2:00–3:00）\n这里要讲清楚一个概念：降压，不是把血压越降越低。 我们要降的是“过高的那一部分”。\n有些降压药，是让收缩的血管放松，血液通过的阻力减小了，维持循环就不需要原来那么高的压力。还有些药，帮助排出多余的钠和水，也是从影响血压的环节入手，不是简单地减少器官需要的血液。\n当然，如果降得太快、太低，确实可能让人不舒服。老年人、脑血管狭窄的患者，尤其需要个体化的目标。这就是为什么医生要结合年龄、血管情况和耐受程度来定方案，而不是给所有人同一个数字目标。\n第四段（3:00–4:00）\n那怎么判断降得合不合适？\n如果您吃药以后头晕，尤其是站起来时眼前发黑，很可能就是血压偏低了，需要尽快找医生复诊，调整降压药的剂量、种类。\n血压高多数情况下并不是身体的“保护机制”，它是一个需要被管理的风险。对于高血压来讲，该降的降，该稳的稳，该调的调。我是云鹏医生，下期见。", "source": "来源文本消息全文（保留原消息，不自动认定为有效稿件）", "error": "", "recomputedScore": 0.1339}, {"messageId": 229093, "title": "云鹏kp11 ZY 高压不高，低压却有90多，到底要不要吃药？", "recordedScore": 0.1322, "body": "封面：低压高怎么办\n标题：高压不高，低压却有90多，到底要不要吃药？\n#抖出健康知识宝藏#健康科普进行时#稳压护心#夜间高血压#血压管理\n高压正常，低压90多，身体又没什么不舒服，很多人看到这个数字很焦虑，这算高血压吗？为什么偏偏是低压高？该怎么把它降下来？\n先回答你最关心的：低压单独高，也可能是高血压，不用等两个数一起升高。但偶尔量到一次90多，还不能直接下结论，要在安静休息后规范测量，看它是不是持续偏高。\n按照诊室标准，没有服降压药的情况下，非同日三次规范测量，低压都达到90毫米汞柱，即使高压不到140，也符合高血压的诊断条件。如果是在家量，连续几天的平均低压达到85，就值得让医生评估，不能照搬诊室的界值。\n那为什么上面的数还好，下面的数却高了？咱们先把高压、低压分清楚。\n心脏收缩，把血液往外送，动脉里的压力升上去，这时候测到的是高压。心脏放松了，血液也没停，大动脉会靠弹性回缩，继续推着血液往前走，这时候的压力就是低压。\n血液往前走，得经过很多小血管。如果这些小血管比较紧，阻力变大，低压就容易升高。所以不是说你年轻、大血管弹性不错，低压就肯定不会高。\n尤其三四十岁的人，白天工作忙，一坐就是一天，晚上还舍不得睡，吃饭口味又重，肚子慢慢大起来。这些因素都可能让血压不好控制，压力大、睡眠不足也可能让交感神经更兴奋，心跳加快、血管收缩。\n不过，不能一查出低压高，就全归到熬夜和紧张上。如果睡觉打鼾很响，还会憋气，或者血压一直不好控制，也要让医生看看有没有其他原因。\n知道了这些，再说怎么降，就不只是盯着药了。\n先看看吃饭。你可能觉得自己很清淡，早上白粥配咸菜，中午面条拌点酱，没吃什么油腻的。可这些东西油不一定多，盐却不少。钠吃多了，身体更容易留住水分，也会影响血压。\n每天食盐总量尽量不超过5克，算的是一天所有来源，不只是炒菜那一勺。已经放了酱油、蚝油，盐就少放点；咸菜、腌肉、加工食品，也别顿顿都有。\n然后是活动。整天坐着的人，不用一下开始长跑，可以先走10～20分钟，适应以后慢慢加，争取每周累计150分钟左右的中等强度运动。快走、骑车、游泳都可以，量力而行，运动前后留些热身和放松的时间。\n如果体重超标，减下来也有帮助。尤其男性腰围达到90厘米、女性达到85厘米，要关注腹型肥胖。但不是每瘦一公斤，低压就固定降一个点，要看自己的变化。\n烟尽量戒掉，酒能不喝就不喝。喝酒后觉得脸热、身体放松，并不代表血压得到了长期控制。睡眠也尽量规律些，别白天硬撑、晚上继续熬。\n那这些都做了，还用不用吃药？\n如果刚发现低压90出头，医生评估后认为整体风险较低，可能先让你调整生活，同时记录血压，到约定时间复查。不是没症状就不用药，也不是回家观察就再也不管了。\n如果调整了一段时间仍然高，或者一开始就明显升高，又或者已经有冠心病、肾脏损伤等情况，就需要及时评估药物治疗。具体选哪种、吃多少，由医生结合身体情况决定。\n所以低压高了，先弄清是不是持续升高，再看哪些因素能改、需不需要配合药物。把血压记录带去复诊，比每天盯着一次90多的读数猜来猜去，更容易找到适合你的办法。", "source": "本地DOCX；已核对候选记录MD5", "error": "", "recomputedScore": 0.1322}, {"messageId": 202626, "title": "脚本三：血压降了，为什么还要做这么多检查？", "recordedScore": 0.1297, "body": "脚本三：血压降了，为什么还要做这么多检查？\n第一段（0:00–1:00）\n大家好，我是云鹏医生。\n很多高血压的朋友，药吃了，血压也降下来了。然后我跟他说：“还需要查一下心脏、颈动脉、肾脏。”他往往会有疑问：“血压都正常了，还查这些干什么？”\n这个问题特别真实。今天我就想跟您聊清楚：血压正常，为什么不代表“万事大吉”？过去那些年偏高的血压，有没有已经在器官上留下痕迹，靠一个血压计是看不出来的。\n\n第二段（1:00–2:00）\n我们先讲一下什么叫“靶器官损害”。\n长期血压高，就像一根水管常年承受偏高的水压。管壁会变厚、变硬，下游的“设备”也会受影响。在身体里，最常被牵连的三个地方是：心脏、血管和肾脏。\n心脏长期超负荷泵血，心肌会变厚，这叫左心室肥厚。一项汇总分析显示，在高血压人群中，左心室肥厚的患病率大约是36.5%。它不是靠感觉能发现的，需要心脏超声来看。\n颈动脉是全身血管的一个“窗口”。颈动脉超声能看到有没有斑块、血管有没有狭窄。高血压本身就会增加动脉粥样硬化的风险。\n肾脏里有大量细小血管，长期高压会损伤它们。早期可能没有任何感觉，但尿液里可能已经出现了微量白蛋白。\n第三段（2:00–3:00）\n那查这些，到底有什么用？\n用处在于：它决定了您的治疗目标应该到什么程度，以及除了降压之外，还需要做什么。\n2024年欧洲心脏病学会的高血压指南和2025年美国心脏病学会的指南，都把*高血压介导的靶器官损害评估作为风险分层的重要一步。也就是说，同样是血压降到130/80，一个没有靶器官损害的人，和一个已经有左心室肥厚或颈动脉斑块的人，后续的管理策略是不一样的。\n比如颈动脉超声发现斑块，医生可能会更重视降脂治疗；心脏超声发现左心室肥厚，医生在选择降压药时会考虑那些对逆转肥厚有帮助的药物类别。检查是为了让治疗更有针对性。\n第四段（3:00–4:00）\n当然，也不是所有人都需要把所有检查反复做一遍。查哪些、多久查一次，要根据您的血压水平、病程长短、合并疾病来决定。\n但有一条原则是清楚的：血压数字只告诉您“压力控制得怎么样”，靶器官评估才告诉您“过去那些年，身体有没有为此买单”。把这两件事放在一起，医生才能给您一个真正完整的方案。\n别让“血压正常”这四个字，成为您不再复查的理由。我是云鹏医生，下期见。", "source": "来源文本消息全文（保留原消息，不自动认定为有效稿件）", "error": "", "recomputedScore": 0.1297}], "unavailableCount": 1, "matchStatus": "needs_review", "unavailableReasons": ["document_identity_parameters_missing"]}, "result": "待核对"}, {"id": "241746", "doctor": "云鹏", "time": "2026-11-06 23:45:42", "group": "需要处理", "action": "evidence_only", "reason": "同一作品两段（60.209秒＋29.7秒），医生241747已确认；整体关联仍未完成。", "verdict": "同一作品两段（6 ，不能将这条消息直接计为一个失败任务，也不能把最高分候选当成已确认归属。"], "history": [], "sync": {"text": "本条未新增状态历史，不要求重复写回。", "records": [], "attention": false}, "windows": ["243067", "241748", "229090", "225544"], "media": {"fileVerified": true, "videoPresent": true, "download": "已下载", "seconds": 64.58, "matchStatus": "needs_review", "qualifyingCount": 0, "sampleSeconds": 64.575, "candidateCount": 5, "best": [{"title": "科普脚本", "score": 0.7248, "taskRef": "4ae12393", "messageId": 241748}, {"title": "云鹏kp12 ZY 血压高却不难受，为什么还要降压？", "score": 0.1624, "taskRef": "1fa34829", "messageId": 229090}, {"title": "血压一会儿130，一会儿110，到底该信哪个？答案可能不是“多量几次”", "score": 0.1584, "taskRef": "fc78fabb", "messageId": 225544}]}, "comparison": {"capturedAt": "2026-11-10T12:00:02+08:00", "transcript": "大家好，我是云鹏医生。在家量血压，很多人拿一百四九十毫米汞柱作为正常的标准，其实是不对的。二零二五版国家基层高血压防治管理指南写的很清楚，家庭安静状态下的血压平均值达到一百三十五。 的八十五毫米汞柱就达到高血压的诊断标准了。注意，这里说的呢是平均值，不是一次的测量结果。怎么算平均值呢？就是连续测五到七天，早晚各一次，每次测两到三遍，把所有的数字呢平均起来。如果实在测。 不了那么久，至少也要测三天十二个点的血压数字。所以，如果您在家里反复测出血压在一百三十五、二十五毫米汞柱以上，建议带着记录去找医生就诊。家庭血压的标准本来就比诊室血压低一点，别因为。 用错了尺子，把该重视的信号遗漏过去。", "seconds": 64.575, "stop": "video_end", "basis": "最新匹配缓存候选", "documents": [{"messageId": 225544, "title": "血压一会儿130，一会儿110，到底该信哪个？答案可能不是“多量几次”", "recordedScore": 0.1584, "body": "血压一会儿130，一会儿110，到底该信哪个？答案可能不是“多量几次”\n第一段（0:00–1:00）\n大家好，我是云鹏医生。\n您量血压的时候，是不是也遇到过：刚量完130，再测一次，变成110了。到底该信哪个？\n很多人的第一反应是：“那我多量几遍，总能找到准的那个。”但如果您一边量一边说话，坐姿在变、手臂位置在变，量得再多，也没法比较。\n血压本来就不是一个固定不动的数字。我们要做的，不是找一个“永远不变的值”，而是尽量在相同的条件下测，看一段时间的整体情况。\n第二段（1:00–2:00）\n先说设备。家用优先选经过准确性验证的上臂式电子血压计，袖带大小要合适。腕式电子血压计更容易受位置影响，普通手表的读数不能代替规范测量。\n设备对了，也别刚坐下就去测血压。测量前30分钟，避免运动、吸烟、饮酒、咖啡和浓茶，先去排尿，然后安静坐至少5分钟。\n坐姿也有讲究：后背有支撑，双脚平放不跷腿，胳膊放在桌面上，袖带中间大致和心脏同高。手臂垂得太低，读数可能偏高；抬得太高，又可能偏低。\n第三段（2:00–3:00）\n绑袖带时，上臂露出来，不隔衣服，袖带下缘离肘窝约两横指。测的时候不说话，不盯着数字看，正常呼吸。\n第一遍结束后，保持姿势，等至少1分钟再测第二遍，取两次的平均值。如果差别明显，再间隔加测一次。所有结果都留着，不要只记最低的那次。\n初次评估时两边手都测一下；如果确认一侧持续较高，以后固定测这一侧，别今天左手明天右手。\n第四段（3:00–4:00）\n那什么时候该去医院？\n如果刚发现血压偏高，或者正在调药，可以连续测5-7天，早晚各一个时段，每个时段测两遍。家庭规范测量的平均血压，高压达到135，或者低压达到85，就建议带着记录去就诊。\n但有一种情况不能等平均值：如果高压达到或超过180，或者低压达到或超过120，安静复测一次仍然这么高，就要立即联系医生、及时就医。如果还伴有胸痛、呼吸困难、突然麻木无力或说话不清，直接打急救电话。\n130和110该信哪个？先看两次是不是用同样的方法测的。把条件固定下来，比不停地按开始键，更能弄清您的血压到底怎么样。 我是云鹏医生，下期见。", "source": "来源文本消息全文（保留原消息，不自动认定为有效稿件）", "error": "", "recomputedScore": 0.1584}, {"messageId": 225545, "title": "怕降压药“一吃就停不掉”，所以一直不吃？", "recordedScore": 0.1353, "body": "怕降压药“一吃就停不掉”，所以一直不吃？\n第一段（0:00–1:00）\n大家好，我是云鹏医生。\n门诊上经常遇到这样的朋友：降压药已经开回家了，放在抽屉里，一直没开始吃。问他为什么，他说：“我怕吃上以后，就得吃一辈子。”\n我特别理解这种担心。但今天我想跟您说一句可能有点扎心的话：您怕的是“被药绑住”，但真正一直在那里损伤您身体的，是高血压本身。\n第二段（1:00–2:00）\n先把一件事说清楚：降压药没有成瘾性。2024年《中国高血压防治指南》明确指出，临床常用降压药不存在成瘾机制，停药后没有心理渴求、烦躁心慌这类戒断反应。\n那为什么吃药以后血压正常了，一停又高？不是因为身体“离不开药”，是因为高血压这个病一直还在。血压降下来，说明药在起作用；停药后血压回升，说明原来的问题没有被“治愈”，只是被控制住了。\n这就像戴眼镜。戴上看得清，摘下来又模糊——不是眼睛被眼镜“绑住”了，是近视本身还在。\n第三段（2:00–3:00）\n当然，也不是说开始吃药，以后就永远一个剂量、一成不变。\n后面怎么调整，要看血压记录和身体情况，由医生判断。有人需要调整药量，有人需要换方案。但能不能调、什么时候调，不能靠某一天的读数自己决定，更不能突然停掉。尤其是某些类型的降压药，骤然停用可能引起血压反跳，风险更大。\n开始吃药和以后能不能停药，是两件事。不能因为担心第二件，就一直不处理第一件。\n第四段（3:00–4:00）\n还有一点很重要：别等出事了才开始。\n长期高血压增加心、脑、肾受损的风险，这个过程不一定让您有明显感觉。“头不晕”不等于“没问题”，难不难受和血压控制得好不好，不能画等号。\n如果您也是药拿回家却一直没吃，不妨把“我怕以后停不掉”这句话直接说给医生听。先弄清楚现在为什么需要用药、怎么吃、什么时候复查。至于后面是否需要长期服药，让身体情况和血压变化来回答。\n我是云鹏医生，下期见。", "source": "来源文本消息全文（保留原消息，不自动认定为有效稿件）", "error": "", "recomputedScore": 0.1353}, {"messageId": 202626, "title": "脚本三：血压降了，为什么还要做这么多检查？", "recordedScore": 0.1241, "body": "脚本三：血压降了，为什么还要做这么多检查？\n第一段（0:00–1:00）\n大家好，我是云鹏医生。\n很多高血压的朋友，药吃了，血压也降下来了。然后我跟他说：“还需要查一下心脏、颈动脉、肾脏。”他往往会有疑问：“血压都正常了，还查这些干什么？”\n这个问题特别真实。今天我就想跟您聊清楚：血压正常，为什么不代表“万事大吉”？过去那些年偏高的血压，有没有已经在器官上留下痕迹，靠一个血压计是看不出来的。\n\n第二段（1:00–2:00）\n我们先讲一下什么叫“靶器官损害”。\n长期血压高，就像一根水管常年承受偏高的水压。管壁会变厚、变硬，下游的“设备”也会受影响。在身体里，最常被牵连的三个地方是：心脏、血管和肾脏。\n心脏长期超负荷泵血，心肌会变厚，这叫左心室肥厚。一项汇总分析显示，在高血压人群中，左心室肥厚的患病率大约是36.5%。它不是靠感觉能发现的，需要心脏超声来看。\n颈动脉是全身血管的一个“窗口”。颈动脉超声能看到有没有斑块、血管有没有狭窄。高血压本身就会增加动脉粥样硬化的风险。\n肾脏里有大量细小血管，长期高压会损伤它们。早期可能没有任何感觉，但尿液里可能已经出现了微量白蛋白。\n第三段（2:00–3:00）\n那查这些，到底有什么用？\n用处在于：它决定了您的治疗目标应该到什么程度，以及除了降压之外，还需要做什么。\n2024年欧洲心脏病学会的高血压指南和2025年美国心脏病学会的指南，都把*高血压介导的靶器官损害评估作为风险分层的重要一步。也就是说，同样是血压降到130/80，一个没有靶器官损害的人，和一个已经有左心室肥厚或颈动脉斑块的人，后续的管理策略是不一样的。\n比如颈动脉超声发现斑块，医生可能会更重视降脂治疗；心脏超声发现左心室肥厚，医生在选择降压药时会考虑那些对逆转肥厚有帮助的药物类别。检查是为了让治疗更有针对性。\n第四段（3:00–4:00）\n当然，也不是所有人都需要把所有检查反复做一遍。查哪些、多久查一次，要根据您的血压水平、病程长短、合并疾病来决定。\n但有一条原则是清楚的：血压数字只告诉您“压力控制得怎么样”，靶器官评估才告诉您“过去那些年，身体有没有为此买单”。把这两件事放在一起，医生才能给您一个真正完整的方案。\n别让“血压正常”这四个字，成为您不再复查的理由。我是云鹏医生，下期见。", "source": "来源文本消息全文（保留原消息，不自动认定为有效稿件）", "error": "", "recomputedScore": 0.1241}, {"messageId": 202625, "title": "脚本一：吃他汀，这几件事要留意", "recordedScore": 0.1188, "body": "脚本一：吃他汀，这几件事要留意\n第一段（0:00–1:00）\n大家好，我是云鹏医生。\n门诊上，很多吃他汀的朋友最担心的是伤肝伤肾。每次复查，转氨酶稍微升高一点，就很紧张，甚至自行停药。\n我今天想跟您说一句可能有点意外的话：吃他汀真正容易“出事”的地方，往往不在肝功能报告单上，而在您每天吃进去的东西里，在您同时吃的其他药里。\n注意，我不是说肝功能不用看。我是说，有些雷区比转氨酶升高更容易被忽略，而且一旦踩中，后果缺更严重。\n今天我就把吃他汀时最容易被忽略的几件事，一件一件跟您聊清楚。\n\n第二段（1:00–2:00）\n第一件事：有一种水果，真的不能和他汀“同桌”。\n西柚，也叫葡萄柚。它本身是好水果，但它里面有一种成分，会抑制身体里负责分解他汀的酶，导致他汀分解变慢，血液里的药物浓度就会升高。\n血药浓度一高，肌肉损伤的风险就上来了。有资料显示，西柚可以让洛伐他汀的血药浓度升高15倍，横纹肌溶解的风险明显增加。\n这里有一个关键点：受影响最大的是辛伐他汀和洛伐他汀。如果您吃的是阿托伐他汀，也需要注意；但普伐他汀、瑞舒伐他汀受影响相对小得多。\n所以不是让您把所有水果都戒了，而是西柚这一类，吃他汀期间最好避开。哪怕间隔几个小时，也不一定安全。\n\n第三段（2:00–3:00）\n第二件事：如果您同时吃降压药，要留意“两条路”的问题。\n很多朋友是血脂、血压一起高，他汀和降压药一起吃。他汀要靠肝脏里的“代谢通道”来降解，如果降压药也走同一条通路，两种药挤在一起，肝脏的负担就重了，药物在体内的浓度也会变得不稳定。\n所以医生在开药时，会有意识地错开药物的代谢通道。比如有些沙坦类降压药，像阿利沙坦酯，不经过肝脏的他汀代谢通道，而是通过肠道水解产生活性成分，从机制上减少了和他汀“冲突”的机会。\n但具体您该用哪种他汀，一定要让医生根据您的肝肾功能和合并用药来决定，不能自己道听途说。\n\n第四段（3:00–4:00）\n第三件事：短效他汀和长效他汀，吃的时间不一样。\n很多人听过“他汀都得晚上吃”，其实不是。辛伐他汀、洛伐他汀、普伐他汀这类短效的药物，半衰期短，晚上睡前吃更贴合肝脏夜间合成胆固醇的高峰。而阿托伐他汀、瑞舒伐他汀是长效的，药效管一整天，早上或晚上固定一个时间吃都行。\n\n比“几点吃药”更重要的是：固定时间，别今天早上明天晚上。\n最后，刚开始吃他汀或者调整剂量后的前三个月，记得复查肝功能和肌酸激酶。如果出现不明原因的大腿、小腿酸痛、乏力，需要及时到医院就诊。\n他汀是一个帮我们压低未来心梗、脑梗风险的工具。避开该避的，盯住该盯的，大多数人可以长期、安全地获益。我是云鹏医生，下期见。", "source": "来源文本消息全文（保留原消息，不自动认定为有效稿件）", "error": "", "recomputedScore": 0.1188}, {"messageId": 205954, "title": "第一段（0:00–1:00）", "recordedScore": 0.1165, "body": "第一段（0:00–1:00）\n\n大家好，我是云鹏医生。\n\n门诊上经常遇到三四十岁的朋友，高压一百二挺正常，低压却到了九十五、九十八。他们常问：“医生，我血压没事吧？不用吃药吧？”我以前会说“再观察观察”，现在我会多问一句：“低压高多久了？”\n\n因为这几年有个很重要的变化：年轻人低压高，不再被当成“扛得住”的良性现象了。2026年心血管权威期刊上的一项研究，随访了近两万四千人17年。结果发现：青年时期有单纯舒张期高血压的人，心血管疾病风险升高36%，心衰风险升高69%，而且约三分之一会进展成高压、低压都高。\n\n今天我就跟您聊聊：低压高意味着什么，为什么不能“再等等”，以及生活上最该改变的是什么。\n\n第二段（1:00–2:00）\n\n我们先弄明白，低压是怎么来的。\n\n心脏收缩喷射血液，形成高压；心脏舒张时，大动脉靠弹性推血，维持的压力就是低压。\n\n高压高，多是大血管变硬了；而低压高，问题出在更细的小血管上——它们持续收缩，血液往前流阻力增大了。\n\n为什么小血管一直“紧绷”？最常见的原因是交感神经持续兴奋。像熬夜、压力大、久坐、肥胖，让身体总处在“随时要战斗”的状态。小血管收缩，心率偏快，低压就高了。\n\n所以低压高不是凭空来的，是身体在用数字告诉您：血管调控已经出了问题，只是还没到高压升上去的时候。\n\n第三段（2:00–3:00）\n\n那为什么不能“再等等”？\n\n因为对50岁以下的人，低压对心血管风险的预测价值，其实比高压更强。有分析显示，低压每升高10毫米汞柱，心脑血管死亡风险大约翻一倍。您觉得“只是低压高一点”，但血管已经在承受持续偏高的压力，不会因为您没感觉就停下来。\n\n当然，听到这您别紧张，不是说低压高就得立马吃药。2024年欧洲指南指出，年轻人单纯低压高，暂时先不用药是可以的。但前提是，您得死死盯住它。如果不通过生活方式干预，它很容易慢慢演变成双高。\n\n所以真正该做的，是从现在开始，认真做一件能把低压降下来的事。\n\n第四段（3:00–4:00）\n\n这件事，就是规律的有氧运动。\n\n2026年的一项研究显示：有氧运动可以降低24小时舒张压约2.76毫米汞柱，有氧加抗阻的联合训练可以降低约3.94毫米汞柱。数字看似不大，但它是24小时动态血压，意味着全天都在起效。\n\n具体怎么做？每周至少150分钟中等强度有氧运动，快走、慢跑、游泳都行。什么叫中等强度？运动时能说话，但不能唱歌。平时不运动的，从每天快走20分钟开始，比猛练更可持续。\n\n如果体重也超标，减重同样重要。有研究显示，体重每减轻1公斤，舒张压平均下降约1毫米汞柱。\n\n第五段（4:00–4:30）\n\n最后说句实在话。\n\n低压高，最怕两种态度：一是“高压正常就没事”，一直拖；二是“听说低压高要吃药”，自己跑去买别人的药吃。\n\n该不该用药，要看您整体的心血管风险。如果反复测量低压持续在90以上，或者已经出现微量白蛋白尿、左心室肥厚等靶器官损害，那就不是“再等等”的事了，应该找医生评估用药。\n\n但在那之前，您手里马上能做的事就是：动起来，把体重往下降一点。低压高，是血管在提前向您报警。我是云鹏医生，下期见。", "source": "来源文本消息全文（保留原消息，不自动认定为有效稿件）", "error": "", "recomputedScore": 0.1165}], "unavailableCount": 23, "matchStatus": "needs_review", "unavailableReasons": ["native_message_xml_unavailable"]}, "result": "待核对"}, {"id": "243068", "doctor": "云鹏", "time": "2026-11-09 09:55:12", "group": "需要处理", "action": "needs_review", "reason": "当前七状态自动流程只处理明确的科普作品", "verdict": "当前七状态自动流程只处理明确的科普作品", "task": "4ae12393", "title": "在家量血压，别再用医院的140/90来判断了", "local": "文案确认中", "remote": "未绑定／未取得", "recordId": null, "hold": "", "enabled": false, "notes": ["源文档241748实际含五篇脚本，却被登记到一个任务；仅修改作品类型不能解决多作品身份混用。", "程序原始结果：当前七状态自动流程只处理明确的科普作品。", "本次只读核验：本地视频文件通过校验。阻塞在后续作品／稿件匹配，不是该原件未下载。", "匹配缓存：达标候选1个，采样61.138秒，结果matched；最高3个候选分数列在下方。", "当前身份目录中的发送人职责：医生；职责目录是本次读取值，不冒充历史身份快照。"], "history": [], "sync": {"text": "本条未新增状态历史，不要求重复写回。", "records": [], "attention": false}, "windows": ["243068", "241748", "229092", "202627"], "media": {"fileVerified": true, "videoPresent": true, "download": "已下载", "seconds": 61.14, "matchStatus": "matched", "qualifyingCount": 1, "sampleSeconds": 61.138, "candidateCount": 5, "best": [{"title": "科普脚本", "score": 0.8472, "taskRef": "4ae12393", "messageId": 241748}, {"title": "云鹏kp14 ZY 明明吃得挺清淡，为什么盐还是没少吃？", "score": 0.1944, "taskRef": "592bfe4a", "messageId": 229092}, {"title": "脚本四：降压药伤肾？你可能担心反了", "score": 0.1842, "taskRef": "", "messageId": 202627}]}, "comparison": {"capturedAt": "2026-11-10T12:00:02+08:00", "transcript": "大家好，少吃盐这句话呢您可能听了很多年，它到底能降多少血压呢？很多人心里没数。一项汇总了三十四项随机对照试验的荟萃分析发现，把每天的盐摄入量从九点四克降到四点四克。 也就是每天少吃五克盐，高血压患者的收缩压平均下降了四点二毫米汞柱，舒张压呢也有下降。四毫米汞柱听起来不大，但是它是我们每天每顿饭积累出来的，而且这个效果呢它不需要吃药，不需要花钱。 只需要在厨房里做对一件事，盐罐子里少舀一勺盐，酱油蚝油少倒一点，咸菜腊肉别顿顿上桌。当然血压已经明显偏高的人呢，该用药还是要用药，限盐是辅助治疗，不能取代降压药。 ", "seconds": 61.138, "stop": "video_end", "basis": "最新匹配缓存候选", "documents": [{"messageId": 241748, "title": "科普脚本", "recordedScore": 0.8472, "body": "视频一：家庭血压\n建议核心： 在家量血压，标准是135/85，不是140/90\n标题： 在家量血压，别再用医院的140/90来判断了\n正文：\n在家量血压，很多人拿140/90mmHg以下当作正常的标准。其实不对。\n2025版国家基层高血压防治管理指南写得很清楚：家庭安静状态下血压的平均值达到135/85mmHg，就达到高血压的诊断标准了。注意，是“平均值”，不是某一次。\n怎么算平均值？连续测5到7天，早晚各一次，每次测2到3遍，把所有数字平均起来。如果实在测不了那么久，至少也要3天、12个数字。\n所以，如果您在家反复测出来135/85以上，建议带着记录去找医生就诊。家庭血压的标准，本来就比诊室血压低一点。别因为用错了尺子，把该重视的信号遗漏过去。\n\n视频二：限盐\n建议核心： 每天少吃5克盐，收缩压平均能降4个毫米汞柱\n标题： 炒菜少放盐，到底能降多少血压？有个具体数字\n正文：\n“少吃盐”这句话，您可能听了很多年。但它到底能降多少血压，很多人心里没数。\n一项汇总了34项随机对照试验的荟萃分析发现：把每天的盐摄入量从9.4克降到4.4克，也就是每天少吃5克盐，高血压患者的收缩压平均下降了4.2毫米汞柱。舒张压也有下降。\n4个毫米汞柱听起来不大，但它是每天的每顿饭累积出来的。而且这个效果，不需要吃药，不需要花钱，只需要在厨房里做一件事：盐罐子少舀一勺，酱油蚝油少倒一点，咸菜腊肉别顿顿上桌。\n当然，血压已经明显偏高的人，该用药还是要用药。限盐是辅助治疗，不能替代降压药。\n\n视频三：血糖偏高\n建议核心： 糖尿病前期是“可逆窗口”，生活方式干预能让心血管风险降一半\n标题： 体检血糖偏高，还没到糖尿病——这可能是您最后的机会\n正文：\n体检发现血糖偏高，医生说“还没到糖尿病”。很多人松一口气，然后……就没有然后了。\n但中国的大庆研究告诉我们一件事：糖尿病前期，是一个可以往回走的窗口。 大庆研究纳入540例糖尿病前期患者，经过6年生活方式干预，13.3%的人血糖回到了正常。在之后24年的随访里，这些达到缓解的人，全因死亡和心脑血管事件风险降低了40%。\n更关键的是另一组数据：糖尿病前期如果达到缓解，心血管死亡或心衰住院风险可以降低53%。\n怎么干预？不是饿肚子。大庆研究做的是饮食调整加规律运动。少喝含糖饮料，主食里换一部分粗粮，饭后走一走。血糖偏高不是“等明年体检再说”的事，是现在动手，还来得及的事。\n\n视频四：他汀与斑块\n建议核心： 有斑块的人，LDL-C降到1.8以下，斑块才“稳”\n标题： 体检发现颈动脉斑块，血脂要降到多少才算“稳”？\n正文：\n体检报告上写着“颈动脉斑块”，很多人第一反应是：血脂高一点，但也没感觉，要不要管？\n我的答案是必须要管！斑块真正的危险，不在于它慢慢变大，而在于破裂。斑块一旦破裂，血栓几分钟之内就能把血管堵死。\n2025版美国心脏病协会的血脂指南给了一个明确的数字：对于高血压合并肥胖、或者已经有动脉粥样硬化性心血管疾病高风险的人，低密度脂蛋白胆固醇要降到1.8 mmol/L以下，这是稳定斑块的基本要求。2026年的综述也指出，LDL-C降到1.8以下，已经进入血管壁的“坏胆固醇”才有可能逆转回血液。\n所以，有斑块的人别只盯着“有没有症状”。把LDL-C压到1.8以下，才是让斑块“稳住”的关键一步。该吃他汀的，别因为怕副作用就自己停了。\n\n视频五：单纯低压高\n建议核心： 高压正常、低压90多，每周150分钟有氧运动是首选干预\n标题： 高压正常，低压90多，最该先做的不是吃药\n正文：\n三四十岁的人，高压120，低压95。很多人问我：“医生，要不要吃药？”\n我的回答是：先别急着吃药，但也不能不管。这种情况叫“单纯舒张期高血压”，背后最常见的问题是外周血管阻力升高、交感神经持续兴奋。熬夜、久坐、压力大、体重超标，都在推高舒张压（俗称的低压）。\n那我们最该先做什么？是规律的有氧运动。 2024版中国高血压防治指南建议：单纯低压高的人，每周至少150分钟中等强度有氧运动，快走、慢跑、游泳、骑车都行，再配合每周2到3次抗阻训练。\n什么叫中等强度？运动的时候有轻微的喘气，例如能说话，但不能唱歌。\n低压高不是“年轻扛得住”的良性现象，它是血管在提前给您报警信号。在它变成高压、低压“双高”之前动起来，比等高压也升高了再吃药，要划算得多。", "source": "本地DOCX；已核对候选记录MD5", "error": "", "recomputedScore": 0.8818}, {"messageId": 229092, "title": "云鹏kp14 ZY 明明吃得挺清淡，为什么盐还是没少吃？", "recordedScore": 0.1944, "body": "封面：盐少了血压还高\n标题：明明吃得挺清淡，为什么盐还是没少吃？\n#抖出健康知识宝藏 #健康科普进行时#稳压护心#夜间高血压 #减盐生活\n“我炒菜都不敢放盐了，怎么血压还是高？”你先想想，早上那碗白粥，是不是配了咸菜？中午没怎么吃肉，却拿酱拌了饭？吃着挺清淡，盐可能一点没少。\n当然，血压没控制好，不一定全是吃饭的问题。但这些容易漏掉的地方，确实值得看看。\n比如每天盐不超过5克，不是说盐罐子里少舀一点就够了。酱油、蚝油、咸菜、香肠里的盐，也得算进去。钠吃多了，身体容易留住更多水分，血压就可能更难控制。所以买包装食品时，可以看看营养成分表里的钠，同类食品选低一点的。\n那咸的少吃，喝点甜的呢？奶茶、可乐这些，喝的时候不觉得撑，热量却不少。经常这么喝，体重上去了，也不利于控压。口渴就喝白水，想吃水果就直接吃，别把果汁当水灌。\n饭菜也是一样，不用因为高血压就把肉全戒了，但肥肉、油炸食品别总上桌。原来炸着吃的，换成蒸着吃；炖菜少放些油，吃起来照样有滋味。\n还有那杯酒。喝完脸热、身体松快，不代表血压控制好了。长期饮酒可能让血压更难管理，红酒也不能拿来“养血管”，能不喝就不喝。\n最后看看主食。米饭、面条可以吃，但别顿顿只吃精米白面。拿三分之一换成燕麦、糙米，或者玉米、红薯。注意是替换，不是一碗饭吃完，再加一根玉米。\n你不用一下把饭吃成水煮菜，先从每天最常吃的那口咸菜、最常喝的那杯饮料改起。药照医嘱用，血压照常测，饮食是在帮治疗的忙，不是拿来替代治疗的。\n", "source": "本地DOCX；已核对候选记录MD5", "error": "", "recomputedScore": 0.1455}, {"messageId": 202627, "title": "脚本四：降压药伤肾？你可能担心反了", "recordedScore": 0.1842, "body": "脚本四：降压药伤肾？你可能担心反了\n\n第一段（0:00–1:00）\n大家好，我是云鹏医生。\n门诊上，一说要开始吃降压药，很多人的第一反应不是“吃了血压能稳”，而是“这药会不会伤肝伤肾？吃久了会不会耐药？是不是一吃就停不下来了？”\n我特别理解这些担心。但我今天想跟您说一句可能有点扎心的话：真正出问题恰恰是因为这些没根据的担心，导致该吃的药没吃，最后肾脏出了问题。\n关于降压药的误区，今天挑最要紧的几个，跟您聊清楚。\n第二段（1:00–2:00）\n先说“伤肾”。\n高血压本身，才是伤肾的主力之一。长期血压偏高，肾脏里那些细小的血管会持续受损，过滤功能会慢慢下降。而普利类、沙坦类降压药，在合适的人群中，恰恰有保护肾脏的作用——它们降低肾小球内的压力，减少蛋白的漏出。\n当然，任何药物都有需要监测的指标。用这类药，医生会定期看您的血肌酐和血钾。如果指标有变化，医生会判断原因、调整方案。不吃药带来的肾脏风险，比规范用药要大得多。\n\n第三段（2:00–3:00）\n\n再说“耐药”。\n“一种药吃几年就失效了，所以要定期换着吃”，这个说法在降压药里不成立。降压药不存在抗生素那种“耐药”的概念。\n如果原来的方案控制不住了，首先要看的是：有没有漏服？体重有没有变化？盐是不是吃多了？有没有新出现的合并疾病或药物相互作用？而不是简单地归结为“药吃久了没用了”。如果确实需要调整，医生可以改剂量、联合另一种药，但没必要仅仅因为“用了很多年”就换药。\n\n第四段（3:00–4:00）\n最后说“停不下来”。\n需要长期吃药，通常是因为血压需要持续控制，不是药物让身体产生了依赖。有一项综述汇总了停用降压药的研究，发现停药后1年成功率大约40%，2年成功率大约27%。也就是说，确实有少数人可以在医生指导下成功减量或停药，但比例并不高，而且需要监测血压。\n更常见的情况是：吃药后血压正常了，就以为“病好了”，自己把药停了。结果血压反弹，甚至比原来更高。血压正常，恰恰说明是降压药在起作用。\n您真正该关心的，不是“我吃了多久”，而是血压有没有持续达标、有没有不舒服、复查指标怎么样。把这些记录下来，和医生一起来判断，才是对自己最负责的做法。我是云鹏医生，下期见。", "source": "来源文本消息全文（保留原消息，不自动认定为有效稿件）", "error": "", "recomputedScore": 0.1364}, {"messageId": 225544, "title": "血压一会儿130，一会儿110，到底该信哪个？答案可能不是“多量几次”", "recordedScore": 0.1806, "body": "血压一会儿130，一会儿110，到底该信哪个？答案可能不是“多量几次”\n第一段（0:00–1:00）\n大家好，我是云鹏医生。\n您量血压的时候，是不是也遇到过：刚量完130，再测一次，变成110了。到底该信哪个？\n很多人的第一反应是：“那我多量几遍，总能找到准的那个。”但如果您一边量一边说话，坐姿在变、手臂位置在变，量得再多，也没法比较。\n血压本来就不是一个固定不动的数字。我们要做的，不是找一个“永远不变的值”，而是尽量在相同的条件下测，看一段时间的整体情况。\n第二段（1:00–2:00）\n先说设备。家用优先选经过准确性验证的上臂式电子血压计，袖带大小要合适。腕式电子血压计更容易受位置影响，普通手表的读数不能代替规范测量。\n设备对了，也别刚坐下就去测血压。测量前30分钟，避免运动、吸烟、饮酒、咖啡和浓茶，先去排尿，然后安静坐至少5分钟。\n坐姿也有讲究：后背有支撑，双脚平放不跷腿，胳膊放在桌面上，袖带中间大致和心脏同高。手臂垂得太低，读数可能偏高；抬得太高，又可能偏低。\n第三段（2:00–3:00）\n绑袖带时，上臂露出来，不隔衣服，袖带下缘离肘窝约两横指。测的时候不说话，不盯着数字看，正常呼吸。\n第一遍结束后，保持姿势，等至少1分钟再测第二遍，取两次的平均值。如果差别明显，再间隔加测一次。所有结果都留着，不要只记最低的那次。\n初次评估时两边手都测一下；如果确认一侧持续较高，以后固定测这一侧，别今天左手明天右手。\n第四段（3:00–4:00）\n那什么时候该去医院？\n如果刚发现血压偏高，或者正在调药，可以连续测5-7天，早晚各一个时段，每个时段测两遍。家庭规范测量的平均血压，高压达到135，或者低压达到85，就建议带着记录去就诊。\n但有一种情况不能等平均值：如果高压达到或超过180，或者低压达到或超过120，安静复测一次仍然这么高，就要立即联系医生、及时就医。如果还伴有胸痛、呼吸困难、突然麻木无力或说话不清，直接打急救电话。\n130和110该信哪个？先看两次是不是用同样的方法测的。把条件固定下来，比不停地按开始键，更能弄清您的血压到底怎么样。 我是云鹏医生，下期见。", "source": "来源文本消息全文（保留原消息，不自动认定为有效稿件）", "error": "", "recomputedScore": 0.1164}, {"messageId": 193798, "title": "云鹏kp4 ZY 降压药会伤肾、会耐药？这五个误区要分清", "recordedScore": 0.1528, "body": "封面：降压误区别再信\n标题：降压药会伤肾、会耐药？这五个误区要分清\n#抖出健康知识宝藏 #健康科普进行时#稳压护心#夜间高血压 #安全用药\n关于高血压的5个误区，今天一条视频给你讲清楚。\n发现血压高以后，有人觉得，这病不能彻底治好，以后的生活是不是就毁了？也有人正好相反，觉得自己不疼不痒，根本没必要管。这两种想法看着不一样，其实都把治疗的目的弄偏了：我们要做的，是长期控制血压，减少心脑血管和肾脏受到的损害，而不是只用“能不能断根”来判断治疗有没有价值。\n先说能不能恢复正常。部分血压升高较轻、整体风险较低的人，通过减重、减少盐摄入、调整饮食和规律运动，确实可能在不用药的情况下把血压控制住。但这叫控制良好，不能直接等同于永久治愈。如果生活习惯又回到从前，血压仍可能再次升高，所以后续监测不能省。\n如果生活调整以后血压仍然偏高，或者一开始就已经达到需要用药的程度，就应当接受药物治疗。医生也会根据情况排查有没有其他疾病引起血压升高。不是所有人都能先等三个月到半年，更不能为了证明自己能靠运动降压，一直拖着不处理。\n那身体没感觉，为什么还需要治疗？因为高血压造成的损害，不一定马上表现为头晕、心慌。你可能照常工作、吃饭、睡觉，但持续偏高的压力仍可能影响血管和重要器官。有没有症状，不能代替血压测量，更不能代替风险评估。及时干预，是为了减少以后发生并发症的可能，不是等难受了再把症状压下去。\n说到用药，很多人最担心的是：“第一颗吃下去，是不是这辈子都停不了了？”需要长期服药，通常是因为血压需要持续控制，不是药让身体产生了依赖。部分人在体重、生活方式和血压状况改善以后，医生可能考虑调整甚至减少药物，但能不能停，必须结合持续监测来判断。\n尤其要分清，服药以后血压正常，很可能恰恰说明药正在起作用。如果把这个结果理解成病已经好了，自己停药，血压就可能重新升高。因此，不要为了避免长期服药而拒绝开始，也不要因为几次读数不错就自行结束治疗。\n另一个常见顾虑是，药吃久了会不会把肝肾吃坏？药物确实可能有不良反应，这一点不需要回避，但也不能因此把所有降压药都当成伤肝伤肾的东西。医生会根据你的肝肾功能、合并疾病和其他用药，选择合适的方案，并安排必要的复查。\n像普利类、沙坦类药物，在符合适应证的人群中，还能帮助保护肾脏，但使用时需要关注肾功能和血钾等变化。出现不适或化验异常，要让医生判断原因、调整治疗，不能自行认定一定是药物伤害，也不能硬撑着不反馈。\n最后，有人觉得同一种药吃几年就会“耐药”，所以应该定期轮换，或者一开始故意选效果弱的，给以后留余地。降压治疗并不是这样安排的。药物选择要看能否安全、稳定地达到目标，而不是先把血压控制得差一点，留着以后再处理。\n如果原来的方案不够用了，需要检查是否漏服、体重和饮食有没有变化，以及病情是否发生改变，不能只归结为药吃久了失效。确实需要调整时，医生可以改变剂量或者联合其他药物；如果效果稳定、耐受良好，也不必仅仅因为用了多年就换药。\n所以，你真正需要关注的，不是自己吃药多久了，而是血压是否持续达标、治疗有没有不适，以及复查结果怎样。把这些情况记录下来，和医生一起调整，才能既不耽误治疗，也不盲目用药。\n", "source": "本地DOCX；已核对候选记录MD5", "error": "", "recomputedScore": 0.1232}], "unavailableCount": 1, "matchStatus": "matched", "unavailableReasons": ["document_identity_parameters_missing"]}, "result": "待核对"}, {"id": "243069", "doctor": "云鹏", "time": "2026-11-09 09:55:12", "group": "需要处理", "action": "needs_review", "reason": "当前七状态自动流程只处理明确的科普作品", "verdict": "当前七状态自动流程只处理明确的科普作品", "task": "4ae12393", "title": "在家量血压，别再用医院的140/90来判断了", "local": "文案确认中", "remote": "未绑定／未取得", "recordId": null, "hold": "", "enabled": false, "notes": ["源文档241748实际含五篇脚本，却被登记到一个任务；仅修改作品类型不能解决多作品身份混用。", "程序原始结果：当前七状态自动流程只处理明确的科普作品。", "本次只读核验：本地视频文件通过校验。阻塞在后续作品／稿件匹配，不是该原件未下载。", "匹配缓存：达标候选1个，采样20秒，结果matched；最高3个候选分数列在下方。", " 一场“谁更危险”的比赛。您真正该问医生的，不是“先管哪一个”，而是：我的“三高”分别该控制到什么水平？现在还有哪一项没达标？\n需要优先处理的先处理，但其他存在的问题也要一起管理。降好了一个，缺漏掉另外两个，等于白忙一场。\n我是云鹏医生，下期见。", "source": "来源文本消息全文（保留原消息，不自动认定为有效稿件）", "error": "", "recomputedScore": 0.1391}, {"messageId": 205954, "title": "第一段（0:00–1:00）", "recordedScore": 0.1291, "body": "第一段（0:00–1:00）\n\n大家好，我是云鹏医生。\n\n门诊上经常遇到三四十岁的朋友，高压一百二挺正常，低压却到了九十五、九十八。他们常问：“医生，我血压没事吧？不用吃药吧？”我以前会说“再观察观察”，现在我会多问一句：“低压高多久了？”\n\n因为这几年有个很重要的变化：年轻人低压高，不再被当成“扛得住”的良性现象了。2026年心血管权威期刊上的一项研究，随访了近两万四千人17年。结果发现：青年时期有单纯舒张期高血压的人，心血管疾病风险升高36%，心衰风险升高69%，而且约三分之一会进展成高压、低压都高。\n\n今天我就跟您聊聊：低压高意味着什么，为什么不能“再等等”，以及生活上最该改变的是什么。\n\n第二段（1:00–2:00）\n\n我们先弄明白，低压是怎么来的。\n\n心脏收缩喷射血液，形成高压；心脏舒张时，大动脉靠弹性推血，维持的压力就是低压。\n\n高压高，多是大血管变硬了；而低压高，问题出在更细的小血管上——它们持续收缩，血液往前流阻力增大了。\n\n为什么小血管一直“紧绷”？最常见的原因是交感神经持续兴奋。像熬夜、压力大、久坐、肥胖，让身体总处在“随时要战斗”的状态。小血管收缩，心率偏快，低压就高了。\n\n所以低压高不是凭空来的，是身体在用数字告诉您：血管调控已经出了问题，只是还没到高压升上去的时候。\n\n第三段（2:00–3:00）\n\n那为什么不能“再等等”？\n\n因为对50岁以下的人，低压对心血管风险的预测价值，其实比高压更强。有分析显示，低压每升高10毫米汞柱，心脑血管死亡风险大约翻一倍。您觉得“只是低压高一点”，但血管已经在承受持续偏高的压力，不会因为您没感觉就停下来。\n\n当然，听到这您别紧张，不是说低压高就得立马吃药。2024年欧洲指南指出，年轻人单纯低压高，暂时先不用药是可以的。但前提是，您得死死盯住它。如果不通过生活方式干预，它很容易慢慢演变成双高。\n\n所以真正该做的，是从现在开始，认真做一件能把低压降下来的事。\n\n第四段（3:00–4:00）\n\n这件事，就是规律的有氧运动。\n\n2026年的一项研究显示：有氧运动可以降低24小时舒张压约2.76毫米汞柱，有氧加抗阻的联合训练可以降低约3.94毫米汞柱。数字看似不大，但它是24小时动态血压，意味着全天都在起效。\n\n具体怎么做？每周至少150分钟中等强度有氧运动，快走、慢跑、游泳都行。什么叫中等强度？运动时能说话，但不能唱歌。平时不运动的，从每天快走20分钟开始，比猛练更可持续。\n\n如果体重也超标，减重同样重要。有研究显示，体重每减轻1公斤，舒张压平均下降约1毫米汞柱。\n\n第五段（4:00–4:30）\n\n最后说句实在话。\n\n低压高，最怕两种态度：一是“高压正常就没事”，一直拖；二是“听说低压高要吃药”，自己跑去买别人的药吃。\n\n该不该用药，要看您整体的心血管风险。如果反复测量低压持续在90以上，或者已经出现微量白蛋白尿、左心室肥厚等靶器官损害，那就不是“再等等”的事了，应该找医生评估用药。\n\n但在那之前，您手里马上能做的事就是：动起来，把体重往下降一点。低压高，是血管在提前向您报警。我是云鹏医生，下期见。", "source": "来源文本消息全文（保留原消息，不自动认定为有效稿件）", "error": "", "recomputedScore": 0.1291}, {"messageId": 202625, "title": "脚本一：吃他汀，这几件事要留意", "recordedScore": 0.0987, "body": "脚本一：吃他汀，这几件事要留意\n第一段（0:00–1:00）\n大家好，我是云鹏医生。\n门诊上，很多吃他汀的朋友最担心的是伤肝伤肾。每次复查，转氨酶稍微升高一点，就很紧张，甚至自行停药。\n我今天想跟您说一句可能有点意外的话：吃他汀真正容易“出事”的地方，往往不在肝功能报告单上，而在您每天吃进去的东西里，在您同时吃的其他药里。\n注意，我不是说肝功能不用看。我是说，有些雷区比转氨酶升高更容易被忽略，而且一旦踩中，后果缺更严重。\n今天我就把吃他汀时最容易被忽略的几件事，一件一件跟您聊清楚。\n\n第二段（1:00–2:00）\n第一件事：有一种水果，真的不能和他汀“同桌”。\n西柚，也叫葡萄柚。它本身是好水果，但它里面有一种成分，会抑制身体里负责分解他汀的酶，导致他汀分解变慢，血液里的药物浓度就会升高。\n血药浓度一高，肌肉损伤的风险就上来了。有资料显示，西柚可以让洛伐他汀的血药浓度升高15倍，横纹肌溶解的风险明显增加。\n这里有一个关键点：受影响最大的是辛伐他汀和洛伐他汀。如果您吃的是阿托伐他汀，也需要注意；但普伐他汀、瑞舒伐他汀受影响相对小得多。\n所以不是让您把所有水果都戒了，而是西柚这一类，吃他汀期间最好避开。哪怕间隔几个小时，也不一定安全。\n\n第三段（2:00–3:00）\n第二件事：如果您同时吃降压药，要留意“两条路”的问题。\n很多朋友是血脂、血压一起高，他汀和降压药一起吃。他汀要靠肝脏里的“代谢通道”来降解，如果降压药也走同一条通路，两种药挤在一起，肝脏的负担就重了，药物在体内的浓度也会变得不稳定。\n所以医生在开药时，会有意识地错开药物的代谢通道。比如有些沙坦类降压药，像阿利沙坦酯，不经过肝脏的他汀代谢通道，而是通过肠道水解产生活性成分，从机制上减少了和他汀“冲突”的机会。\n但具体您该用哪种他汀，一定要让医生根据您的肝肾功能和合并用药来决定，不能自己道听途说。\n\n第四段（3:00–4:00）\n第三件事：短效他汀和长效他汀，吃的时间不一样。\n很多人听过“他汀都得晚上吃”，其实不是。辛伐他汀、洛伐他汀、普伐他汀这类短效的药物，半衰期短，晚上睡前吃更贴合肝脏夜间合成胆固醇的高峰。而阿托伐他汀、瑞舒伐他汀是长效的，药效管一整天，早上或晚上固定一个时间吃都行。\n\n比“几点吃药”更重要的是：固定时间，别今天早上明天晚上。\n最后，刚开始吃他汀或者调整剂量后的前三个月，记得复查肝功能和肌酸激酶。如果出现不明原因的大腿、小腿酸痛、乏力，需要及时到医院就诊。\n他汀是一个帮我们压低未来心梗、脑梗风险的工具。避开该避的，盯住该盯的，大多数人可以长期、安全地获益。我是云鹏医生，下期见。", "source": "来源文本消息全文（保留原消息，不自动认定为有效稿件）", "error": "", "recomputedScore": 0.0987}, {"messageId": 225545, "title": "怕降压药“一吃就停不掉”，所以一直不吃？", "recordedScore": 0.0972, "body": "怕降压药“一吃就停不掉”，所以一直不吃？\n第一段（0:00–1:00）\n大家好，我是云鹏医生。\n门诊上经常遇到这样的朋友：降压药已经开回家了，放在抽屉里，一直没开始吃。问他为什么，他说：“我怕吃上以后，就得吃一辈子。”\n我特别理解这种担心。但今天我想跟您说一句可能有点扎心的话：您怕的是“被药绑住”，但真正一直在那里损伤您身体的，是高血压本身。\n第二段（1:00–2:00）\n先把一件事说清楚：降压药没有成瘾性。2024年《中国高血压防治指南》明确指出，临床常用降压药不存在成瘾机制，停药后没有心理渴求、烦躁心慌这类戒断反应。\n那为什么吃药以后血压正常了，一停又高？不是因为身体“离不开药”，是因为高血压这个病一直还在。血压降下来，说明药在起作用；停药后血压回升，说明原来的问题没有被“治愈”，只是被控制住了。\n这就像戴眼镜。戴上看得清，摘下来又模糊——不是眼睛被眼镜“绑住”了，是近视本身还在。\n第三段（2:00–3:00）\n当然，也不是说开始吃药，以后就永远一个剂量、一成不变。\n后面怎么调整，要看血压记录和身体情况，由医生判断。有人需要调整药量，有人需要换方案。但能不能调、什么时候调，不能靠某一天的读数自己决定，更不能突然停掉。尤其是某些类型的降压药，骤然停用可能引起血压反跳，风险更大。\n开始吃药和以后能不能停药，是两件事。不能因为担心第二件，就一直不处理第一件。\n第四段（3:00–4:00）\n还有一点很重要：别等出事了才开始。\n长期高血压增加心、脑、肾受损的风险，这个过程不一定让您有明显感觉。“头不晕”不等于“没问题”，难不难受和血压控制得好不好，不能画等号。\n如果您也是药拿回家却一直没吃，不妨把“我怕以后停不掉”这句话直接说给医生听。先弄清楚现在为什么需要用药、怎么吃、什么时候复查。至于后面是否需要长期服药，让身体情况和血压变化来回答。\n我是云鹏医生，下期见。", "source": "来源文本消息全文（保留原消息，不自动认定为有效稿件）", "error": "", "recomputedScore": 0.0972}, {"messageId": 202627, "title": "脚本四：降压药伤肾？你可能担心反了", "recordedScore": 0.0903, "body": "脚本四：降压药伤肾？你可能担心反了\n\n第一段（0:00–1:00）\n大家好，我是云鹏医生。\n门诊上，一说要开始吃降压药，很多人的第一反应不是“吃了血压能稳”，而是“这药会不会伤肝伤肾？吃久了会不会耐药？是不是一吃就停不下来了？”\n我特别理解这些担心。但我今天想跟您说一句可能有点扎心的话：真正出问题恰恰是因为这些没根据的担心，导致该吃的药没吃，最后肾脏出了问题。\n关于降压药的误区，今天挑最要紧的几个，跟您聊清楚。\n第二段（1:00–2:00）\n先说“伤肾”。\n高血压本身，才是伤肾的主力之一。长期血压偏高，肾脏里那些细小的血管会持续受损，过滤功能会慢慢下降。而普利类、沙坦类降压药，在合适的人群中，恰恰有保护肾脏的作用——它们降低肾小球内的压力，减少蛋白的漏出。\n当然，任何药物都有需要监测的指标。用这类药，医生会定期看您的血肌酐和血钾。如果指标有变化，医生会判断原因、调整方案。不吃药带来的肾脏风险，比规范用药要大得多。\n\n第三段（2:00–3:00）\n\n再说“耐药”。\n“一种药吃几年就失效了，所以要定期换着吃”，这个说法在降压药里不成立。降压药不存在抗生素那种“耐药”的概念。\n如果原来的方案控制不住了，首先要看的是：有没有漏服？体重有没有变化？盐是不是吃多了？有没有新出现的合并疾病或药物相互作用？而不是简单地归结为“药吃久了没用了”。如果确实需要调整，医生可以改剂量、联合另一种药，但没必要仅仅因为“用了很多年”就换药。\n\n第四段（3:00–4:00）\n最后说“停不下来”。\n需要长期吃药，通常是因为血压需要持续控制，不是药物让身体产生了依赖。有一项综述汇总了停用降压药的研究，发现停药后1年成功率大约40%，2年成功率大约27%。也就是说，确实有少数人可以在医生指导下成功减量或停药，但比例并不高，而且需要监测血压。\n更常见的情况是：吃药后血压正常了，就以为“病好了”，自己把药停了。结果血压反弹，甚至比原来更高。血压正常，恰恰说明是降压药在起作用。\n您真正该关心的，不是“我吃了多久”，而是血压有没有持续达标、有没有不舒服、复查指标怎么样。把这些记录下来，和医生一起来判断，才是对自己最负责的做法。我是云鹏医生，下期见。", "source": "来源文本消息全文（保留原消息，不自动认定为有效稿件）", "error": "", "recomputedScore": 0.0903}], "unavailableCount": 23, "matchStatus": "needs_review", "unavailableReasons": ["document_identity_parameters_missing", "original_checksum_not_found"]}, "result": "待核对"}, {"id": "243070", "doctor": "云鹏", "time": "2026-11-09 09:55:13", "group": "需要处理", "action": "needs_review", "reason": "当前七状态自动流程只处理明确的科普作品", "verdict": "当前七状态自动流程只处理明确的科普作品", "task": "4ae12393", "title": "在家量血压，别再用医院的140/90来判断了", "local": "文案确认中", "remote": "未绑定／未取得", "recordId": null, "hold": "", "enabled": false, "notes": ["源文档241748实际含五篇脚本，却被登记到一个任务；仅修改作品类型不能解决多作品身份混用。", "程序原始结果：当前七状态自动流程只处理明确的科普作品。", "本次只读核验：本地视频文件通过校验。阻塞在后续作品／稿件匹配，不是该原件未下载。", "匹配缓存：达标候选1个，采样71.541秒，结果matched；最高3个候选分数列在下方。", "当前身份目录中的发送人职责：医生；职责目录是本次读取值，不冒充历史身份快照。"], "history": [], "sync": {"text": "本条未新增状态历史，不要求重复写回。", "records": [], "attention": false}, "windows": ["243070", "241748", "225543", "202626"], "media": {"fileVerified": true, "videoPresent": true, "download": "已下载", "seconds": 71.54, "matchStatus": "matched", "qualifyingCount": 1, "sampleSeconds": 71.541, "candidateCount": 5, "best": [{"title": "科普脚本", "score": 0.8272, "taskRef": "4ae12393", "messageId": 241748}, {"title": "血压、血脂、血糖都高，先管哪一个？", "score": 0.1813, "taskRef": "fc78fabb", "messageId": 225543}, {"title": "脚本三：血压降了，为什么还要做这么多检查？", "score": 0.1728, "taskRef": "", "messageId": 202626}]}, "comparison": {"capturedAt": "2026-11-10T12:00:03+08:00", "transcript": "体检报告上写着颈动脉斑块，很多人第一反应是自己也没什么感觉不舒服，可以不用管它。但是我的答案呢是必须要重视。斑块真正的危险不在于它慢慢变大，而是在于破裂。一旦斑块破裂，血栓几分钟。 之内就可以把血管堵死。二零二五年美国心脏病协会的血脂指南给出了一个明确的数字，对于高血压合并肥胖，或者是已有动脉粥样硬化性心血管疾病高风险的人，低密度脂蛋白胆固醇要降到一点八毫摩每升以下。 这是稳定斑块的基本要求。二零二六年的一项综述也指出呢，低密度脂蛋白胆固醇降到一点八以下，才有可能使进入血管壁的坏胆固醇逆转回血液。所以有斑块的人呢，别只盯着有没有症状，把低密度脂蛋白胆固醇。 压到一点八以下，才是让斑块稳定住的关键一步。该吃他汀的就一定要吃，别因为怕副作用就自己随便停药。", "seconds": 71.541, "stop": "video_end", "basis": "最新匹配缓存候选", "documents": [{"messageId": 241748, "title": "科普脚本", "recordedScore": 0.8272, "body": "视频一：家庭血压\n建议核心： 在家量血压，标准是135/85，不是140/90\n标题： 在家量血压，别再用医院的140/90来判断了\n正文：\n在家量血压，很多人拿140/90mmHg以下当作正常的标准。其实不对。\n2025版国家基层高血压防治管理指南写得很清楚：家庭安静状态下血压的平均值达到135/85mmHg，就达到高血压的诊断标准了。注意，是“平均值”，不是某一次。\n怎么算平均值？连续测5到7天，早晚各一次，每次测2到3遍，把所有数字平均起来。如果实在测不了那么久，至少也要3天、12个数字。\n所以，如果您在家反复测出来135/85以上，建议带着记录去找医生就诊。家庭血压的标准，本来就比诊室血压低一点。别因为用错了尺子，把该重视的信号遗漏过去。\n\n视频二：限盐\n建议核心： 每天少吃5克盐，收缩压平均能降4个毫米汞柱\n标题： 炒菜少放盐，到底能降多少血压？有个具体数字\n正文：\n“少吃盐”这句话，您可能听了很多年。但它到底能降多少血压，很多人心里没数。\n一项汇总了34项随机对照试验的荟萃分析发现：把每天的盐摄入量从9.4克降到4.4克，也就是每天少吃5克盐，高血压患者的收缩压平均下降了4.2毫米汞柱。舒张压也有下降。\n4个毫米汞柱听起来不大，但它是每天的每顿饭累积出来的。而且这个效果，不需要吃药，不需要花钱，只需要在厨房里做一件事：盐罐子少舀一勺，酱油蚝油少倒一点，咸菜腊肉别顿顿上桌。\n当然，血压已经明显偏高的人，该用药还是要用药。限盐是辅助治疗，不能替代降压药。\n\n视频三：血糖偏高\n建议核心： 糖尿病前期是“可逆窗口”，生活方式干预能让心血管风险降一半\n标题： 体检血糖偏高，还没到糖尿病——这可能是您最后的机会\n正文：\n体检发现血糖偏高，医生说“还没到糖尿病”。很多人松一口气，然后……就没有然后了。\n但中国的大庆研究告诉我们一件事：糖尿病前期，是一个可以往回走的窗口。 大庆研究纳入540例糖尿病前期患者，经过6年生活方式干预，13.3%的人血糖回到了正常。在之后24年的随访里，这些达到缓解的人，全因死亡和心脑血管事件风险降低了40%。\n更关键的是另一组数据：糖尿病前期如果达到缓解，心血管死亡或心衰住院风险可以降低53%。\n怎么干预？不是饿肚子。大庆研究做的是饮食调整加规律运动。少喝含糖饮料，主食里换一部分粗粮，饭后走一走。血糖偏高不是“等明年体检再说”的事，是现在动手，还来得及的事。\n\n视频四：他汀与斑块\n建议核心： 有斑块的人，LDL-C降到1.8以下，斑块才“稳”\n标题： 体检发现颈动脉斑块，血脂要降到多少才算“稳”？\n正文：\n体检报告上写着“颈动脉斑块”，很多人第一反应是：血脂高一点，但也没感觉，要不要管？\n我的答案是必须要管！斑块真正的危险，不在于它慢慢变大，而在于破裂。斑块一旦破裂，血栓几分钟之内就能把血管堵死。\n2025版美国心脏病协会的血脂指南给了一个明确的数字：对于高血压合并肥胖、或者已经有动脉粥样硬化性心血管疾病高风险的人，低密度脂蛋白胆固醇要降到1.8 mmol/L以下，这是稳定斑块的基本要求。2026年的综述也指出，LDL-C降到1.8以下，已经进入血管壁的“坏胆固醇”才有可能逆转回血液。\n所以，有斑块的人别只盯着“有没有症状”。把LDL-C压到1.8以下，才是让斑块“稳住”的关键一步。该吃他汀的，别因为怕副作用就自己停了。\n\n视频五：单纯低压高\n建议核心： 高压正常、低压90多，每周150分钟有氧运动是首选干预\n标题： 高压正常，低压90多，最该先做的不是吃药\n正文：\n三四十岁的人，高压120，低压95。很多人问我：“医生，要不要吃药？”\n我的回答是：先别急着吃药，但也不能不管。这种情况叫“单纯舒张期高血压”，背后最常见的问题是外周血管阻力升高、交感神经持续兴奋。熬夜、久坐、压力大、体重超标，都在推高舒张压（俗称的低压）。\n那我们最该先做什么？是规律的有氧运动。 2024版中国高血压防治指南建议：单纯低压高的人，每周至少150分钟中等强度有氧运动，快走、慢跑、游泳、骑车都行，再配合每周2到3次抗阻训练。\n什么叫中等强度？运动的时候有轻微的喘气，例如能说话，但不能唱歌。\n低压高不是“年轻扛得住”的良性现象，它是血管在提前给您报警信号。在它变成高压、低压“双高”之前动起来，比等高压也升高了再吃药，要划算得多。", "source": "本地DOCX；已核对候选记录MD5", "error": "", "recomputedScore": 0.7583}, {"messageId": 225543, "title": "血压、血脂、血糖都高，先管哪一个？", "recordedScore": 0.1813, "body": "血压、血脂、血糖都高，先管哪一个？\n第一段（0:00–1:00）\n大家好，我是云鹏医生。\n门诊上经常有人问我：“血压、血脂、血糖都高，到底哪个最危险？我能不能先把最危险的那个管好，另外两个先放一放？”\n这个想法特别自然。但今天我想跟您说一句可能有点意外的话：三高之间，很难排出一个对所有人都适用的“危险顺序”。 更关键的是，分开管和一起管，结果完全不一样。\n有一项香港的研究，追踪了一批“三高”的患者。血糖、血压、血脂三项都达标的人，和三项都不达标的人相比，心血管事件风险降低了55%。这不是某一个指标在起作用，是一起达标带来的结果。\n第二段（1:00–2:00）\n为什么不能只挑一个管？\n因为这三件事，伤的是同一套系统——血管。\n血压高，是血管壁长期承受过高的压力，心脏要更使劲泵血，血管更容易受损。血糖高，伤的是全身的小血管和神经，早期不疼不痒，等有感觉的时候，眼底、肾脏可能已经出了问题。血脂高，尤其是坏胆固醇长期偏高，会促进斑块形成。斑块破裂形成血栓，心梗、脑梗可能就在几分钟之内。\n它们不是三个独立的问题，是三个方向同时推高同一个风险。只关掉其中一个开关，另外两个还在往同一个方向使劲。\n第三段（2:00–3:00）\n那医生该怎么处理？不是“只挑最危险的那一个”，而是看谁最失控、谁最紧迫，先处理，但另外两个也不能丢。\n比如您血糖最近控制得不错，但血压一直高，低密度脂蛋白胆固醇也没降下来。血糖这一项指标的改善值得高兴，但不能因为一个数字变好了，就认为另外两个也跟着安全了。“先处理”不等于“另外两个可以一直不管”。\n日常能做的，其实很多是“一箭三雕”的。少放点盐、少喝含糖饮料、控制食量、规律运动、把体重降一点——这些调整，对这三个指标的改善都有帮助。\n第四段（3:00–4:00）\n所以，三高不是一场“谁更危险”的比赛。您真正该问医生的，不是“先管哪一个”，而是：我的“三高”分别该控制到什么水平？现在还有哪一项没达标？\n需要优先处理的先处理，但其他存在的问题也要一起管理。降好了一个，缺漏掉另外两个，等于白忙一场。\n我是云鹏医生，下期见。", "source": "来源文本消息全文（保留原消息，不自动认定为有效稿件）", "error": "", "recomputedScore": 0.1357}, {"messageId": 202626, "title": "脚本三：血压降了，为什么还要做这么多检查？", "recordedScore": 0.1728, "body": "脚本三：血压降了，为什么还要做这么多检查？\n第一段（0:00–1:00）\n大家好，我是云鹏医生。\n很多高血压的朋友，药吃了，血压也降下来了。然后我跟他说：“还需要查一下心脏、颈动脉、肾脏。”他往往会有疑问：“血压都正常了，还查这些干什么？”\n这个问题特别真实。今天我就想跟您聊清楚：血压正常，为什么不代表“万事大吉”？过去那些年偏高的血压，有没有已经在器官上留下痕迹，靠一个血压计是看不出来的。\n\n第二段（1:00–2:00）\n我们先讲一下什么叫“靶器官损害”。\n长期血压高，就像一根水管常年承受偏高的水压。管壁会变厚、变硬，下游的“设备”也会受影响。在身体里，最常被牵连的三个地方是：心脏、血管和肾脏。\n心脏长期超负荷泵血，心肌会变厚，这叫左心室肥厚。一项汇总分析显示，在高血压人群中，左心室肥厚的患病率大约是36.5%。它不是靠感觉能发现的，需要心脏超声来看。\n颈动脉是全身血管的一个“窗口”。颈动脉超声能看到有没有斑块、血管有没有狭窄。高血压本身就会增加动脉粥样硬化的风险。\n肾脏里有大量细小血管，长期高压会损伤它们。早期可能没有任何感觉，但尿液里可能已经出现了微量白蛋白。\n第三段（2:00–3:00）\n那查这些，到底有什么用？\n用处在于：它决定了您的治疗目标应该到什么程度，以及除了降压之外，还需要做什么。\n2024年欧洲心脏病学会的高血压指南和2025年美国心脏病学会的指南，都把*高血压介导的靶器官损害评估作为风险分层的重要一步。也就是说，同样是血压降到130/80，一个没有靶器官损害的人，和一个已经有左心室肥厚或颈动脉斑块的人，后续的管理策略是不一样的。\n比如颈动脉超声发现斑块，医生可能会更重视降脂治疗；心脏超声发现左心室肥厚，医生在选择降压药时会考虑那些对逆转肥厚有帮助的药物类别。检查是为了让治疗更有针对性。\n第四段（3:00–4:00）\n当然，也不是所有人都需要把所有检查反复做一遍。查哪些、多久查一次，要根据您的血压水平、病程长短、合并疾病来决定。\n但有一条原则是清楚的：血压数字只告诉您“压力控制得怎么样”，靶器官评估才告诉您“过去那些年，身体有没有为此买单”。把这两件事放在一起，医生才能给您一个真正完整的方案。\n别让“血压正常”这四个字，成为您不再复查的理由。我是云鹏医生，下期见。", "source": "来源文本消息全文（保留原消息，不自动认定为有效稿件）", "error": "", "recomputedScore": 0.1252}, {"messageId": 206428, "title": "云鹏kp6 ZY 血压、血脂、血糖都高，究竟哪个更危险？", "recordedScore": 0.1579, "body": "封面：三高先管哪一个\n标题：血压、血脂、血糖都高，究竟哪个更危险？\n#抖出健康知识宝藏 #健康科普进行时 #稳压护心 #夜间高血压 #健康生活\n你说高血压、高血脂、高血糖，这三兄弟哪个最危险，哪个最影响生命呢？你可能觉得，既然都是高，总得有个轻重吧，我先把最危险的那个管好，另外两个能不能放一放？\n这得看你具体高到什么程度，还真不能给所有人排同一个顺序。咱们先看看，它们分别会给身体带来什么影响，你就明白为什么不能只挑一个管了。\n先说血压。心脏每跳一下，都要把血液往外送。如果血管里的压力一直很高，心脏就得更使劲，才能把血泵出去。偶尔多干一点活，和天天这样干，当然不一样。时间长了，心脏可能出现改变，严重时就可能发生心衰。\n血管也一样，长期承受偏高的压力，更容易受损。所以高血压不仅与脑出血有关，也会增加脑梗、肾脏损伤以及主动脉夹层等问题的风险。但不是说血压一高，血管马上就会破，而是一直控制不好，出问题的可能性会增加。\n那高血糖呢？很多人觉得，我血糖高了好几年，也照样吃饭、上班，好像没受什么影响。可血糖造成的影响，有些并不会马上让你难受。\n你比如说眼睛，眼底的小血管已经出现变化，早期可能还看得清东西。等到视力明显受影响，再去检查，病变可能已经比较重了。肾脏也是，有时已经开始漏白蛋白，人却不疼不肿，得通过尿液检查才能发现。\n还有脚麻这件事。听着好像只是感觉不舒服，但如果神经受损，脚的感觉变迟钝，就可能连受伤都不知道。鞋子磨破了皮，没有及时处理，再碰上腿脚供血不好，伤口就不容易长好。严重的糖尿病足，确实可能需要截肢。\n不过，这些都是可能发生的并发症，不是得了糖尿病就一定要经历。讲清楚这些，是让你知道为什么要管理血糖，而不是让你提前认定自己以后会怎样。\n说到高血脂，你可能又觉得，这个总该轻一点吧？平时没感觉，化验才知道。问题是，血脂异常的风险，恰恰不能靠感觉来判断。\n尤其是低密度脂蛋白胆固醇长期偏高，会促进动脉粥样硬化斑块形成。斑块长在血管壁里，可能让血管变窄，血液通过就没那么顺畅了。\n而且，不是非要等它把血管慢慢堵满才出事。有些斑块会破裂，随后形成血栓，突然把血流堵住，这就可能引发心梗或者脑梗。所以，“平时不难受”不能作为放着血脂不管的理由。\n你看，这三种问题虽然不完全一样，但很多时候都在影响血管。一个是压力长期偏高，一个可能损伤血管和神经，另一个会促进斑块形成。如果同时出现在一个人身上，就不能分开算账了。\n比如你有糖尿病，最近血糖控制得不错，但血压一直高，低密度脂蛋白胆固醇也没降下来。那血糖这一项确实改善了，可血压、血脂带来的风险还在。不能因为一个数字变好了，就认为其他两个也跟着安全了。\n所以，医生给你安排治疗时，不只是看哪个有箭头，还要看升高多少、持续多久，有没有心脑血管病或肾脏损伤。某一项明显失控，可能需要先处理，但“先处理”不等于另外两项可以一直不管。\n日常也不用把自己弄得太复杂。饭菜少放点盐，含糖饮料少喝，合理控制食量，再把规律运动和体重管理做起来，这些调整往往不只对一个指标有帮助。但也不是油一点不能吃、主食全得戒，还是要吃得均衡。\n如果已经需要药物，就按医嘱治疗，再通过复查看效果。你真正要问医生的，可以是：我这几项分别该控制到什么水平，现在还有哪一项没达标？\n这么一来，三高就不是一场谁更危险的比赛了。需要优先处理的先处理，其他存在的问题也一起管理，才不会降好了一个，又漏掉另外两个。\n", "source": "本地DOCX；已核对候选记录MD5", "error": "", "recomputedScore": 0.1357}, {"messageId": 202627, "title": "脚本四：降压药伤肾？你可能担心反了", "recordedScore": 0.1504, "body": "脚本四：降压药伤肾？你可能担心反了\n\n第一段（0:00–1:00）\n大家好，我是云鹏医生。\n门诊上，一说要开始吃降压药，很多人的第一反应不是“吃了血压能稳”，而是“这药会不会伤肝伤肾？吃久了会不会耐药？是不是一吃就停不下来了？”\n我特别理解这些担心。但我今天想跟您说一句可能有点扎心的话：真正出问题恰恰是因为这些没根据的担心，导致该吃的药没吃，最后肾脏出了问题。\n关于降压药的误区，今天挑最要紧的几个，跟您聊清楚。\n第二段（1:00–2:00）\n先说“伤肾”。\n高血压本身，才是伤肾的主力之一。长期血压偏高，肾脏里那些细小的血管会持续受损，过滤功能会慢慢下降。而普利类、沙坦类降压药，在合适的人群中，恰恰有保护肾脏的作用——它们降低肾小球内的压力，减少蛋白的漏出。\n当然，任何药物都有需要监测的指标。用这类药，医生会定期看您的血肌酐和血钾。如果指标有变化，医生会判断原因、调整方案。不吃药带来的肾脏风险，比规范用药要大得多。\n\n第三段（2:00–3:00）\n\n再说“耐药”。\n“一种药吃几年就失效了，所以要定期换着吃”，这个说法在降压药里不成立。降压药不存在抗生素那种“耐药”的概念。\n如果原来的方案控制不住了，首先要看的是：有没有漏服？体重有没有变化？盐是不是吃多了？有没有新出现的合并疾病或药物相互作用？而不是简单地归结为“药吃久了没用了”。如果确实需要调整，医生可以改剂量、联合另一种药，但没必要仅仅因为“用了很多年”就换药。\n\n第四段（3:00–4:00）\n最后说“停不下来”。\n需要长期吃药，通常是因为血压需要持续控制，不是药物让身体产生了依赖。有一项综述汇总了停用降压药的研究，发现停药后1年成功率大约40%，2年成功率大约27%。也就是说，确实有少数人可以在医生指导下成功减量或停药，但比例并不高，而且需要监测血压。\n更常见的情况是：吃药后血压正常了，就以为“病好了”，自己把药停了。结果血压反弹，甚至比原来更高。血压正常，恰恰说明是降压药在起作用。\n您真正该关心的，不是“我吃了多久”，而是血压有没有持续达标、有没有不舒服、复查指标怎么样。把这些记录下来，和医生一起来判断，才是对自己最负责的做法。我是云鹏医生，下期见。", "source": "来源文本消息全文（保留原消息，不自动认定为有效稿件）", "error": "", "recomputedScore": 0.1254}], "unavailableCount": 1, "matchStatus": "matched", "unavailableReasons": ["document_identity_parameters_missing"]}, "result": "待核对"}, {"id": "243071", "doctor": "云鹏", "time": "202 没数。\n一项汇总了34项随机对照试验的荟萃分析发现：把每天的盐摄入量从9.4克降到4.4克，也就是每天少吃5克盐，高血压患者的收缩压平均下降了4.2毫米汞柱。舒张压也有下降。\n4个毫米汞柱听起来不大，但它是每天的每顿饭累积出来的。而且这个效果，不需要吃药，不需要花钱，只需要在厨房里做一件事：盐罐子少舀一勺，酱油蚝油少倒一点，咸菜腊肉别顿顿上桌。\n当然，血压已经明显偏高的人，该用药还是要用药。限盐是辅助治疗，不能替代降压药。\n\n视频三：血糖偏高\n建议核心： 糖尿病前期是“可逆窗口”，生活方式干预能让心血管风险降一半\n标题： 体检血糖偏高，还没到糖尿病——这可能是您最后的机会\n正文：\n体检发现血糖偏高，医生说“还没到糖尿病”。很多人松一口气，然后……就没有然后了。\n但中国的大庆研究告诉我们一件事：糖尿病前期，是一个可以往回走的窗口。 大庆研究纳入540例糖尿病前期患者，经过6年生活方式干预，13.3%的人血糖回到了正常。在之后24年的随访里，这些达到缓解的人，全因死亡和心脑血管事件风险降低了40%。\n更关键的是另一组数据：糖尿病前期如果达到缓解，心血管死亡或心衰住院风险可以降低53%。\n怎么干预？不是饿肚子。大庆研究做的是饮食调整加规律运动。少喝含糖饮料，主食里换一部分粗粮，饭后走一走。血糖偏高不是“等明年体检再说”的事，是现在动手，还来得及的事。\n\n视频四：他汀与斑块\n建议核心： 有斑块的人，LDL-C降到1.8以下，斑块才“稳”\n标题： 体检发现颈动脉斑块，血脂要降到多少才算“稳”？\n正文：\n体检报告上写着“颈动脉斑块”，很多人第一反应是：血脂高一点，但也没感觉，要不要管？\n我的答案是必须要管！斑块真正的危险，不在于它慢慢变大，而在于破裂。斑块一旦破裂，血栓几分钟之内就能把血管堵死。\n2025版美国心脏病协会的血脂指南给了一个明确的数字：对于高血压合并肥胖、或者已经有动脉粥样硬化性心血管疾病高风险的人，低密度脂蛋白胆固醇要降到1.8 mmol/L以下，这是稳定斑块的基本要求。2026年的综述也指出，LDL-C降到1.8以下，已经进入血管壁的“坏胆固醇”才有可能逆转回血液。\n所以，有斑块的人别只盯着“有没有症状”。把LDL-C压到1.8以下，才是让斑块“稳住”的关键一步。该吃他汀的，别因为怕副作用就自己停了。\n\n视频五：单纯低压高\n建议核心： 高压正常、低压90多，每周150分钟有氧运动是首选干预\n标题： 高压正常，低压90多，最该先做的不是吃药\n正文：\n三四十岁的人，高压120，低压95。很多人问我：“医生，要不要吃药？”\n我的回答是：先别急着吃药，但也不能不管。这种情况叫“单纯舒张期高血压”，背后最常见的问题是外周血管阻力升高、交感神经持续兴奋。熬夜、久坐、压力大、体重超标，都在推高舒张压（俗称的低压）。\n那我们最该先做什么？是规律的有氧运动。 2024版中国高血压防治指南建议：单纯低压高的人，每周至少150分钟中等强度有氧运动，快走、慢跑、游泳、骑车都行，再配合每周2到3次抗阻训练。\n什么叫中等强度？运动的时候有轻微的喘气，例如能说话，但不能唱歌。\n低压高不是“年轻扛得住”的良性现象，它是血管在提前给您报警信号。在它变成高压、低压“双高”之前动起来，比等高压也升高了再吃药，要划算得多。", "source": "本地DOCX；已核对候选记录MD5", "error": "", "recomputedScore": 0.6784}, {"messageId": 205954, "title": "第一段（0:00–1:00）", "recordedScore": 0.2092, "body": "第一段（0:00–1:00）\n\n大家好，我是云鹏医生。\n\n门诊上经常遇到三四十岁的朋友，高压一百二挺正常，低压却到了九十五、九十八。他们常问：“医生，我血压没事吧？不用吃药吧？”我以前会说“再观察观察”，现在我会多问一句：“低压高多久了？”\n\n因为这几年有个很重要的变化：年轻人低压高，不再被当成“扛得住”的良性现象了。2026年心血管权威期刊上的一项研究，随访了近两万四千人17年。结果发现：青年时期有单纯舒张期高血压的人，心血管疾病风险升高36%，心衰风险升高69%，而且约三分之一会进展成高压、低压都高。\n\n今天我就跟您聊聊：低压高意味着什么，为什么不能“再等等”，以及生活上最该改变的是什么。\n\n第二段（1:00–2:00）\n\n我们先弄明白，低压是怎么来的。\n\n心脏收缩喷射血液，形成高压；心脏舒张时，大动脉靠弹性推血，维持的压力就是低压。\n\n高压高，多是大血管变硬了；而低压高，问题出在更细的小血管上——它们持续收缩，血液往前流阻力增大了。\n\n为什么小血管一直“紧绷”？最常见的原因是交感神经持续兴奋。像熬夜、压力大、久坐、肥胖，让身体总处在“随时要战斗”的状态。小血管收缩，心率偏快，低压就高了。\n\n所以低压高不是凭空来的，是身体在用数字告诉您：血管调控已经出了问题，只是还没到高压升上去的时候。\n\n第三段（2:00–3:00）\n\n那为什么不能“再等等”？\n\n因为对50岁以下的人，低压对心血管风险的预测价值，其实比高压更强。有分析显示，低压每升高10毫米汞柱，心脑血管死亡风险大约翻一倍。您觉得“只是低压高一点”，但血管已经在承受持续偏高的压力，不会因为您没感觉就停下来。\n\n当然，听到这您别紧张，不是说低压高就得立马吃药。2024年欧洲指南指出，年轻人单纯低压高，暂时先不用药是可以的。但前提是，您得死死盯住它。如果不通过生活方式干预，它很容易慢慢演变成双高。\n\n所以真正该做的，是从现在开始，认真做一件能把低压降下来的事。\n\n第四段（3:00–4:00）\n\n这件事，就是规律的有氧运动。\n\n2026年的一项研究显示：有氧运动可以降低24小时舒张压约2.76毫米汞柱，有氧加抗阻的联合训练可以降低约3.94毫米汞柱。数字看似不大，但它是24小时动态血压，意味着全天都在起效。\n\n具体怎么做？每周至少150分钟中等强度有氧运动，快走、慢跑、游泳都行。什么叫中等强度？运动时能说话，但不能唱歌。平时不运动的，从每天快走20分钟开始，比猛练更可持续。\n\n如果体重也超标，减重同样重要。有研究显示，体重每减轻1公斤，舒张压平均下降约1毫米汞柱。\n\n第五段（4:00–4:30）\n\n最后说句实在话。\n\n低压高，最怕两种态度：一是“高压正常就没事”，一直拖；二是“听说低压高要吃药”，自己跑去买别人的药吃。\n\n该不该用药，要看您整体的心血管风险。如果反复测量低压持续在90以上，或者已经出现微量白蛋白尿、左心室肥厚等靶器官损害，那就不是“再等等”的事了，应该找医生评估用药。\n\n但在那之前，您手里马上能做的事就是：动起来，把体重往下降一点。低压高，是血管在提前向您报警。我是云鹏医生，下期见。", "source": "来源文本消息全文（保留原消息，不自动认定为有效稿件）", "error": "", "recomputedScore": 0.2092}, {"messageId": 193796, "title": "云鹏kp2 ZY 高压不高，只有低压高，到底该不该管？", "recordedScore": 0.1366, "body": "封面：低压高别忽视\n标题：高压不高，只有低压高，到底该不该管？\n#抖出健康知识宝藏 #健康科普进行时#稳压护心#夜间高血压 #心血管健康\n高压高的人多数是因为大血管变硬了，而低压高呢，多数时候啊是小血管收紧了。那这两种情况呢，虽然都叫高血压，但它根本就不是一回事儿，调理的重点也完全不同，那今天呢，我就和大家讲清楚高压高和低压高的区别，你听明白了以后啊，你就知道你的血压应该怎么调理了。\n先想想心脏把血液往外送的过程。心脏收缩，血液进入动脉，这时候形成的压力高峰，就是收缩压，也就是高压。大动脉有弹性，血液进来时能够适当撑开，缓冲这股压力。如果动脉逐渐变硬，同样一股血流进入，压力就更容易升高。\n这也解释了为什么中老年人更容易出现高压升高。不过，年龄不是唯一因素，肥胖、吸烟、血脂血糖异常等，也可能影响血管健康；吃盐太多，则可能通过水钠潴留等机制推高血压。所以，高压高不能全部归结为年纪大了，更不是到了某个年龄就不用管。\n心脏舒张以后，血液也不会立刻停止流动，动脉仍然维持着一定压力，这就是低压。你可以把末梢的小动脉想成血流经过的通道，通道收窄，血液往前流动的阻力增大，就可能使低压升高。但低压也受到心率、大动脉弹性等因素影响，不是只由小血管决定。\n有些中青年人长期紧张、睡眠不足，交感神经持续兴奋，可能同时出现血管收缩和心率加快，这些变化会影响低压。不过，不能因此把所有低压高都当成焦虑，也不能觉得只要放松下来，就一定不需要治疗。\n说到这里，你可能更关心：知道这些区别以后，生活上到底怎么改？首先要明确，不论哪个数字高，控制体重、减少盐摄入、规律运动和改善睡眠，都是共同的基础，只是每个人需要重点解决的问题不同。\n比如已经超重的人，减重有助于降压，但不能把“减一公斤降多少”当成对自己的保证。饮食可以合理安排鱼、蔬菜、全谷物和适量坚果，同时关注血脂、血糖，需要治疗时按医嘱处理，而不是只盯着血压表。\n盐也要算全天总量，尽量少于5克，酱油、腌菜和加工食品中的盐都包括在内。含钾低钠盐可以是部分人的选择，但并不适合所有人。肾功能异常、血钾偏高，或者使用可能升高血钾药物的人，不能自行更换，应该先询问医生。即使换了低钠盐，也不代表可以随便多放。\n如果你的突出问题是经常熬夜、精神紧绷，就要给作息和压力管理留出位置。尽量保持规律、充足的睡眠，通常可以争取每晚7～8小时，也要关注醒来后是否真正得到休息。运动从身体能够承受的强度开始，散步、太极、瑜伽都可以作为选择，但不是低压高的人只能做这些，更不需要靠突然剧烈运动来降压。\n咖啡、浓茶、功能饮料也要留意，尤其喝后容易心悸、心率加快的人，应减少摄入。至于是不是需要控制心率、用什么药，不能只凭低压高来决定，更不能自己找药把心跳压慢。\n最后，判断血压问题，需要看规范测量后的持续情况。按我国常用的诊室标准，反复测得高压达到140毫米汞柱或以上，就需要评估是否存在高血压；不能拿一次读数直接确诊，家庭测量的判断标准也有所不同。\n高压和低压都值得关注，持续升高都可能增加心脑血管和肾脏损害风险。理解机制，是为了更有针对性地配合治疗，不是自己对号入座。把血压记录带给医生，结合身体情况制定方案，生活调整和必要的药物治疗要一起做。\n", "source": "本地DOCX；已核对候选记录MD5", "error": "", "recomputedScore": 0.1366}, {"messageId": 225541, "title": "血压高是身体在“自救”，所以不能降？", "recordedScore": 0.1339, "body": "血压高是身体在“自救”，所以不能降？\n第一段（0:00–1:00）\n大家好，我是云鹏医生。\n门诊上经常有患者跟我说：“血压高，是身体为了保证脏器供血才升上去的。我要是把血压降下来，大脑、心脏不就缺血了吗？”\n这话听起来有一定的道理。血液要流到全身，确实需要压力。但这里面有一个关键的区别：血液流动需要压力，不等于压力越高，供血就越好。\n您可以把血管想象成水管。水管被捏紧了，水要挤过去，管壁承受的压力确实会升高。但这时候流到末端的水，是更多了还是更少了？压力高，很多时候恰恰说明血管阻力大、血流不顺畅，而不是供血更充足。\n所以，不能从“血压高”直接倒推出“身体在自救、不能降”。\n第二段（1:00–2:00）\n那为什么血压会高？原因很多。心脏泵血的力量、血管的弹性、体内的水分和盐分、神经和激素的调节，都在起作用。不是只有“缺不缺血”这一个开关。\n而且，身体确实有自我调节的能力。某个部位需要更多血，局部血管可以扩张。但这些调节不是万能的，也不能用来解释所有长期高血压。\n真正需要担心的是另一件事：血压长期偏高，本身就在损伤器官。心脏每次泵血都要克服更大的阻力，血管壁一直承受过高的压力。时间久了，心、脑、肾都可能出问题。\n所以，问题不是“该不该降”，而是降哪一部分、降到什么程度。\n第三段（2:00–3:00）\n这里要讲清楚一个概念：降压，不是把血压越降越低。 我们要降的是“过高的那一部分”。\n有些降压药，是让收缩的血管放松，血液通过的阻力减小了，维持循环就不需要原来那么高的压力。还有些药，帮助排出多余的钠和水，也是从影响血压的环节入手，不是简单地减少器官需要的血液。\n当然，如果降得太快、太低，确实可能让人不舒服。老年人、脑血管狭窄的患者，尤其需要个体化的目标。这就是为什么医生要结合年龄、血管情况和耐受程度来定方案，而不是给所有人同一个数字目标。\n第四段（3:00–4:00）\n那怎么判断降得合不合适？\n如果您吃药以后头晕，尤其是站起来时眼前发黑，很可能就是血压偏低了，需要尽快找医生复诊，调整降压药的剂量、种类。\n血压高多数情况下并不是身体的“保护机制”，它是一个需要被管理的风险。对于高血压来讲，该降的降，该稳的稳，该调的调。我是云鹏医生，下期见。", "source": "来源文本消息全文（保留原消息，不自动认定为有效稿件）", "error": "", "recomputedScore": 0.1339}, {"messageId": 229093, "title": "云鹏kp11 ZY 高压不高，低压却有90多，到底要不要吃药？", "recordedScore": 0.1322, "body": "封面：低压高怎么办\n标题：高压不高，低压却有90多，到底要不要吃药？\n#抖出健康知识宝藏#健康科普进行时#稳压护心#夜间高血压#血压管理\n高压正常，低压90多，身体又没什么不舒服，很多人看到这个数字很焦虑，这算高血压吗？为什么偏偏是低压高？该怎么把它降下来？\n先回答你最关心的：低压单独高，也可能是高血压，不用等两个数一起升高。但偶尔量到一次90多，还不能直接下结论，要在安静休息后规范测量，看它是不是持续偏高。\n按照诊室标准，没有服降压药的情况下，非同日三次规范测量，低压都达到90毫米汞柱，即使高压不到140，也符合高血压的诊断条件。如果是在家量，连续几天的平均低压达到85，就值得让医生评估，不能照搬诊室的界值。\n那为什么上面的数还好，下面的数却高了？咱们先把高压、低压分清楚。\n心脏收缩，把血液往外送，动脉里的压力升上去，这时候测到的是高压。心脏放松了，血液也没停，大动脉会靠弹性回缩，继续推着血液往前走，这时候的压力就是低压。\n血液往前走，得经过很多小血管。如果这些小血管比较紧，阻力变大，低压就容易升高。所以不是说你年轻、大血管弹性不错，低压就肯定不会高。\n尤其三四十岁的人，白天工作忙，一坐就是一天，晚上还舍不得睡，吃饭口味又重，肚子慢慢大起来。这些因素都可能让血压不好控制，压力大、睡眠不足也可能让交感神经更兴奋，心跳加快、血管收缩。\n不过，不能一查出低压高，就全归到熬夜和紧张上。如果睡觉打鼾很响，还会憋气，或者血压一直不好控制，也要让医生看看有没有其他原因。\n知道了这些，再说怎么降，就不只是盯着药了。\n先看看吃饭。你可能觉得自己很清淡，早上白粥配咸菜，中午面条拌点酱，没吃什么油腻的。可这些东西油不一定多，盐却不少。钠吃多了，身体更容易留住水分，也会影响血压。\n每天食盐总量尽量不超过5克，算的是一天所有来源，不只是炒菜那一勺。已经放了酱油、蚝油，盐就少放点；咸菜、腌肉、加工食品，也别顿顿都有。\n然后是活动。整天坐着的人，不用一下开始长跑，可以先走10～20分钟，适应以后慢慢加，争取每周累计150分钟左右的中等强度运动。快走、骑车、游泳都可以，量力而行，运动前后留些热身和放松的时间。\n如果体重超标，减下来也有帮助。尤其男性腰围达到90厘米、女性达到85厘米，要关注腹型肥胖。但不是每瘦一公斤，低压就固定降一个点，要看自己的变化。\n烟尽量戒掉，酒能不喝就不喝。喝酒后觉得脸热、身体放松，并不代表血压得到了长期控制。睡眠也尽量规律些，别白天硬撑、晚上继续熬。\n那这些都做了，还用不用吃药？\n如果刚发现低压90出头，医生评估后认为整体风险较低，可能先让你调整生活，同时记录血压，到约定时间复查。不是没症状就不用药，也不是回家观察就再也不管了。\n如果调整了一段时间仍然高，或者一开始就明显升高，又或者已经有冠心病、肾脏损伤等情况，就需要及时评估药物治疗。具体选哪种、吃多少，由医生结合身体情况决定。\n所以低压高了，先弄清是不是持续升高，再看哪些因素能改、需不需要配合药物。把血压记录带去复诊，比每天盯着一次90多的读数猜来猜去，更容易找到适合你的办法。", "source": "本地DOCX；已核对候选记录MD5", "error": "", "recomputedScore": 0.1322}], "unavailableCount": 1, "matchStatus": "needs_review", "unavailableReasons": ["document_identity_parameters_missing"]}, "result": "待核对"}, {"id": "243072", "doctor": "云鹏", "time": "2026-11-09 09:55:18", "group": "需要处理", "action": "evidence_only", "reason": "视频29.7秒，低于55秒门槛；仅存证，尚未确认作品关联。", "verdict": "不计为处理正确，也不等于下载失败。", "task": "", "title": "尚未关联作品", "local": "空", "remote": "未绑定／未取得", "recordId": null, "hold": "", "enabled": false, "notes": ["本次只读核验：本地视频文件通过校验。不等于本次重新验证了云端播放。", "当前身份目录中的发送人职责：医生；职责目录是本次读取值，不冒充历史身份快照。", "该事件尚无任务归属，不能将这条消息直接计为一个失败任务，也不能把最高分候选当成已确认归属。"], "history": [], "sync": {"text": "本条未新增状态历史，不要求重复写回。", "records": [], "attention": false}, "windows": ["243072"], "media": {"fileVerified": true, "videoPresent": true, "download": "已下载", "seconds": 29.7, "matchStatus": null, "qualifyingCount": null, "sampleSeconds": null, "candidateCount": 0, "best": []}, "result": 和三项都不达标的人相比，心血管事件风险降低了55%。这不是某一个指标在起作用，是一起达标带来的结果。\n第二段（1:00–2:00）\n为什么不能只挑一个管？\n因为这三件事，伤的是同一套系统——血管。\n血压高，是血管壁长期承受过高的压力，心脏要更使劲泵血，血管更容易受损。血糖高，伤的是全身的小血管和神经，早期不疼不痒，等有感觉的时候，眼底、肾脏可能已经出了问题。血脂高，尤其是坏胆固醇长期偏高，会促进斑块形成。斑块破裂形成血栓，心梗、脑梗可能就在几分钟之内。\n它们不是三个独立的问题，是三个方向同时推高同一个风险。只关掉其中一个开关，另外两个还在往同一个方向使劲。\n第三段（2:00–3:00）\n那医生该怎么处理？不是“只挑最危险的那一个”，而是看谁最失控、谁最紧迫，先处理，但另外两个也不能丢。\n比如您血糖最近控制得不错，但血压一直高，低密度脂蛋白胆固醇也没降下来。血糖这一项指标的改善值得高兴，但不能因为一个数字变好了，就认为另外两个也跟着安全了。“先处理”不等于“另外两个可以一直不管”。\n日常能做的，其实很多是“一箭三雕”的。少放点盐、少喝含糖饮料、控制食量、规律运动、把体重降一点——这些调整，对这三个指标的改善都有帮助。\n第四段（3:00–4:00）\n所以，三高不是一场“谁更危险”的比赛。您真正该问医生的，不是“先管哪一个”，而是：我的“三高”分别该控制到什么水平？现在还有哪一项没达标？\n需要优先处理的先处理，但其他存在的问题也要一起管理。降好了一个，缺漏掉另外两个，等于白忙一场。\n我是云鹏医生，下期见。", "source": "来源文本消息全文（保留原消息，不自动认定为有效稿件）", "error": "", "recomputedScore": 0.1161}, {"messageId": 202625, "title": "脚本一：吃他汀，这几件事要留意", "recordedScore": 0.1076, "body": "脚本一：吃他汀，这几件事要留意\n第一段（0:00–1:00）\n大家好，我是云鹏医生。\n门诊上，很多吃他汀的朋友最担心的是伤肝伤肾。每次复查，转氨酶稍微升高一点，就很紧张，甚至自行停药。\n我今天想跟您说一句可能有点意外的话：吃他汀真正容易“出事”的地方，往往不在肝功能报告单上，而在您每天吃进去的东西里，在您同时吃的其他药里。\n注意，我不是说肝功能不用看。我是说，有些雷区比转氨酶升高更容易被忽略，而且一旦踩中，后果缺更严重。\n今天我就把吃他汀时最容易被忽略的几件事，一件一件跟您聊清楚。\n\n第二段（1:00–2:00）\n第一件事：有一种水果，真的不能和他汀“同桌”。\n西柚，也叫葡萄柚。它本身是好水果，但它里面有一种成分，会抑制身体里负责分解他汀的酶，导致他汀分解变慢，血液里的药物浓度就会升高。\n血药浓度一高，肌肉损伤的风险就上来了。有资料显示，西柚可以让洛伐他汀的血药浓度升高15倍，横纹肌溶解的风险明显增加。\n这里有一个关键点：受影响最大的是辛伐他汀和洛伐他汀。如果您吃的是阿托伐他汀，也需要注意；但普伐他汀、瑞舒伐他汀受影响相对小得多。\n所以不是让您把所有水果都戒了，而是西柚这一类，吃他汀期间最好避开。哪怕间隔几个小时，也不一定安全。\n\n第三段（2:00–3:00）\n第二件事：如果您同时吃降压药，要留意“两条路”的问题。\n很多朋友是血脂、血压一起高，他汀和降压药一起吃。他汀要靠肝脏里的“代谢通道”来降解，如果降压药也走同一条通路，两种药挤在一起，肝脏的负担就重了，药物在体内的浓度也会变得不稳定。\n所以医生在开药时，会有意识地错开药物的代谢通道。比如有些沙坦类降压药，像阿利沙坦酯，不经过肝脏的他汀代谢通道，而是通过肠道水解产生活性成分，从机制上减少了和他汀“冲突”的机会。\n但具体您该用哪种他汀，一定要让医生根据您的肝肾功能和合并用药来决定，不能自己道听途说。\n\n第四段（3:00–4:00）\n第三件事：短效他汀和长效他汀，吃的时间不一样。\n很多人听过“他汀都得晚上吃”，其实不是。辛伐他汀、洛伐他汀、普伐他汀这类短效的药物，半衰期短，晚上睡前吃更贴合肝脏夜间合成胆固醇的高峰。而阿托伐他汀、瑞舒伐他汀是长效的，药效管一整天，早上或晚上固定一个时间吃都行。\n\n比“几点吃药”更重要的是：固定时间，别今天早上明天晚上。\n最后，刚开始吃他汀或者调整剂量后的前三个月，记得复查肝功能和肌酸激酶。如果出现不明原因的大腿、小腿酸痛、乏力，需要及时到医院就诊。\n他汀是一个帮我们压低未来心梗、脑梗风险的工具。避开该避的，盯住该盯的，大多数人可以长期、安全地获益。我是云鹏医生，下期见。", "source": "来源文本消息全文（保留原消息，不自动认定为有效稿件）", "error": "", "recomputedScore": 0.1076}, {"messageId": 202626, "title": "脚本三：血压降了，为什么还要做这么多检查？", "recordedScore": 0.1022, "body": "脚本三：血压降了，为什么还要做这么多检查？\n第一段（0:00–1:00）\n大家好，我是云鹏医生。\n很多高血压的朋友，药吃了，血压也降下来了。然后我跟他说：“还需要查一下心脏、颈动脉、肾脏。”他往往会有疑问：“血压都正常了，还查这些干什么？”\n这个问题特别真实。今天我就想跟您聊清楚：血压正常，为什么不代表“万事大吉”？过去那些年偏高的血压，有没有已经在器官上留下痕迹，靠一个血压计是看不出来的。\n\n第二段（1:00–2:00）\n我们先讲一下什么叫“靶器官损害”。\n长期血压高，就像一根水管常年承受偏高的水压。管壁会变厚、变硬，下游的“设备”也会受影响。在身体里，最常被牵连的三个地方是：心脏、血管和肾脏。\n心脏长期超负荷泵血，心肌会变厚，这叫左心室肥厚。一项汇总分析显示，在高血压人群中，左心室肥厚的患病率大约是36.5%。它不是靠感觉能发现的，需要心脏超声来看。\n颈动脉是全身血管的一个“窗口”。颈动脉超声能看到有没有斑块、血管有没有狭窄。高血压本身就会增加动脉粥样硬化的风险。\n肾脏里有大量细小血管，长期高压会损伤它们。早期可能没有任何感觉，但尿液里可能已经出现了微量白蛋白。\n第三段（2:00–3:00）\n那查这些，到底有什么用？\n用处在于：它决定了您的治疗目标应该到什么程度，以及除了降压之外，还需要做什么。\n2024年欧洲心脏病学会的高血压指南和2025年美国心脏病学会的指南，都把*高血压介导的靶器官损害评估作为风险分层的重要一步。也就是说，同样是血压降到130/80，一个没有靶器官损害的人，和一个已经有左心室肥厚或颈动脉斑块的人，后续的管理策略是不一样的。\n比如颈动脉超声发现斑块，医生可能会更重视降脂治疗；心脏超声发现左心室肥厚，医生在选择降压药时会考虑那些对逆转肥厚有帮助的药物类别。检查是为了让治疗更有针对性。\n第四段（3:00–4:00）\n当然，也不是所有人都需要把所有检查反复做一遍。查哪些、多久查一次，要根据您的血压水平、病程长短、合并疾病来决定。\n但有一条原则是清楚的：血压数字只告诉您“压力控制得怎么样”，靶器官评估才告诉您“过去那些年，身体有没有为此买单”。把这两件事放在一起，医生才能给您一个真正完整的方案。\n别让“血压正常”这四个字，成为您不再复查的理由。我是云鹏医生，下期见。", "source": "来源文本消息全文（保留原消息，不自动认定为有效稿件）", "error": "", "recomputedScore": 0.1022}, {"messageId": 202627, "title": "脚本四：降压药伤肾？你可能担心反了", "recordedScore": 0.0935, "body": "脚本四：降压药伤肾？你可能担心反了\n\n第一段（0:00–1:00）\n大家好，我是云鹏医生。\n门诊上，一说要开始吃降压药，很多人的第一反应不是“吃了血压能稳”，而是“这药会不会伤肝伤肾？吃久了会不会耐药？是不是一吃就停不下来了？”\n我特别理解这些担心。但我今天想跟您说一句可能有点扎心的话：真正出问题恰恰是因为这些没根据的担心，导致该吃的药没吃，最后肾脏出了问题。\n关于降压药的误区，今天挑最要紧的几个，跟您聊清楚。\n第二段（1:00–2:00）\n先说“伤肾”。\n高血压本身，才是伤肾的主力之一。长期血压偏高，肾脏里那些细小的血管会持续受损，过滤功能会慢慢下降。而普利类、沙坦类降压药，在合适的人群中，恰恰有保护肾脏的作用——它们降低肾小球内的压力，减少蛋白的漏出。\n当然，任何药物都有需要监测的指标。用这类药，医生会定期看您的血肌酐和血钾。如果指标有变化，医生会判断原因、调整方案。不吃药带来的肾脏风险，比规范用药要大得多。\n\n第三段（2:00–3:00）\n\n再说“耐药”。\n“一种药吃几年就失效了，所以要定期换着吃”，这个说法在降压药里不成立。降压药不存在抗生素那种“耐药”的概念。\n如果原来的方案控制不住了，首先要看的是：有没有漏服？体重有没有变化？盐是不是吃多了？有没有新出现的合并疾病或药物相互作用？而不是简单地归结为“药吃久了没用了”。如果确实需要调整，医生可以改剂量、联合另一种药，但没必要仅仅因为“用了很多年”就换药。\n\n第四段（3:00–4:00）\n最后说“停不下来”。\n需要长期吃药，通常是因为血压需要持续控制，不是药物让身体产生了依赖。有一项综述汇总了停用降压药的研究，发现停药后1年成功率大约40%，2年成功率大约27%。也就是说，确实有少数人可以在医生指导下成功减量或停药，但比例并不高，而且需要监测血压。\n更常见的情况是：吃药后血压正常了，就以为“病好了”，自己把药停了。结果血压反弹，甚至比原来更高。血压正常，恰恰说明是降压药在起作用。\n您真正该关心的，不是“我吃了多久”，而是血压有没有持续达标、有没有不舒服、复查指标怎么样。把这些记录下来，和医生一起来判断，才是对自己最负责的做法。我是云鹏医生，下期见。", "source": "来源文本消息全文（保留原消息，不自动认定为有效稿件）", "error": "", "recomputedScore": 0.0935}, {"messageId": 225545, "title": "怕降压药“一吃就停不掉”，所以一直不吃？", "recordedScore": 0.0878, "body": "怕降压药“一吃就停不掉”，所以一直不吃？\n第一段（0:00–1:00）\n大家好，我是云鹏医生。\n门诊上经常遇到这样的朋友：降压药已经开回家了，放在抽屉里，一直没开始吃。问他为什么，他说：“我怕吃上以后，就得吃一辈子。”\n我特别理解这种担心。但今天我想跟您说一句可能有点扎心的话：您怕的是“被药绑住”，但真正一直在那里损伤您身体的，是高血压本身。\n第二段（1:00–2:00）\n先把一件事说清楚：降压药没有成瘾性。2024年《中国高血压防治指南》明确指出，临床常用降压药不存在成瘾机制，停药后没有心理渴求、烦躁心慌这类戒断反应。\n那为什么吃药以后血压正常了，一停又高？不是因为身体“离不开药”，是因为高血压这个病一直还在。血压降下来，说明药在起作用；停药后血压回升，说明原来的问题没有被“治愈”，只是被控制住了。\n这就像戴眼镜。戴上看得清，摘下来又模糊——不是眼睛被眼镜“绑住”了，是近视本身还在。\n第三段（2:00–3:00）\n当然，也不是说开始吃药，以后就永远一个剂量、一成不变。\n后面怎么调整，要看血压记录和身体情况，由医生判断。有人需要调整药量，有人需要换方案。但能不能调、什么时候调，不能靠某一天的读数自己决定，更不能突然停掉。尤其是某些类型的降压药，骤然停用可能引起血压反跳，风险更大。\n开始吃药和以后能不能停药，是两件事。不能因为担心第二件，就一直不处理第一件。\n第四段（3:00–4:00）\n还有一点很重要：别等出事了才开始。\n长期高血压增加心、脑、肾受损的风险，这个过程不一定让您有明显感觉。“头不晕”不等于“没问题”，难不难受和血压控制得好不好，不能画等号。\n如果您也是药拿回家却一直没吃，不妨把“我怕以后停不掉”这句话直接说给医生听。先弄清楚现在为什么需要用药、怎么吃、什么时候复查。至于后面是否需要长期服药，让身体情况和血压变化来回答。\n我是云鹏医生，下期见。", "source": "来源文本消息全文（保留原消息，不自动认定为有效稿件）", "error": "", "recomputedScore": 0.0878}], "unavailableCount": 23, "matchStatus": "needs_review", "unavailableReasons": ["native_message_xml_unavailable"]}, "result": "待核对"}, {"id": "243831", "doctor": "云鹏", "time": "2026-11-09 12:56:59", "group": "需要处理", "action": "needs_review", "reason": "视频开头未达到唯一文案匹配标准", "verdict": "视频开头未达到唯一文案匹配标准", "task": "", "title": "尚未关联作品", "local": "空", "remote": "未绑定／未取得", "recordId": null, "hold": "", "enabled": false, "notes": ["程序原始结果：视频开头未达到唯一文案匹配标准。", "本次只读核验：本地视频文件通过校验。阻塞在后续作品／稿件匹配，不是该原件未下载。", "匹配缓存：达标候选0个，采样85.287秒，结果needs_review；最高3个候选分数列在下方。", "当前身份目录中的发送人职责：医生；职责目录是本次读取值，不冒充历史身份快照。", "该事件尚无任务归属，不能将这条消息直接计为一个失败任务，也不能把最高分候选当成已确认归属。"], "history": [], "sync": {"text": "本条未新增状态历史，不要求重复写回。", "records": [], "a : "本地DOCX；已核对候选记录MD5", "error": "", "recomputedScore": 0.276}, {"messageId": 225541, "title": "血压高是身体在“自救”，所以不能降？", "recordedScore": 0.162, "body": "血压高是身体在“自救”，所以不能降？\n第一段（0:00–1:00）\n大家好，我是云鹏医生。\n门诊上经常有患者跟我说：“血压高，是身体为了保证脏器供血才升上去的。我要是把血压降下来，大脑、心脏不就缺血了吗？”\n这话听起来有一定的道理。血液要流到全身，确实需要压力。但这里面有一个关键的区别：血液流动需要压力，不等于压力越高，供血就越好。\n您可以把血管想象成水管。水管被捏紧了，水要挤过去，管壁承受的压力确实会升高。但这时候流到末端的水，是更多了还是更少了？压力高，很多时候恰恰说明血管阻力大、血流不顺畅，而不是供血更充足。\n所以，不能从“血压高”直接倒推出“身体在自救、不能降”。\n第二段（1:00–2:00）\n那为什么血压会高？原因很多。心脏泵血的力量、血管的弹性、体内的水分和盐分、神经和激素的调节，都在起作用。不是只有“缺不缺血”这一个开关。\n而且，身体确实有自我调节的能力。某个部位需要更多血，局部血管可以扩张。但这些调节不是万能的，也不能用来解释所有长期高血压。\n真正需要担心的是另一件事：血压长期偏高，本身就在损伤器官。心脏每次泵血都要克服更大的阻力，血管壁一直承受过高的压力。时间久了，心、脑、肾都可能出问题。\n所以，问题不是“该不该降”，而是降哪一部分、降到什么程度。\n第三段（2:00–3:00）\n这里要讲清楚一个概念：降压，不是把血压越降越低。 我们要降的是“过高的那一部分”。\n有些降压药，是让收缩的血管放松，血液通过的阻力减小了，维持循环就不需要原来那么高的压力。还有些药，帮助排出多余的钠和水，也是从影响血压的环节入手，不是简单地减少器官需要的血液。\n当然，如果降得太快、太低，确实可能让人不舒服。老年人、脑血管狭窄的患者，尤其需要个体化的目标。这就是为什么医生要结合年龄、血管情况和耐受程度来定方案，而不是给所有人同一个数字目标。\n第四段（3:00–4:00）\n那怎么判断降得合不合适？\n如果您吃药以后头晕，尤其是站起来时眼前发黑，很可能就是血压偏低了，需要尽快找医生复诊，调整降压药的剂量、种类。\n血压高多数情况下并不是身体的“保护机制”，它是一个需要被管理的风险。对于高血压来讲，该降的降，该稳的稳，该调的调。我是云鹏医生，下期见。", "source": "来源文本消息全文（保留原消息，不自动认定为有效稿件）", "error": "", "recomputedScore": 0.162}, {"messageId": 202625, "title": "脚本一：吃他汀，这几件事要留意", "recordedScore": 0.1435, "body": "脚本一：吃他汀，这几件事要留意\n第一段（0:00–1:00）\n大家好，我是云鹏医生。\n门诊上，很多吃他汀的朋友最担心的是伤肝伤肾。每次复查，转氨酶稍微升高一点，就很紧张，甚至自行停药。\n我今天想跟您说一句可能有点意外的话：吃他汀真正容易“出事”的地方，往往不在肝功能报告单上，而在您每天吃进去的东西里，在您同时吃的其他药里。\n注意，我不是说肝功能不用看。我是说，有些雷区比转氨酶升高更容易被忽略，而且一旦踩中，后果缺更严重。\n今天我就把吃他汀时最容易被忽略的几件事，一件一件跟您聊清楚。\n\n第二段（1:00–2:00）\n第一件事：有一种水果，真的不能和他汀“同桌”。\n西柚，也叫葡萄柚。它本身是好水果，但它里面有一种成分，会抑制身体里负责分解他汀的酶，导致他汀分解变慢，血液里的药物浓度就会升高。\n血药浓度一高，肌肉损伤的风险就上来了。有资料显示，西柚可以让洛伐他汀的血药浓度升高15倍，横纹肌溶解的风险明显增加。\n这里有一个关键点：受影响最大的是辛伐他汀和洛伐他汀。如果您吃的是阿托伐他汀，也需要注意；但普伐他汀、瑞舒伐他汀受影响相对小得多。\n所以不是让您把所有水果都戒了，而是西柚这一类，吃他汀期间最好避开。哪怕间隔几个小时，也不一定安全。\n\n第三段（2:00–3:00）\n第二件事：如果您同时吃降压药，要留意“两条路”的问题。\n很多朋友是血脂、血压一起高，他汀和降压药一起吃。他汀要靠肝脏里的“代谢通道”来降解，如果降压药也走同一条通路，两种药挤在一起，肝脏的负担就重了，药物在体内的浓度也会变得不稳定。\n所以医生在开药时，会有意识地错开药物的代谢通道。比如有些沙坦类降压药，像阿利沙坦酯，不经过肝脏的他汀代谢通道，而是通过肠道水解产生活性成分，从机制上减少了和他汀“冲突”的机会。\n但具体您该用哪种他汀，一定要让医生根据您的肝肾功能和合并用药来决定，不能自己道听途说。\n\n第四段（3:00–4:00）\n第三件事：短效他汀和长效他汀，吃的时间不一样。\n很多人听过“他汀都得晚上吃”，其实不是。辛伐他汀、洛伐他汀、普伐他汀这类短效的药物，半衰期短，晚上睡前吃更贴合肝脏夜间合成胆固醇的高峰。而阿托伐他汀、瑞舒伐他汀是长效的，药效管一整天，早上或晚上固定一个时间吃都行。\n\n比“几点吃药”更重要的是：固定时间，别今天早上明天晚上。\n最后，刚开始吃他汀或者调整剂量后的前三个月，记得复查肝功能和肌酸激酶。如果出现不明原因的大腿、小腿酸痛、乏力，需要及时到医院就诊。\n他汀是一个帮我们压低未来心梗、脑梗风险的工具。避开该避的，盯住该盯的，大多数人可以长期、安全地获益。我是云鹏医生，下期见。", "source": "来源文本消息全文（保留原消息，不自动认定为有效稿件）", "error": "", "recomputedScore": 0.1435}, {"messageId": 202627, "title": "脚本四：降压药伤肾？你可能担心反了", "recordedScore": 0.1345, "body": "脚本四：降压药伤肾？你可能担心反了\n\n第一段（0:00–1:00）\n大家好，我是云鹏医生。\n门诊上，一说要开始吃降压药，很多人的第一反应不是“吃了血压能稳”，而是“这药会不会伤肝伤肾？吃久了会不会耐药？是不是一吃就停不下来了？”\n我特别理解这些担心。但我今天想跟您说一句可能有点扎心的话：真正出问题恰恰是因为这些没根据的担心，导致该吃的药没吃，最后肾脏出了问题。\n关于降压药的误区，今天挑最要紧的几个，跟您聊清楚。\n第二段（1:00–2:00）\n先说“伤肾”。\n高血压本身，才是伤肾的主力之一。长期血压偏高，肾脏里那些细小的血管会持续受损，过滤功能会慢慢下降。而普利类、沙坦类降压药，在合适的人群中，恰恰有保护肾脏的作用——它们降低肾小球内的压力，减少蛋白的漏出。\n当然，任何药物都有需要监测的指标。用这类药，医生会定期看您的血肌酐和血钾。如果指标有变化，医生会判断原因、调整方案。不吃药带来的肾脏风险，比规范用药要大得多。\n\n第三段（2:00–3:00）\n\n再说“耐药”。\n“一种药吃几年就失效了，所以要定期换着吃”，这个说法在降压药里不成立。降压药不存在抗生素那种“耐药”的概念。\n如果原来的方案控制不住了，首先要看的是：有没有漏服？体重有没有变化？盐是不是吃多了？有没有新出现的合并疾病或药物相互作用？而不是简单地归结为“药吃久了没用了”。如果确实需要调整，医生可以改剂量、联合另一种药，但没必要仅仅因为“用了很多年”就换药。\n\n第四段（3:00–4:00）\n最后说“停不下来”。\n需要长期吃药，通常是因为血压需要持续控制，不是药物让身体产生了依赖。有一项综述汇总了停用降压药的研究，发现停药后1年成功率大约40%，2年成功率大约27%。也就是说，确实有少数人可以在医生指导下成功减量或停药，但比例并不高，而且需要监测血压。\n更常见的情况是：吃药后血压正常了，就以为“病好了”，自己把药停了。结果血压反弹，甚至比原来更高。血压正常，恰恰说明是降压药在起作用。\n您真正该关心的，不是“我吃了多久”，而是血压有没有持续达标、有没有不舒服、复查指标怎么样。把这些记录下来，和医生一起来判断，才是对自己最负责的做法。我是云鹏医生，下期见。", "source": "来源文本消息全文（保留原消息，不自动认定为有效稿件）", "error": "", "recomputedScore": 0.1345}, {"messageId": 241748, "title": "科普脚本", "recordedScore": 0.1228, "body": "视频一：家庭血压\n建议核心： 在家量血压，标准是135/85，不是140/90\n标题： 在家量血压，别再用医院的140/90来判断了\n正文：\n在家量血压，很多人拿140/90mmHg以下当作正常的标准。其实不对。\n2025版国家基层高血压防治管理指南写得很清楚：家庭安静状态下血压的平均值达到135/85mmHg，就达到高血压的诊断标准了。注意，是“平均值”，不是某一次。\n怎么算平均值？连续测5到7天，早晚各一次，每次测2到3遍，把所有数字平均起来。如果实在测不了那么久，至少也要3天、12个数字。\n所以，如果您在家反复测出来135/85以上，建议带着记录去找医生就诊。家庭血压的标准，本来就比诊室血压低一点。别因为用错了尺子，把该重视的信号遗漏过去。\n\n视频二：限盐\n建议核心： 每天少吃5克盐，收缩压平均能降4个毫米汞柱\n标题： 炒菜少放盐，到底能降多少血压？有个具体数字\n正文：\n“少吃盐”这句话，您可能听了很多年。但它到底能降多少血压，很多人心里没数。\n一项汇总了34项随机对照试验的荟萃分析发现：把每天的盐摄入量从9.4克降到4.4克，也就是每天少吃5克盐，高血压患者的收缩压平均下降了4.2毫米汞柱。舒张压也有下降。\n4个毫米汞柱听起来不大，但它是每天的每顿饭累积出来的。而且这个效果，不需要吃药，不需要花钱，只需要在厨房里做一件事：盐罐子少舀一勺，酱油蚝油少倒一点，咸菜腊肉别顿顿上桌。\n当然，血压已经明显偏高的人，该用药还是要用药。限盐是辅助治疗，不能替代降压药。\n\n视频三：血糖偏高\n建议核心： 糖尿病前期是“可逆窗口”，生活方式干预能让心血管风险降一半\n标题： 体检血糖偏高，还没到糖尿病——这可能是您最后的机会\n正文：\n体检发现血糖偏高，医生说“还没到糖尿病”。很多人松一口气，然后……就没有然后了。\n但中国的大庆研究告诉我们一件事：糖尿病前期，是一个可以往回走的窗口。 大庆研究纳入540例糖尿病前期患者，经过6年生活方式干预，13.3%的人血糖回到了正常。在之后24年的随访里，这些达到缓解的人，全因死亡和心脑血管事件风险降低了40%。\n更关键的是另一组数据：糖尿病前期如果达到缓解，心血管死亡或心衰住院风险可以降低53%。\n怎么干预？不是饿肚子。大庆研究做的是饮食调整加规律运动。少喝含糖饮料，主食里换一部分粗粮，饭后走一走。血糖偏高不是“等明年体检再说”的事，是现在动手，还来得及的事。\n\n视频四：他汀与斑块\n建议核心： 有斑块的人，LDL-C降到1.8以下，斑块才“稳”\n标题： 体检发现颈动脉斑块，血脂要降到多少才算“稳”？\n正文：\n体检报告上写着“颈动脉斑块”，很多人第一反应是：血脂高一点，但也没感觉，要不要管？\n我的答案是必须要管！斑块真正的危险，不在于它慢慢变大，而在于破裂。斑块一旦破裂，血栓几分钟之内就能把血管堵死。\n2025版美国心脏病协会的血脂指南给了一个明确的数字：对于高血压合并肥胖、或者已经有动脉粥样硬化性心血管疾病高风险的人，低密度脂蛋白胆固醇要降到1.8 mmol/L以下，这是稳定斑块的基本要求。2026年的综述也指出，LDL-C降到1.8以下，已经进入血管壁的“坏胆固醇”才有可能逆转回血液。\n所以，有斑块的人别只盯着“有没有症状”。把LDL-C压到1.8以下，才是让斑块“稳住”的关键一步。该吃他汀的，别因为怕副作用就自己停了。\n\n视频五：单纯低压高\n建议核心： 高压正常、低压90多，每周150分钟有氧运动是首选干预\n标题： 高压正常，低压90多，最该先做的不是吃药\n正文：\n三四十岁的人，高压120，低压95。很多人问我：“医生，要不要吃药？”\n我的回答是：先别急着吃药，但也不能不管。这种情况叫“单纯舒张期高血压”，背后最常见的问题是外周血管阻力升高、交感神经持续兴奋。熬夜、久坐、压力大、体重超标，都在推高舒张压（俗称的低压）。\n那我们最该先做什么？是规律的有氧运动。 2024版中国高血压防治指南建议：单纯低压高的人，每周至少150分钟中等强度有氧运动，快走、慢跑、游泳、骑车都行，再配合每周2到3次抗阻训练。\n什么叫中等强度？运动的时候有轻微的喘气，例如能说话，但不能唱歌。\n低压高不是“年轻扛得住”的良性现象，它是血管在提前给您报警信号。在它变成高压、低压“双高”之前动起来，比等高压也升高了再吃药，要划算得多。", "source": "本地DOCX；已核对候选记录MD5", "error": "", "recomputedScore": 0.1228}], "unavailableCount": 1, "matchStatus": "needs_review", "unavailableReasons": ["document_identity_parameters_missing"]}, "result": "待核对"}, {"id": "244708", "doctor": "云鹏", "time": "2026-11-09 16:06:06", "group": "需要处理", "action": "needs_review", "reason": "视频开头未达到唯一文案匹配标准", "verdict": "视频开头未达到唯一文案匹配标准", "task": "", "title": "尚未关联作品", "local": "空", "remote": "未绑定／未取得", "recordId": null, "hold": "", "enabled": false, "notes": ["程 汀的酶，导致他汀分解变慢，血液里的药物浓度就会升高。\n血药浓度一高，肌肉损伤的风险就上来了。有资料显示，西柚可以让洛伐他汀的血药浓度升高15倍，横纹肌溶解的风险明显增加。\n这里有一个关键点：受影响最大的是辛伐他汀和洛伐他汀。如果您吃的是阿托伐他汀，也需要注意；但普伐他汀、瑞舒伐他汀受影响相对小得多。\n所以不是让您把所有水果都戒了，而是西柚这一类，吃他汀期间最好避开。哪怕间隔几个小时，也不一定安全。\n\n第三段（2:00–3:00）\n第二件事：如果您同时吃降压药，要留意“两条路”的问题。\n很多朋友是血脂、血压一起高，他汀和降压药一起吃。他汀要靠肝脏里的“代谢通道”来降解，如果降压药也走同一条通路，两种药挤在一起，肝脏的负担就重了，药物在体内的浓度也会变得不稳定。\n所以医生在开药时，会有意识地错开药物的代谢通道。比如有些沙坦类降压药，像阿利沙坦酯，不经过肝脏的他汀代谢通道，而是通过肠道水解产生活性成分，从机制上减少了和他汀“冲突”的机会。\n但具体您该用哪种他汀，一定要让医生根据您的肝肾功能和合并用药来决定，不能自己道听途说。\n\n第四段（3:00–4:00）\n第三件事：短效他汀和长效他汀，吃的时间不一样。\n很多人听过“他汀都得晚上吃”，其实不是。辛伐他汀、洛伐他汀、普伐他汀这类短效的药物，半衰期短，晚上睡前吃更贴合肝脏夜间合成胆固醇的高峰。而阿托伐他汀、瑞舒伐他汀是长效的，药效管一整天，早上或晚上固定一个时间吃都行。\n\n比“几点吃药”更重要的是：固定时间，别今天早上明天晚上。\n最后，刚开始吃他汀或者调整剂量后的前三个月，记得复查肝功能和肌酸激酶。如果出现不明原因的大腿、小腿酸痛、乏力，需要及时到医院就诊。\n他汀是一个帮我们压低未来心梗、脑梗风险的工具。避开该避的，盯住该盯的，大多数人可以长期、安全地获益。我是云鹏医生，下期见。", "source": "来源文本消息全文（保留原消息，不自动认定为有效稿件）", "error": "", "recomputedScore": 0.1014}, {"messageId": 225543, "title": "血压、血脂、血糖都高，先管哪一个？", "recordedScore": 0.0967, "body": "血压、血脂、血糖都高，先管哪一个？\n第一段（0:00–1:00）\n大家好，我是云鹏医生。\n门诊上经常有人问我：“血压、血脂、血糖都高，到底哪个最危险？我能不能先把最危险的那个管好，另外两个先放一放？”\n这个想法特别自然。但今天我想跟您说一句可能有点意外的话：三高之间，很难排出一个对所有人都适用的“危险顺序”。 更关键的是，分开管和一起管，结果完全不一样。\n有一项香港的研究，追踪了一批“三高”的患者。血糖、血压、血脂三项都达标的人，和三项都不达标的人相比，心血管事件风险降低了55%。这不是某一个指标在起作用，是一起达标带来的结果。\n第二段（1:00–2:00）\n为什么不能只挑一个管？\n因为这三件事，伤的是同一套系统——血管。\n血压高，是血管壁长期承受过高的压力，心脏要更使劲泵血，血管更容易受损。血糖高，伤的是全身的小血管和神经，早期不疼不痒，等有感觉的时候，眼底、肾脏可能已经出了问题。血脂高，尤其是坏胆固醇长期偏高，会促进斑块形成。斑块破裂形成血栓，心梗、脑梗可能就在几分钟之内。\n它们不是三个独立的问题，是三个方向同时推高同一个风险。只关掉其中一个开关，另外两个还在往同一个方向使劲。\n第三段（2:00–3:00）\n那医生该怎么处理？不是“只挑最危险的那一个”，而是看谁最失控、谁最紧迫，先处理，但另外两个也不能丢。\n比如您血糖最近控制得不错，但血压一直高，低密度脂蛋白胆固醇也没降下来。血糖这一项指标的改善值得高兴，但不能因为一个数字变好了，就认为另外两个也跟着安全了。“先处理”不等于“另外两个可以一直不管”。\n日常能做的，其实很多是“一箭三雕”的。少放点盐、少喝含糖饮料、控制食量、规律运动、把体重降一点——这些调整，对这三个指标的改善都有帮助。\n第四段（3:00–4:00）\n所以，三高不是一场“谁更危险”的比赛。您真正该问医生的，不是“先管哪一个”，而是：我的“三高”分别该控制到什么水平？现在还有哪一项没达标？\n需要优先处理的先处理，但其他存在的问题也要一起管理。降好了一个，缺漏掉另外两个，等于白忙一场。\n我是云鹏医生，下期见。", "source": "来源文本消息全文（保留原消息，不自动认定为有效稿件）", "error": "", "recomputedScore": 0.0967}, {"messageId": 205954, "title": "第一段（0:00–1:00）", "recordedScore": 0.0955, "body": "第一段（0:00–1:00）\n\n大家好，我是云鹏医生。\n\n门诊上经常遇到三四十岁的朋友，高压一百二挺正常，低压却到了九十五、九十八。他们常问：“医生，我血压没事吧？不用吃药吧？”我以前会说“再观察观察”，现在我会多问一句：“低压高多久了？”\n\n因为这几年有个很重要的变化：年轻人低压高，不再被当成“扛得住”的良性现象了。2026年心血管权威期刊上的一项研究，随访了近两万四千人17年。结果发现：青年时期有单纯舒张期高血压的人，心血管疾病风险升高36%，心衰风险升高69%，而且约三分之一会进展成高压、低压都高。\n\n今天我就跟您聊聊：低压高意味着什么，为什么不能“再等等”，以及生活上最该改变的是什么。\n\n第二段（1:00–2:00）\n\n我们先弄明白，低压是怎么来的。\n\n心脏收缩喷射血液，形成高压；心脏舒张时，大动脉靠弹性推血，维持的压力就是低压。\n\n高压高，多是大血管变硬了；而低压高，问题出在更细的小血管上——它们持续收缩，血液往前流阻力增大了。\n\n为什么小血管一直“紧绷”？最常见的原因是交感神经持续兴奋。像熬夜、压力大、久坐、肥胖，让身体总处在“随时要战斗”的状态。小血管收缩，心率偏快，低压就高了。\n\n所以低压高不是凭空来的，是身体在用数字告诉您：血管调控已经出了问题，只是还没到高压升上去的时候。\n\n第三段（2:00–3:00）\n\n那为什么不能“再等等”？\n\n因为对50岁以下的人，低压对心血管风险的预测价值，其实比高压更强。有分析显示，低压每升高10毫米汞柱，心脑血管死亡风险大约翻一倍。您觉得“只是低压高一点”，但血管已经在承受持续偏高的压力，不会因为您没感觉就停下来。\n\n当然，听到这您别紧张，不是说低压高就得立马吃药。2024年欧洲指南指出，年轻人单纯低压高，暂时先不用药是可以的。但前提是，您得死死盯住它。如果不通过生活方式干预，它很容易慢慢演变成双高。\n\n所以真正该做的，是从现在开始，认真做一件能把低压降下来的事。\n\n第四段（3:00–4:00）\n\n这件事，就是规律的有氧运动。\n\n2026年的一项研究显示：有氧运动可以降低24小时舒张压约2.76毫米汞柱，有氧加抗阻的联合训练可以降低约3.94毫米汞柱。数字看似不大，但它是24小时动态血压，意味着全天都在起效。\n\n具体怎么做？每周至少150分钟中等强度有氧运动，快走、慢跑、游泳都行。什么叫中等强度？运动时能说话，但不能唱歌。平时不运动的，从每天快走20分钟开始，比猛练更可持续。\n\n如果体重也超标，减重同样重要。有研究显示，体重每减轻1公斤，舒张压平均下降约1毫米汞柱。\n\n第五段（4:00–4:30）\n\n最后说句实在话。\n\n低压高，最怕两种态度：一是“高压正常就没事”，一直拖；二是“听说低压高要吃药”，自己跑去买别人的药吃。\n\n该不该用药，要看您整体的心血管风险。如果反复测量低压持续在90以上，或者已经出现微量白蛋白尿、左心室肥厚等靶器官损害，那就不是“再等等”的事了，应该找医生评估用药。\n\n但在那之前，您手里马上能做的事就是：动起来，把体重往下降一点。低压高，是血管在提前向您报警。我是云鹏医生，下期见。", "source": "来源文本消息全文（保留原消息，不自动认定为有效稿件）", "error": "", "recomputedScore": 0.0955}, {"messageId": 202627, "title": "脚本四：降压药伤肾？你可能担心反了", "recordedScore": 0.0916, "body": "脚本四：降压药伤肾？你可能担心反了\n\n第一段（0:00–1:00）\n大家好，我是云鹏医生。\n门诊上，一说要开始吃降压药，很多人的第一反应不是“吃了血压能稳”，而是“这药会不会伤肝伤肾？吃久了会不会耐药？是不是一吃就停不下来了？”\n我特别理解这些担心。但我今天想跟您说一句可能有点扎心的话：真正出问题恰恰是因为这些没根据的担心，导致该吃的药没吃，最后肾脏出了问题。\n关于降压药的误区，今天挑最要紧的几个，跟您聊清楚。\n第二段（1:00–2:00）\n先说“伤肾”。\n高血压本身，才是伤肾的主力之一。长期血压偏高，肾脏里那些细小的血管会持续受损，过滤功能会慢慢下降。而普利类、沙坦类降压药，在合适的人群中，恰恰有保护肾脏的作用——它们降低肾小球内的压力，减少蛋白的漏出。\n当然，任何药物都有需要监测的指标。用这类药，医生会定期看您的血肌酐和血钾。如果指标有变化，医生会判断原因、调整方案。不吃药带来的肾脏风险，比规范用药要大得多。\n\n第三段（2:00–3:00）\n\n再说“耐药”。\n“一种药吃几年就失效了，所以要定期换着吃”，这个说法在降压药里不成立。降压药不存在抗生素那种“耐药”的概念。\n如果原来的方案控制不住了，首先要看的是：有没有漏服？体重有没有变化？盐是不是吃多了？有没有新出现的合并疾病或药物相互作用？而不是简单地归结为“药吃久了没用了”。如果确实需要调整，医生可以改剂量、联合另一种药，但没必要仅仅因为“用了很多年”就换药。\n\n第四段（3:00–4:00）\n最后说“停不下来”。\n需要长期吃药，通常是因为血压需要持续控制，不是药物让身体产生了依赖。有一项综述汇总了停用降压药的研究，发现停药后1年成功率大约40%，2年成功率大约27%。也就是说，确实有少数人可以在医生指导下成功减量或停药，但比例并不高，而且需要监测血压。\n更常见的情况是：吃药后血压正常了，就以为“病好了”，自己把药停了。结果血压反弹，甚至比原来更高。血压正常，恰恰说明是降压药在起作用。\n您真正该关心的，不是“我吃了多久”，而是血压有没有持续达标、有没有不舒服、复查指标怎么样。把这些记录下来，和医生一起来判断，才是对自己最负责的做法。我是云鹏医生，下期见。", "source": "来源文本消息全文（保留原消息，不自动认定为有效稿件）", "error": "", "recomputedScore": 0.0916}, {"messageId": 225545, "title": "怕降压药“一吃就停不掉”，所以一直不吃？", "recordedScore": 0.0852, "body": "怕降压药“一吃就停不掉”，所以一直不吃？\n第一段（0:00–1:00）\n大家好，我是云鹏医生。\n门诊上经常遇到这样的朋友：降压药已经开回家了，放在抽屉里，一直没开始吃。问他为什么，他说：“我怕吃上以后，就得吃一辈子。”\n我特别理解这种担心。但今天我想跟您说一句可能有点扎心的话：您怕的是“被药绑住”，但真正一直在那里损伤您身体的，是高血压本身。\n第二段（1:00–2:00）\n先把一件事说清楚：降压药没有成瘾性。2024年《中国高血压防治指南》明确指出，临床常用降压药不存在成瘾机制，停药后没有心理渴求、烦躁心慌这类戒断反应。\n那为什么吃药以后血压正常了，一停又高？不是因为身体“离不开药”，是因为高血压这个病一直还在。血压降下来，说明药在起作用；停药后血压回升，说明原来的问题没有被“治愈”，只是被控制住了。\n这就像戴眼镜。戴上看得清，摘下来又模糊——不是眼睛被眼镜“绑住”了，是近视本身还在。\n第三段（2:00–3:00）\n当然，也不是说开始吃药，以后就永远一个剂量、一成不变。\n后面怎么调整，要看血压记录和身体情况，由医生判断。有人需要调整药量，有人需要换方案。但能不能调、什么时候调，不能靠某一天的读数自己决定，更不能突然停掉。尤其是某些类型的降压药，骤然停用可能引起血压反跳，风险更大。\n开始吃药和以后能不能停药，是两件事。不能因为担心第二件，就一直不处理第一件。\n第四段（3:00–4:00）\n还有一点很重要：别等出事了才开始。\n长期高血压增加心、脑、肾受损的风险，这个过程不一定让您有明显感觉。“头不晕”不等于“没问题”，难不难受和血压控制得好不好，不能画等号。\n如果您也是药拿回家却一直没吃，不妨把“我怕以后停不掉”这句话直接说给医生听。先弄清楚现在为什么需要用药、怎么吃、什么时候复查。至于后面是否需要长期服药，让身体情况和血压变化来回答。\n我是云鹏医生，下期见。", "source": "来源文本消息全文（保留原消息，不自动认定为有效稿件）", "error": "", "recomputedScore": 0.0852}], "unavailableCount": 23, "matchStatus": "needs_review", "unavailableReasons": ["document_identity_parameters_missing", "original_checksum_not_found"]}, "result": "待核对"}, {"id": "238441", "doctor": "刘伟伟", "time": "2026-11-06 10:08:33", "group": "处理正确", "action": "applied", "reason": "已核实七状态交接", "verdict": "来源消息与实际状态历史对应，确认程序已写入本地状态；不等同于全部已写回飞书。", "task": "e3beded9", "title": "肾病怎么稳住", "local": "成片确认中", "remote": "已发布", "recordId": "reczz28TZHkbarTX", "h nload": "已下载", "seconds": 285.83, "matchStatus": "needs_review", "qualifyingCount": 0, "sampleSeconds": 120, "candidateCount": 5, "best": [{"title": "刘伟伟kp19 ZY 鸡蛋不敢吃，咸菜却天天配？护血管别弄反了", "score": 0.1145, "taskRef": "fbf93cc7", "messageId": 242331}, {"title": "刘伟伟kp11 ZY 血钾明明很高，医生为何让你重新抽血？原来这个环节可能影响结果！", "score": 0.1013, "taskRef": "79843c61", "messageId": 223986}, {"title": "刘伟伟kp4 KX 沙坦类降压药怎么吃、怎么选、怎么查？理清这三件事", "score": 0.0927, "taskRef": "563805c1", "messageId": 201108}]}, "comparison": {"capturedAt": "2026-11-10T12:00:02+08:00", "transcript": "脑梗和脑出血到底是怎么发生的？为什么两种不一样的病，预防的重点却是一样的，都是要把血压控制好。先说脑梗，大脑血管从颈部进入后，不断的分支，越分越细，脑深部的穿支动脉。 几乎垂直从主干发出，管径细，血流冲击直接，缓冲少，血压长期偏高，血浆成分啊渗进管壁，平滑肌逐渐减少，管壁增厚变硬，管腔越来越窄，最后闭塞，它供血的一小块脑组织缺血坏死，这就是腔隙性脑。 脑梗常见的过程，另一条堵的路在大另一条堵的路在大血管。高血压叠加高血脂、糖尿病、吸烟，内皮啊反复受损，胆固醇沉积成斑块，斑块长大使血管变窄，一旦破裂形成血栓，也可能把脑血管突然。 给堵死，脑出血走的则是另外一条路，同样大小血管被高压冲刷多年，管壁爆变，管壁变薄，弹性下降，薄弱处啊向外膨出，形成微动脉瘤，平时没感觉，碰上情绪激动、天冷受刺激、用力排便、搬重物。 骤然升高，薄弱处就可能被薄弱处就可能破开，血液涌入脑组织，压迫损坏脑细胞，这就是脑出血。所以脑梗是堵，脑出血是破，共同根子啊，都是血压长期没有控制好。想把风险往前拦，三件事要。 做好第一件，看真实的血压，连续三到七天早晚测量，早晨排尿后吃药和早餐前测，晚上睡前再测，每次测两遍，间隔一分钟，记录结果。尤其啊要记好清晨的血压，因为人刚睡醒的时候交感神经。", "seconds": 120, "stop": "max_duration", "basis": "最新匹配缓存候选", "documents": [{"messageId": 242331, "title": "刘伟伟kp19 ZY 鸡蛋不敢吃，咸菜却天天配？护血管别弄反了", "recordedScore": 0.1145, "body": "封面：蛋黄还能吃吗\n标题：鸡蛋不敢吃，咸菜却天天配？护血管别弄反了\n#抖出健康知识宝藏 #健康科普进行时 #蛋黄不是敌人 #饮食误区 #坏胆固醇\n早餐剥个鸡蛋，把蛋黄挑出来扔了，转头又夹了一筷子咸菜。你是不是也这样？怕胆固醇高、怕血管堵，觉得少吃一个蛋黄，总归保险一点。\n可血管长斑块，真不能只怪鸡蛋。\n对大多数健康人来说，每天一个鸡蛋，可以是均衡饮食的一部分；已经有血脂异常的人，则要结合自己的情况安排，不是所有人都照着一个标准吃。\n你想，血管不是下水道，不是吃进去一点油，就直接粘在里面。长期血压高、血糖控制不好、吸烟，都可能损伤血管内皮；“坏胆固醇”在血管壁里逐渐积聚，伴随炎症反应，才慢慢形成斑块。\n更麻烦的是，有些斑块容易破裂，破了以后可能形成血栓，引起心梗、脑梗。所以，我们不光要关注斑块大小，也要关注它是否稳定。\n那吃饭该注意什么？比起只盯着蛋黄，更值得看看另外几样：咸菜、加工肉是不是天天吃，酒是不是经常喝，肥肉、猪油和酥皮点心是不是吃得不少。\n盐多了不利于控制血压，过量饮酒也会增加健康风险；饱和脂肪吃得过多，则不利于控制“坏胆固醇”。这些习惯不改，单独戒掉鸡蛋，解决不了根本问题。\n所以，别把每顿饭都吃成一道判断题。饮食搭配好，把烟戒掉，血压、血脂、血糖按医生要求管理，比纠结今天这个蛋黄该不该扔，更有意义。\n", "source": "本地DOCX；已核对候选记录MD5", "error": "", "recomputedScore": 0.1145}, {"messageId": 223986, "title": "刘伟伟kp11 ZY 血钾明明很高，医生为何让你重新抽血？原来这个环节可能影响结果！", "recordedScore": 0.1013, "body": "封面：血钾高也有真假\n标题：血钾明明很高，医生为何让你重新抽血？原来这个环节可能影响结果！\n#抖出健康知识宝藏 #健康科普进行时 #高钾血症 #尿毒症 #假性高钾血症\n尿毒症患者最担心的事情之一，就是高钾血症。因为钾离子对心脏来说太关键了，钾对维持心脏电活动的稳定非常重要。一旦血钾真的飙到危险水平，轻则心慌、心律不齐，重则心脏骤停，可能危及生命。\n所以当你拿到一份血钾数值很高的报告，紧张是完全正常的。\n但你可能注意到一个现象：有些时候，医生看到这份报告，并没有立刻给你上紧急降钾的治疗，而是先让你重新抽一次血。这是为什么？不是医生不重视，而是因为报告上的这个高值，有可能是假的。\n这里面的道理，得从钾在身体里的分布说起。钾是人体最重要的细胞内电解质之一，也就是说，绝大部分钾都待在细胞里面，血清里的钾含量其实很少。而采血的时候，针头刺进血管，红细胞从血管里被抽出来，这个过程本身就对红细胞有一定的机械刺激。如果操作不够规范，或者患者血管条件差、需要反复穿刺，红细胞就可能破裂，这就是溶血。\n红细胞一破，里面高浓度的钾就释放到血清里去了。实验室测的是血清中的钾，它分不清这些钾是本来就在血清里的，还是红细胞破裂后漏出来的。所以测出来的数值就会比实际的血钾水平高出一截。\n除了溶血之外，采血过程中还有一些操作因素也会造成假性升高。比如止血带扎得太紧、时间太长，或者让患者反复握拳松拳，这些都会让局部细胞释放钾离子进入血液样本。另外，如果从正在输液的静脉旁边采血，液体稀释或者某些含钾的输液成分也可能干扰结果。所以一份高钾报告拿到手，医生首先要排除的就是这些采样环节的问题。\n对于尿毒症患者来说，这个问题尤其需要警惕。因为尿毒症本身就会让排钾能力下降，这类患者确实比普通人更容易出现真性高钾血症。而且尿毒症患者往往血管条件比较差，长期透析需要反复穿刺，这就让采血时发生溶血的概率比普通人群更高。也就是说，同样的报告数值，放在一个肾功能正常的人身上，医生可能会先怀疑溶血；但放在尿毒症患者身上，真高钾的可能性就更大。这就让判断变得更复杂了——你不能因为\"尿毒症患者本来就爱高钾\"就默认报告是真的，也不能因为\"可能是溶血\"就掉以轻心。\n所以正确的做法是什么？是结合多个信息一起判断。重新抽血复查，看数值是不是稳定在高位；做心电图，看有没有高钾对心肌产生影响的特征性改变；再结合患者有没有心慌、肌无力这些症状，以及最近的饮食、用药、透析安排等临床情况。如果复查数值明显降下来了，心电图也没有异常，那大概率就是采血时溶血造成的假性升高，不需要按真高钾来紧急处理。反过来，如果复查依然很高，心电图也有改变，那就说明是真的，必须立刻干预。\n作为患者，你也能做一些配合。比如采血前避免剧烈运动，因为运动本身会让细胞释放钾；如果血管条件不好，提前告诉采血的护士，让她们选择更合适的部位和方式；不要从正在输液的胳膊上采血。这些细节虽然小，但能减少假性升高的概率，也能让医生更快做出准确判断。\n所以你看，医生让你重新抽血，不是不重视，恰恰是因为重视——高钾血症的处理本身是有风险的，如果不分真假就按最严重的情况去治，可能会矫枉过正。先把真假搞清楚，再决定下一步怎么走，这才是对患者真正负责的做法。\n", "source": "本地DOCX；已核对候选记录MD5", "error": "", "recomputedScore": 0.1013}, {"messageId": 201108, "title": "刘伟伟kp4 KX 沙坦类降压药怎么吃、怎么选、怎么查？理清这三件事", "recordedScore": 0.0927, "body": "封面：吃沙坦，一定要注意这三件事\n标题：沙坦类降压药怎么吃、怎么选、怎么查？理清这三件事\n#抖出健康知识宝藏#健康科普进行时#肾性贫血早知道#血压#痛风\n正在吃沙坦类降压药的朋友，不管您是刚开始吃，还是已经吃了三年五年，今天这条视频都建议认真看完。沙坦什么时候吃、不同品种怎么选、服药以后查什么，记住下面三件事。\n第一件事，沙坦什么时候吃？\n大多数沙坦每天服用一次，早上或晚上通常都可以，关键是固定时间、每天规律服用。如果清晨血压明显偏高，医生可能会让您早上吃；如果夜间血压控制不好，也可能根据动态血压调整到晚上。\n第二件事，沙坦有很多种，要根据自己的情况来选。\n比如血压高，同时尿酸也高，医生可能会考虑氯沙坦；平时工作忙、容易忘记吃药，可以考虑作用时间比较长的替米沙坦；如果以低压升高为主，或者有脂肪肝、肝功能异常，同时还在服用多种需要经过肝脏代谢的药物，医生可能会考虑阿利沙坦酯。它进入胃肠道后可以直接经酯酶水解成活性成分，不需要经过肝脏转化就能起效。\n不过大家一定要明确一种观点，就是没有哪一种沙坦适合所有人。选哪一种，要让医生评估，看血压、尿酸、肝肾功能和正在服用的其他药物，别照着别人的药盒自行换药。\n第三件事，也是大家最容易忽视的，吃沙坦以后要监测血钾和肾功能。\n沙坦在让血管放松、降低血压的同时，也会影响肾脏的血流和排钾。所以刚开始服用、增加剂量，或者和利尿剂等其他药物联合使用以后，要按照医生安排复查血肌酐和血钾。当然，检查出现轻微变化，不代表肾脏一定被药物伤了，要由医生结合变化幅度判断。如果肌酐或血钾明显升高，再及时调整方案。\n最后特别提醒，有三种情况一定要提前告诉医生：第一，准备怀孕或者已经怀孕；第二，既往发现双侧肾动脉狭窄；第三，血钾本来就高，或者正在服用补钾药物。沙坦也不能和普利类药物自行叠加，因为两类药作用在相近的通路上，一起使用可能增加高钾和肾功能异常的风险。\n最后记住，沙坦不是吃上以后就不用管，也不是血压正常了就可以停。固定时间服药，把家庭血压记录好，再按医生安排复查血肌酐和血钾，这才是把沙坦吃得稳、吃得明白的关键。\n", "source": "本地DOCX；已核对候选记录MD5", "error": "", "recomputedScore": 0.0927}, {"messageId": 208414, "title": "刘伟伟kp8 ZY 血脂报告上的数字，能算出血管堵没堵吗？", "recordedScore": 0.0927, "body": "封面：血管堵没堵\n标题：血脂报告上的数字，能算出血管堵没堵吗？\n#抖出健康知识宝藏 #健康科普进行时 #血脂异常 #低密度脂蛋白 #心血管健康\n低密度脂蛋白超过3.4，拿血脂报告算一下，就能知道血管堵没堵？这个方法听起来很方便，但算出来的数，回答不了这个问题。\n它的算法是，总胆固醇减去高密度脂蛋白胆固醇，再除以高密度脂蛋白胆固醇。有人把它叫作动脉硬化指数，说小于4就安全，超过4就有动脉硬化。你可能一算超过了，心里一下就紧张了：血管是不是已经堵了？\n先别往这一步想。这个公式算的是血脂之间的比例，不是血管里面还剩多少空间。报告上没有斑块大小、血管宽窄这些信息，做一次加减除法，也不会凭空得到这些信息。所以结果超过4，不能直接诊断动脉硬化；小于4，也不能保证血管没问题。\n那血脂和血管，到底是什么关系？\n低密度脂蛋白胆固醇长期偏高，会促进动脉粥样硬化，增加心梗、脑梗的风险。这也是为什么医生会让你控制低密度。但它更像是在告诉你，有一个危险因素需要处理，而不是告诉你，哪条血管已经堵了多少。\n你比如说，两个低密度数值一样的人，一个刚发现升高，另一个已经高了很多年，还长期吸烟、血压偏高，他们的情况就可能很不一样。只看这一张化验单，分不出这些差别。\n所以3.4毫摩尔每升也不是一条“堵没堵”的分界线。超过了，需要评估怎么控制；没超过，也要看你有没有其他疾病。有些已经得过心梗、脑梗的人，低密度需要控制得更低，不能看到报告没有箭头，就认为已经达标。\n还有人会想，我的高密度挺高，是不是能把低密度抵消掉？\n高密度参与把胆固醇运回肝脏处理，但它不是血管里的清洁工，不能保证把斑块清干净。高密度不错，低密度该控制还是要控制，也不能靠一个比值好看，就忽略其他问题。\n那拿到报告以后，怎么做才有用？\n先看低密度具体是多少，再把自己的情况一起带给医生：以前有没有心脑血管病，血压血糖怎么样，抽不抽烟，平时有没有不舒服。医生把这些放在一起，才能判断你需要先调整生活方式，还是同时用药，以及有没有必要进一步查血管。\n如果确实需要了解血管有没有斑块、有没有狭窄，就要选择相应的检查，而不是继续换公式算。不过，也不是血脂一高，就得把所有血管检查都做一遍，查什么取决于你具体的情况。\n所以，已经算出超过4的，不必直接给自己下结论；算出小于4的，也别拿它当作不用复诊的理由。与其纠结这个比值，不如在看诊时问清楚：我的低密度目标是多少，现在需要怎么处理？这两件事弄明白了，后面的复查和治疗才有方向。\n", "source": "本地DOCX；已核对候选记录MD5", "error": "", "recomputedScore": 0.0927}, {"messageId": 197102, "title": "刘伟伟kp2 ZY 查出肾病以后，会好转、长期稳定，还是走向尿毒症？", "recordedScore": 0.0863, "body": "封面：肾病不等于肾衰\n标题：查出肾病以后，会好转、长期稳定，还是走向尿毒症？\n#抖出健康知识宝藏 #健康科普进行时 #慢性肾病 #肾脏健康 #科学护肾\n很多人刚查出肾脏指标异常，第一反应就会联想到尿毒症，总觉得肾病最后一定会走到这一步，这其实是最常见的认知误区。肾病后续的发展大致可以分成三种情况：有些人的病情能够缓解，有些人需要长期治疗，但肾功能可以保持稳定，还有一些人的损伤会继续进展。\n先说第一种，缓解。有些肾病不光治得好，还有一部分会自己缓解。比如微小病变型肾病，很多患者对激素治疗反应较好；部分膜性肾病、IgA肾病患者，也可能出现蛋白尿减少甚至消失的情况。儿童紫癜性肾炎中，也有不少预后较好的患者，但仍要结合肾脏受累程度判断。\n但检查结果恢复正常，和疾病已经彻底根除，不完全是一回事。病情缓解以后，仍可能需要随访，不能因为听说有人自行好转，就自己停药等着恢复。是否需要治疗、什么时候调整，要看你自己的病情。\n第二种也就是很多人一听肾病就想到的那个结局，尿毒症。但真实情况并不是这样。有数据，显示，在所有慢性肾病患者当中，最终进展到尿毒症的只有1%到2%。也就是说，100个肾病患者里，只有1到2个人会在有生之年走到那一步。那有人可能会问，是不是只要肾病没法根除，就早晚都会发展成尿毒症？并不是。绝大多数肾病进展非常缓慢，在规范治疗和良好的生活管理下，也许走不到那一步。\n第三种，也是占比最高的情况，大约 88% 的肾病患者，会长期和肾病共存，这也是对日常生活影响最小的一种状态。这类人群的尿蛋白可能会一直存在，但是可以稳定控制在 0.5 克以内，甚至控制到 0.3 克以下。肾功能长期保持平稳，估算肾小球滤过率每年下降幅度不足 1 毫升，血压维持在 130/80mmHg 以内。平时需要长期服用药物，部分人会配合小剂量中药调理。除去需要坚持服药之外，社交、上班、外出旅行，甚至结婚生育，和健康人群差别不大，只是要多做好几件小事，按时复查、保持低盐饮食、不长期熬夜、每天规律吃药。就拿 IGA 肾病举例，门诊里面不少患者患病二三十年，肾功能依旧保持稳定，这样的例子并不少见。\n因此，知道肾病可以长期管理以后，接下来要做的是把管理落实。\n第一，早发现。早期可能没有明显不适，体检中的尿液和肾功能检查值得关注；已经确诊的人，则要按医生安排复查，不能因为这一年身体感觉不错就省掉检查。\n第二，早治疗。坚持规范治疗，沙坦、列净是肾脏保护的基础用药，不能自己随意停药。来路不明的偏方不要尝试，部分偏方含有马兜铃酸，会直接造成肾脏损伤。\n第三，有一个良好的生活习惯很重要。饮食上注意少盐，蛋白质的种类和摄入量按病情安排，不要自行越减越少；作息尽量规律，注意预防感染，还要坚持随访。\n最后我想说，不要一查出问题就觉得要透析，也不必靠“多数人没事”来安慰自己。做好长期的疾病管理，稳住各项指标，就不用一直活在对尿毒症的恐惧当中。如果有肾脏相关的疑问，都可以留下来沟通。\n", "source": "本地DOCX；已核对候选记录MD5", "error": "", "recomputedScore": 0.0863}], "unavailableCount": 0, "matchStatus": "needs_review", "unavailableReasons": []}, "result": "待核对"}, {"id": "242803", "doctor": "刘伟伟", "time": "2026-11-09 04:27:37", "group": "处理正确", "action": "applied", "reason": "已核实七状态交接", "verdict": "来源消息与实际状态历史对应，确认程序已写入本地状态；不等同于全部已写回飞书。", "task": "fbf93cc7", "title": "蛋黄还能吃吗", "local": "待剪辑", "remote": "待剪辑", "recordId": "reczz28XnoLzXGSL", "hold": "", "enabled": true, "notes": ["已核对状态历史v2：文案确认中 → 待剪辑，写入时间2026-11-09 12:18:50；来源消息就是242803。", "程序原始结果：已核实七状态交接。", "本次只读核验：本地视频文件通过校验。不等于本次重新验证了云端播放。", "匹配缓存：达标候选1个，采样20秒，结果matched；最高3个候选分数列在下方。", "当前身份目录中的发送人职责：医生；职责目录是本次读取值，不冒充历史身份快照。"], "history": [{"version": 2, "before": "文案确认中", "after": "待剪辑", "at": "2026-11-09 12:18:50"}], "sync": {"text": "当前本地与飞书一致；本条历史没有完整写回回执，不能声称每次历史推进均由程序同步。", "attention": false, "records": []}, "windows": ["
